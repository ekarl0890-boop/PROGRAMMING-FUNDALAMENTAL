imilar count\u003c15 example would give 15. A18: key A (for) is the closest pre-test-loop match. B (do-while) is also repetition, so \"same concept\" is loosely worded. A20: the key says B, but one unbraced body statement is legal. No listed repair correctly identifies the actual issue. A21: the key says D, but p\u003c=10 prints 12 too. Correct condition p\u003c10 is absent. A23: key C uses string[10][15], but A char[10][15] also declares a 2D array of the specified dimensions. The question does not specify type. A25: C gives first/last indexes 0,9; English says last/first while Malay says first/last.","route":"guide/42"},{"kind":"guide","label":"Optional guide · section 43","title":"Objective answers: Session II","text":"DFC10353 II: corrected / intended ['Q', 'Ans', 'Q', 'Ans', 'Q', 'Ans'] [['1', 'D', '11', 'B', '21', 'B'], ['2', 'B', '12', 'A', '22', 'A'], ['3', 'C', '13', 'D', '23', 'D'], ['4', 'B', '14', 'C', '24', 'A'], ['5', 'D', '15', 'C', '25', 'C'], ['6', 'B', '16', 'B', '26', 'B'], ['7', 'A', '17', 'D', '27', 'B'], ['8', 'C', '18', 'C', '28', 'A'], ['9', 'A', '19', 'B', '29', 'D'], ['10', 'B', '20', 'C', '30', 'C']] A5 is corrected from the source key C to D. A26 uses the intended index choice; its arrows must also be fixed. Exceptions and context A5: D, Decision. The supplied scheme incorrectly selects C, Terminator. A12: A is the expected stream-output answer. printf in C is also usable in C++ with its proper header/declaration; do not teach that printf is forbidden in C++. A14: intended values are x=3, y=4, hence C. The source uses legacy void main(); use int main() for valid standard code. A20: C is the intended loop with its update inside the body. B is syntactically legal too, but i++ is outside the loop; for i\u003c=5 it cannot make progress. A26: intended B for numbers[1][0]. Every printed choice uses cout >> and is invalid as output code. Use cout \u003c\u003c numbers[1][0];.","route":"guide/43"},{"kind":"guide","label":"Optional guide · section 44","title":"Objective answers: related paper R","text":"DFC20303: intended source answers ['Q', 'Ans', 'Q', 'Ans', 'Q', 'Ans'] [['1', 'C', '11', 'A', '21', 'C'], ['2', 'D', '12', 'C', '22', 'B'], ['3', 'A', '13', 'B', '23', 'A'], ['4', 'A', '14', 'C', '24', 'D'], ['5', 'D', '15', 'B', '25', 'B'], ['6', 'C', '16', 'B', '26', 'B'], ['7', 'C', '17', 'B', '27', 'D'], ['8', 'A', '18', 'D', '28', 'C'], ['9', 'A', '19', 'B', '29', 'D'], ['10', 'D', '20', 'A', '30', 'C']] This is supplementary practice from another course code. Its answer letters do not increase DFC10353 recurrence counts. Important exceptions A5: both C (int const ...) and D (const int ...) are valid constants. The source key picks D. A23: intended A, first character. In modern C++ the printed char* initialization from a string literal is invalid; D describes that compile-time problem. With const char*, *nama yields Z. A26: the printed prototype is missing a return type. With that repaired, B is the exact type match; other listed calls may compile through implicit conversions, so \"correctly corresponds\" is not a precise uniqueness rule. A30: three reference parameters double x,y,z to 2,6,14, so C. Use the R question ledger for chapter/extension mappings. Pointers, structures and references need their own explanation before attempting these items.","route":"guide/44"},{"kind":"guide","label":"Optional guide · section 45","title":"Teach your classmates in 90 minutes","text":"Use a predictable rhythm ['Minutes', 'Teach / practise'] [['0-10', 'IPO, symbols, definitions and types'], ['10-20', 'Minimal C++; names and I/O'], ['20-45', 'Selection, switch and loops'], ['45-60', '1D/2D arrays and traversal'], ['60-75', 'Function anatomy and returned values'], ['75-90', 'Mixed retrieval + correct mistakes']] Treat this as a suggested session plan, not a promise about the next paper. For every topic: explain -> trace -> write Explain the rule in one sentence. Trace a tiny example together. Ask classmates to write a changed version without looking. Ask someone to explain why the result changes. Four questions to keep asking What is the initial value? Which line executes next? Does the condition include the boundary? What exactly is printed or returned? Show the source corrections before distributing answer-key answers. Teach the correct rule and the intended exam skill separately when the source is flawed.","route":"guide/45"},{"kind":"guide","label":"Optional guide · section 46","title":"A 3-hour revision route","text":"Build working skill first ['Time', 'Task'] [['0-15 min', 'Names/types/I/O + minimal program'], ['15-60 min', 'if/switch + all three loops'], ['60-85 min', 'IPO, pseudocode and symbols'], ['85-110 min', 'Array indexes + 1D/2D loops'], ['110-135 min', 'Prototypes, calls and functions'], ['135-165 min', 'Closed-notes mixed questions'], ['165-180 min', 'Correct errors; explain out loud']] If you have longer, repeat the papers under timed conditions rather than only rereading. Readiness checklist I can write a complete area program. I can explain the three control structures. I can trace an unbraced if and switch fall-through. I can write a for loop with correct bounds. I can convert while/do-while without moving the output. I can locate the fifth and last array elements. I can write a prototype and a returned-value function. Use ratings sensibly Do not spend equal time on all 421 note pages. Read the high-priority explanation, then use the other examples as practice. Skim repeated dividers and introductory slides.","route":"guide/46"},{"kind":"guide","label":"Optional guide · section 47","title":"Closed-notes mini test","text":"Write or trace; do not just recognise 1. State the input, process and output for a circle-area calculator using radius and 3.142. 2. Give four valid identifier rules and correct 2ndValue. 3. With mark=35, trace an if(mark>=50) controlling only cout\u003c\u003c\"Pass\"; followed by an unconditional cout\u003c\u003cmark;. 4. Write a for loop that prints 10 8 6 4 2. 5. Explain why do{p+=2;cout\u003c\u003cp;}while(p\u003c=10); starting p=0 prints one extra value. Array and function tasks 6. int a[4]={4,2,0,3}; What is printed by a loop displaying 10-a[i] with no separators? 7. Declare a 2x3 int array {{1,2,3},{4,5,6}} and print its second-row, third-column element. 8. Write the prototype for printValue taking one string and returning nothing. 9. Define areaRectangle taking two ints and returning their product as int. 10. Explain pass by value vs reference, and which one can modify the caller's int. Check answers on the next page only after writing your own. If a rule is unclear, revisit the original page and the separate source checks.","route":"guide/47"},{"kind":"guide","label":"Optional guide · section 48","title":"Mini test: checked answers","text":"Answers 1-5 1. Input radius; process area=3.142*radius*radius; output area. 2. Use letters/digits/underscores; start with a letter/underscore; no spaces; no keywords. Example corrected name: secondValue. Names are case-sensitive. 3. 35. The condition is false, so Pass is skipped; the later unconditional cout still runs. for(int i=10; i>=2; i-=2)\n    cout \u003c\u003c i \u003c\u003c \" \"; None  None 5. The body prints before testing. At p=10, p\u003c=10 is still true, so the next iteration prints 12. Use p\u003c10. Answers 6-10 6. 68107 (the values 6,8,10,7 with no separators). int a[2][3]={{1,2,3},{4,5,6}};\ncout \u003c\u003c a[1][2]; // 6 None  None void printValue(string text); None  None int areaRectangle(int length,\n                  int width) {\n    return length * width;\n} None  None 10. Value copies the value; a reference aliases the caller's object and can change it unless const prevents modification.","route":"guide/48"},{"kind":"guide","label":"Optional guide · section 49","title":"Verification and further reference","text":"Checks completed for this pack Every supplied PDF was inventoried and read using text extraction plus local image recognition. Question pages and suspicious answers were checked visually. The 141-item ledger separates primary and related evidence. Primary marks reconcile to 100 per paper. Every original note/outline page is mapped once. Rebuilt executable examples were compiled and their outputs checked. Fixed page layouts were rendered and inspected. Scope limit The pack reflects the supplied files. No exam blueprint or upcoming paper was provided. A lecturer may change coverage or weighting. Primary C++ reference used for corrections The public C++ working draft at eel.is/c++draft was consulted for main, identifiers, arrays, loops, aggregate initialization and arithmetic. These references support language behaviour, not the upcoming exam. Useful sections: basic.start.main; lex.name; dcl.array; dcl.init.aggr; stmt.for; stmt.do; stmt.cont; expr.mul. Source-location convention Ch1/Ch2 etc mean the original chapter PDFs. I/II/R refer to the full question PDFs listed at the start. PDF page numbering includes covers and blank scans. Use the offline navigator for exact question-to-topic references and the page-by-page correction list.","route":"guide/49"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p6","title":"History and uses of languages","text":"Treat the timeline as a simplified overview. FORTRAN was an early widely used high-level language, not the first high-level language in every historical definition.","route":"checks/01/6"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p7","title":"Machine, assembly and high-level languages","text":"Do not copy the illustrative binary listing as an executable x86 addition example; the ADD encoding shown is not a reliable matching instruction sequence.","route":"checks/01/7"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p14","title":"Five generations of languages","text":"Use SQL for 4GL and Prolog for 5GL in this course. Generation labels are a teaching classification; do not infer every AI language is 5GL.","route":"checks/01/14"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p17","title":"Assembler, compiler and interpreter","text":"clrscr() is a legacy, non-standard facility. For a modern syntax example use cout \u003c\u003c \"Hello\"; with \u003ciostream>.","route":"checks/01/17"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p20","title":"Assembler, compiler and interpreter","text":"Interpreter behaviour depends on implementation. SQL may be compiled/optimised by a database; it is not inherently interpreted one line at a time.","route":"checks/01/20"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p27","title":"Algorithms and their three patterns","text":"The true and false paths are branches, not loops. Selection does not imply repetition.","route":"checks/01/27"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p29","title":"Flowcharts and symbols","text":"On-page connectors continue on the same page; off-page connectors continue on another page.","route":"checks/01/29"},{"kind":"checks","source":"01","label":"Source check · Chapter 1 · Introduction · p30","title":"Flowcharts and symbols","text":"The left symbol table is the reliable key. Use rounded/oval start and end symbols; the right example uses misleading rectangular start/end boxes.","route":"checks/01/30"},{"kind":"checks","source":"02","label":"Source check · Chapter 1 · Summary · p1","title":"Program, programmer and programming","text":"Skim historical dates. Focus on definitions and exam tasks rather than the simplified claim about the first high-level language.","route":"checks/02/1"},{"kind":"checks","source":"02","label":"Source check · Chapter 1 · Summary · p3","title":"Five generations of languages","text":"Choose SQL for 4GL and Prolog for 5GL. Avoid treating language generations as a precise modern taxonomy.","route":"checks/02/3"},{"kind":"checks","source":"02","label":"Source check · Chapter 1 · Summary · p4","title":"Input, process and output","text":"The compiler/interpreter contrast is a course-level simplification. Know the core difference rather than claiming every implementation works identically.","route":"checks/02/4"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p6","title":"Navigation / learning outcomes","text":"Linker errors are a separate build stage, before runtime. A missing function definition commonly causes a linker error.","route":"checks/03/6"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p20","title":"Preprocessor directives","text":"Use \u003ccmath>, not \u003cmath>. #include includes a header; it does not itself call any function.","route":"checks/03/20"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p22","title":"Preprocessor directives","text":"#define defines a macro, not an ordinary C++ function. Prefer const for a typed constant in new code.","route":"checks/03/22"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p25","title":"Choose the right header","text":"Standard C++ library headers such as \u003ciostream> and \u003cstring> do not use a .h suffix.","route":"checks/03/25"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p26","title":"Choose the right header","text":"Use \u003ccmath> for pow, sqrt and exp. cin/cout are stream objects. exp(x) computes e raised to x.","route":"checks/03/26"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p27","title":"Choose the right header","text":"Use \u003ccctype> for character tests and \u003ccstring> for strlen/strncmp/strtok/strncpy. clrscr/conio are non-standard legacy facilities.","route":"checks/03/27"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p29","title":"main(), namespaces and function bodies","text":"Correct the entry function to int main(). A bare main() with no return type and void main() are not standard C++.","route":"checks/03/29"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p30","title":"main(), namespaces and function bodies","text":"A function header includes its return type, name and parameter list, not only its name.","route":"checks/03/30"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p32","title":"return statements","text":"return ends the current function, not necessarily the entire program. At the end of main, falling off the end is equivalent to return 0;.","route":"checks/03/32"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p33","title":"main(), namespaces and function bodies","text":"Write using namespace std; with lowercase using. Alternatively write std::cout, std::cin and std::string.","route":"checks/03/33"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p35","title":"Input and output","text":"The single-quote escape is backslash followed by a single quote ('). The source repeats the double-quote entry by mistake.","route":"checks/03/35"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p36","title":"Input and output","text":"The void print() function displays text and returns no value. The source comment claiming a returned value is incorrect.","route":"checks/03/36"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p39","title":"Readable code and good practice","text":"The left rewrite is not generally equivalent: replacing nested if(a),if(b),if(c) with early returns on a,b,c changes behaviour. Guard clauses usually reject !a, !b, !c, with the intended work afterward.","route":"checks/03/39"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p42","title":"Identifiers and reserved words","text":"cin and cout are standard library identifiers/objects; they are not reserved keywords. int, if and return are keywords.","route":"checks/03/42"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p44","title":"Identifiers and reserved words","text":"For ordinary ASCII names, the first character may be a letter or underscore. There is no general 31-character C++ identifier limit. Prefer a leading letter to avoid reserved names.","route":"checks/03/44"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p50","title":"Constants","text":"3.1459 is not a normal pi approximation. Use the question's given 3.142, or a suitable approximation such as 3.14159 when no value is specified.","route":"checks/03/50"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p53","title":"Initialize before reading","text":"int a; cin >> a; is input assignment after declaration, not initialization at the declaration. auto deduces a type; it is not a class here.","route":"checks/03/53"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p54","title":"Initialize before reading","text":"An ordinary local int declared without initialization has no usable predictable value. Global/static scalar variables are zero-initialized; do not generalise to all variables.","route":"checks/03/54"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p55","title":"Initialize before reading","text":"There is no defined numeric output to trace from cout \u003c\u003c x when the ordinary local int x is uninitialized. Fix with int x = 0;.","route":"checks/03/55"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p56","title":"Local and global variables","text":"The local global=2 hides the global global=5, so the displayed value is 2.","route":"checks/03/56"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p57","title":"Local and global variables","text":"Local variables can be declared anywhere inside their block before use. Scope is a block concept, not only a whole-function concept.","route":"checks/03/57"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p59","title":"Local and global variables","text":"This does not compile: age is local to func() and is not visible in main(). There is no valid output.","route":"checks/03/59"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p60","title":"Local and global variables","text":"The output is Age is: 18 because func() prints its own local age.","route":"checks/03/60"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p63","title":"Local and global variables","text":"The two calls display 5 then 10, each on its own line.","route":"checks/03/63"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p64","title":"Local and global variables","text":"Output is \"Value of global x is 0\" then \"Value of local x is 10\". The first label is wrong: the global variable is actually named y.","route":"checks/03/64"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p65","title":"Local and global variables","text":"For these simple scalar examples, globals start at zero; ordinary local scalars do not. Do not read an uninitialized local as if it had a reliable garbage value.","route":"checks/03/65"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p66","title":"Identifiers and reserved words","text":"Keywords belong to the language, not the standard library. Names such as std::string, cin and cout are not C++ keywords.","route":"checks/03/66"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p70","title":"Data types and suitable choices","text":"Floating-point types represent a finite set of approximations, not all real numbers. Empty strings are valid too.","route":"checks/03/70"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p71","title":"Data types and suitable choices","text":"double usually gives more precision/range than float; C++ does not require it to use twice the storage. Write 2500000.17, without spaces inside the literal.","route":"checks/03/71"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p73","title":"Data types and suitable choices","text":"A typical float has about 6-7 significant decimal digits, not a fixed maximum of six decimal places.","route":"checks/03/73"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p76","title":"Data types and suitable choices","text":"The empty string is \"\" (no space). \" \" contains one space. std::string is a library type, not a keyword; include \u003cstring>.","route":"checks/03/76"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p79","title":"Write, compile, link and run","text":"Compilation generally produces object code; linking produces the executable. A compiled executable is normally platform-specific.","route":"checks/03/79"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p83","title":"Syntax, runtime and logic errors","text":"Separate compile-time, link-time and runtime problems. A linker error does not occur while the finished program is executing.","route":"checks/03/83"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p87","title":"Syntax, runtime and logic errors","text":"The stray semicolon in if(i>10); makes the following block unconditional: a logic problem. Integer division by zero is undefined behaviour and may fail at runtime.","route":"checks/03/87"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p88","title":"Syntax, runtime and logic errors","text":"Do not run integer division by zero expecting a portable output or guaranteed message. Check that the divisor is nonzero first.","route":"checks/03/88"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p90","title":"Syntax, runtime and logic errors","text":"The semicolon after for(...) makes an empty loop. The following block runs once; remove the stray semicolon for five prints.","route":"checks/03/90"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p100","title":"Assignment and compound assignment","text":"Each separate example displays 15.","route":"checks/03/100"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p103","title":"Arithmetic and integer division","text":"With x=5,y=3, subtraction prints 2; addition prints 8. Treat them as separate programs.","route":"checks/03/103"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p104","title":"Arithmetic and integer division","text":"12/3 prints 4; 5%2 prints 1.","route":"checks/03/104"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p108","title":"Pre/post increment and decrement","text":"Starting separately from x=5, ++x prints 6 and --x prints 4.","route":"checks/03/108"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p109","title":"Pre/post increment and decrement","text":"After int j=x++ with x initially 5, x is 6 and j is 5. Preserve any literal spaces/newlines when writing the output.","route":"checks/03/109"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p113","title":"Relational comparisons","text":"The equality example displays 0; the greater-than example displays 1.","route":"checks/03/113"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p116","title":"Logical expressions and truth tables","text":"The malformed x !0 is intended as x != 0. For x=2,y=3 the listed results are 1,1,0,1,1,0,1,0.","route":"checks/03/116"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p117","title":"Logical expressions and truth tables","text":"The eight rows evaluate to 1,0,0,1,1,0,1,0 in order.","route":"checks/03/117"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p118","title":"Logical expressions and truth tables","text":"The OR example prints 1. !(x>3 && x\u003c10), with x=5, prints 0.","route":"checks/03/118"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p119","title":"Operator precedence","text":"This is a simplified precedence list. Prefix and postfix increment have different precedence; use parentheses and simple statements for clear exam work.","route":"checks/03/119"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p120","title":"Operator precedence","text":"The grouping shown is ((x+y)==z)&&(m-n). Precedence alone does not guarantee that + executes before -; && short-circuits its right operand.","route":"checks/03/120"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p121","title":"Pre/post increment and decrement","text":"If each part starts fresh: x++ yields 8 then x=9; x-- yields 8 then x=7; y++ yields 6 then y=7; y-- yields 6 then y=5. The three logic answers are 0,1,1.","route":"checks/03/121"},{"kind":"checks","source":"03","label":"Source check · Chapter 2 · Fundamentals · p122","title":"Arithmetic and integer division","text":"Arithmetic answers: 12,1,16,15. Boolean x values: 1,0,1,0. These are independent parts.","route":"checks/03/122"},{"kind":"checks","source":"04","label":"Source check · Chapter 2 · Summary · p3","title":"Choose the right header","text":"Use \u003ccmath>, not \u003cmath>. For ordinary console programs use int main().","route":"checks/04/3"},{"kind":"checks","source":"04","label":"Source check · Chapter 2 · Summary · p4","title":"Identifiers and reserved words","text":"The PI value 3.1459 is a typo; use the question's given value or 3.14159. A name may start with a letter or underscore, followed by letters/digits/underscores. Some leading-underscore forms are reserved; use a leading letter in your own code.","route":"checks/04/4"},{"kind":"checks","source":"04","label":"Source check · Chapter 2 · Summary · p5","title":"Data types and suitable choices","text":"An M/F code is char, text is string, a true/false flag is bool. A global must be declared before the point where it is used.","route":"checks/04/5"},{"kind":"checks","source":"04","label":"Source check · Chapter 2 · Summary · p7","title":"Logical expressions and truth tables","text":"The missing OR operator is ||. OR means at least one true, including when both are true.","route":"checks/04/7"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p10","title":"Sequential solutions","text":"Sequential flowcharts still use input/output and terminator symbols when needed. Not every box is a process rectangle.","route":"checks/05/10"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p14","title":"Selection / if...else","text":"These are true/false branches, not true/false loops.","route":"checks/05/14"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p18","title":"Selection / if...else","text":"end if is pseudocode notation. C++ uses braces to group statements and has no end if keyword.","route":"checks/05/18"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p22","title":"Selection / if...else","text":"Braces are needed to group multiple statements under one condition, not because a condition has multiple true cases.","route":"checks/05/22"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p31","title":"Selection / if...else","text":"The test number>=0 means nonnegative. Zero is neither positive nor negative; label it separately or say nonnegative.","route":"checks/05/31"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p33","title":"Nested if and else-if ladders","text":"These are illustrative nesting patterns, not the only three formally defined types of nested if.","route":"checks/05/33"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p34","title":"Nested if and else-if ladders","text":"If condition2 is false, condition3 is not evaluated; do not claim condition3 is known to be false.","route":"checks/05/34"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p37","title":"switch, break and fall-through","text":"A switch can execute following cases when break is omitted. One selected entry point does not guarantee only one case body runs.","route":"checks/05/37"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p40","title":"switch, break and fall-through","text":"break transfers control out of the switch. Without break, following statements execute by fall-through; it does not re-test every next case.","route":"checks/05/40"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p41","title":"switch, break and fall-through","text":"With day=4, the output is Thursday.","route":"checks/05/41"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p43","title":"switch, break and fall-through","text":"With grade D the output is You passed, then Your grade is D. Cases B and C share the same body.","route":"checks/05/43"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p44","title":"switch, break and fall-through","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/05/44"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p45","title":"switch, break and fall-through","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/05/45"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p50","title":"Nested if and else-if ladders","text":"Use valid mark range 0..100, then descending thresholds 80,70,60,50. 80 must get A and 49 must fail.","route":"checks/05/50"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p51","title":"Nested if and else-if ladders","text":"Validate age and category. Apply child ages before adult categories if children are determined by age; the problem is ambiguous for an adult labelled Children.","route":"checks/05/51"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p60","title":"Loop components and selection","text":"This is an unrolled repetition example, not a model loop solution. A loop performs a counter/update process even without numeric user input.","route":"checks/05/60"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p66","title":"while loops","text":"The example with i=0 and i\u003c5 prints 0,1,2,3,4, each on a new line.","route":"checks/05/66"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p68","title":"while loops","text":"factorial starts at 1; 0! is 1. Restrict inputs to a small nonnegative range so the chosen integer type does not overflow.","route":"checks/05/68"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p69","title":"while loops","text":"If you mean positive even numbers, use i=2; while(i\u003c20){cout\u003c\u003ci\u003c\u003c\" \"; i+=2;}. If zero is included, start at 0 and state that choice.","route":"checks/05/69"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p70","title":"while loops","text":"Initialize sum=0 and count=0; read one value, add it, and advance the count until five inputs have been processed.","route":"checks/05/70"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p74","title":"do...while loops","text":"counter; alone does not change the counter. Use an update such as ++counter or counter += 1;.","route":"checks/05/74"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p78","title":"do...while loops","text":"The values are 10 through 19 inclusive, each labelled value of a:.","route":"checks/05/78"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p81","title":"for loops and counting","text":"Correct the sentence: a for loop continues while the condition is TRUE and stops when it becomes FALSE.","route":"checks/05/81"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p84","title":"for loops and counting","text":"Write lowercase for, not For. C++ keywords are case-sensitive.","route":"checks/05/84"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p85","title":"for loops and counting","text":"The first example prints 0..4. The step-by-two example prints 0,2,4,6,8,10.","route":"checks/05/85"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p86","title":"for loops and counting","text":"Hello World is printed 10 times.","route":"checks/05/86"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p87","title":"for loops and counting","text":"As with the while factorial, start the product at 1 and keep the input within the chosen integer type's range.","route":"checks/05/87"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p92","title":"break","text":"break occurs at i==4 before printing it, so the output is 0,1,2,3 on separate lines.","route":"checks/05/92"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p94","title":"break","text":"The sentinel 0 ends input. The sample sum is 4+3.4+6.7-4.5=9.6.","route":"checks/05/94"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p98","title":"continue","text":"The loop prints 0..9 except 4. continue skips the print for i==4.","route":"checks/05/98"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p100","title":"continue","text":"Output values are 1,2,4,5 separated by tabs, then the message You are out of the for loop.","route":"checks/05/100"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p101","title":"continue","text":"Output is 1,2,3,4,5,7,8,10 separated by tabs. Values 6 and 9 are skipped.","route":"checks/05/101"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p102","title":"continue","text":"The example advances a before continue at a==15, so it prints 10..14 and 16..19 without getting stuck.","route":"checks/05/102"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p103","title":"break, continue and exit","text":"break exits the nearest enclosing loop or switch; it does not merely terminate one ordinary statement. continue skips the rest of one iteration.","route":"checks/05/103"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p105","title":"exit()","text":"Use \u003ccstdlib> and std::exit(status). A nonzero code signals status to the environment; it does not automatically display an error message.","route":"checks/05/105"},{"kind":"checks","source":"05","label":"Source check · Chapter 3 · Control structures · p107","title":"exit()","text":"Only The value of x :10 is printed before exit(0). The later cout is never reached.","route":"checks/05/107"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p7","title":"Declare and initialize 1D arrays","text":"A 1D array is a linear sequence; a drawing as one row is a visual aid. x[7] in a declaration specifies size, not a valid eighth element.","route":"checks/06/7"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p9","title":"Declare and initialize 1D arrays","text":"Use lowercase int x[3];. x and X are different identifiers.","route":"checks/06/9"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p10","title":"Declare and initialize 1D arrays","text":"These declarations are separate examples; repeatedly declaring number in the same scope would be an error. Missing braced elements become zero.","route":"checks/06/10"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p11","title":"Access and update array elements","text":"nombor[3] is outside the valid indexes 0..2. Do not read it or invent an output.","route":"checks/06/11"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p17","title":"Access and update array elements","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/06/17"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p19","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/06/19"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p21","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/06/21"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p25","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/06/25"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p26","title":"Access and update array elements","text":"Answers: int alpha[15]; alpha[9]; alpha[4]=35; alpha[8]=alpha[4]+alpha[5];. Read only elements that have first been assigned values.","route":"checks/06/26"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p27","title":"Access and update array elements","text":"The intended output is 8.7 because 1+2 is index 3. Use int main() in a standard complete program.","route":"checks/06/27"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p28","title":"Use loops with arrays","text":"The code prints 1 through 10, each on a new line. It does not access an array.","route":"checks/06/28"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p29","title":"Use loops with arrays","text":"The output is the ten values 1 through 10, each on a new line.","route":"checks/06/29"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p30","title":"Declare and initialize 1D arrays","text":"Answers: int my_student[10]; staff[9] (if staff has >=10 elements); double matrix[5]; float my_size[5];.","route":"checks/06/30"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p31","title":"Use loops with arrays","text":"Assume i is declared or write for(int i=0;...). Outputs without separators: 4203 and 68107.","route":"checks/06/31"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p40","title":"Nested loops over 2D arrays","text":"Insert the missing comma: int array2[2][3]={{1,2,3},{4,5,6}};. Then nested loops display rows 1 2 3 and 4 5 6. Use int main().","route":"checks/06/40"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p41","title":"Initialize and access 2D arrays","text":"marks_table[1][2] is row 1, column 2: the value 72.","route":"checks/06/41"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p42","title":"Nested loops over 2D arrays","text":"Use a 3x3 string array for the table, including \u003cstring>. Rows are people; columns are first name, last name and location.","route":"checks/06/42"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p43","title":"Nested loops over 2D arrays","text":"The declaration is 3x4 but the loops visit only 2x3. For the full array use row\u003c3 and col\u003c4, or change the declaration to [2][3].","route":"checks/06/43"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p44","title":"2D arrays: rows and columns","text":"Correct the declaration to double values[][3] = {...};. The original [][] omits a required column bound. Then values[2][1] is 7.9. beta: int beta[10][20];.","route":"checks/06/44"},{"kind":"checks","source":"06","label":"Source check · Chapter 4 · Arrays · p45","title":"2D arrays: rows and columns","text":"Correct choice: long stuff[5][7];. The others omit a name or reverse the dimensions.","route":"checks/06/45"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p12","title":"Library functions","text":"\u003ccmath> is a header, not a function. sqrt(4) displays 2 and round(2.6) displays 3.","route":"checks/07/12"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p13","title":"Library functions","text":"cin >> name reads one token. Use getline(cin,name) when the input may contain spaces. name.size() returns the character count.","route":"checks/07/13"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p15","title":"User-defined functions","text":"A declaration must be visible before a call. A definition before the call also declares the function; a separate prototype is then optional.","route":"checks/07/15"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p20","title":"Function prototypes","text":"The essential rule is declaration before use. If main calls a function defined later, place its prototype before that call (commonly before main).","route":"checks/07/20"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p34","title":"Function calls and execution order","text":"Control returns to the function that called it, which may be another user-defined function rather than main. Do not fall off a value-returning function without a value.","route":"checks/07/34"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p35","title":"Function calls and execution order","text":"main is the caller only in these examples. Any appropriate function may call another function.","route":"checks/07/35"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p37","title":"Function calls and execution order","text":"void greet(){...} is a function definition (also a declaration), not merely a prototype.","route":"checks/07/37"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p38","title":"Function calls and execution order","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"checks/07/38"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p39","title":"Function calls and execution order","text":"Trace: Calling function; Called function; Back to calling function. The strings each begin with two newlines.","route":"checks/07/39"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p40","title":"Function calls and execution order","text":"Trace: Calling function; Called function; Back to calling function; Called function; Back to calling function.","route":"checks/07/40"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p41","title":"Function calls and execution order","text":"Trace: Main function; Function1; Function2; Back to function1; Back to main function. A called function can call another function.","route":"checks/07/41"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p43","title":"Four function combinations","text":"Classify by whether a return VALUE exists. A void function may contain return; without a value, so the presence of any return statement is not the distinction.","route":"checks/07/43"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p45","title":"No arguments, no return value","text":"No arguments/no returned value describes the call interface. Such a function may still read cin, print cout or access visible global data.","route":"checks/07/45"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p51","title":"Arguments, no return value","text":"void is a return type meaning no returned value. It is incorrect to say the function has no return type.","route":"checks/07/51"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p56","title":"Arguments and a returned value","text":"Together with p57, the function results are: fungsi2 returns 1000; fungsi3(18,20) displays 38; fungsi4(100,200) returns 300. Some source comments mislabel arguments.","route":"checks/07/56"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p58","title":"Four function combinations","text":"Use V=3.142*r*r*h when that pi approximation is specified. Give the four versions different names to put them in one program; C++ cannot overload by return type alone.","route":"checks/07/58"},{"kind":"checks","source":"07","label":"Source check · Chapter 5 · Functions (original) · p61","title":"Passing techniques: coverage gap","text":"Important coverage gap: the outline includes passing techniques, but no detailed Part 2 file is supplied. The new guide adds value/reference and array-parameter examples.","route":"checks/07/61"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p4","title":"Functions: purpose and advantages","text":"The sketch illustrates reuse; call welcome() three times if you want to match three Welcome outputs.","route":"checks/08/4"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p6","title":"Return type and returned value","text":"The greet example displays Hello. tambah(10,5) returns 15, which the caller displays after Hasil tambah = .","route":"checks/08/6"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p11","title":"Function prototypes","text":"The arrows illustrate organisation, not runtime execution. A prototype is not executed; control reaches the call then the definition body.","route":"checks/08/11"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p16","title":"Function calls and execution order","text":"Add void greet(); before main(), or define greet before main(), so the call has a visible declaration.","route":"checks/08/16"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p19","title":"Function definition: header and body","text":"The notation myFunction() in the last row is shorthand for the called function. The actual demonstrated call is myFunction(\"Adam\");.","route":"checks/08/19"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p25","title":"Arguments and a returned value","text":"This page omits the worked code. A complete compact version is: int area(int side){return side*side;} then int answer=area(5); gives 25.","route":"checks/08/25"},{"kind":"checks","source":"08","label":"Source check · Chapter 5 · Functions (supplied simplified) · p27","title":"Four function combinations","text":"Use different names for all four versions in one program, because return type alone cannot distinguish overloads. The formula is pi*r*r*h.","route":"checks/08/27"}],"checks":[{"source":"01","page":6,"label":"Chapter 1 · Introduction","title":"History and uses of languages","text":"Treat the timeline as a simplified overview. FORTRAN was an early widely used high-level language, not the first high-level language in every historical definition.","route":"notes/01/6"},{"source":"01","page":7,"label":"Chapter 1 · Introduction","title":"Machine, assembly and high-level languages","text":"Do not copy the illustrative binary listing as an executable x86 addition example; the ADD encoding shown is not a reliable matching instruction sequence.","route":"notes/01/7"},{"source":"01","page":14,"label":"Chapter 1 · Introduction","title":"Five generations of languages","text":"Use SQL for 4GL and Prolog for 5GL in this course. Generation labels are a teaching classification; do not infer every AI language is 5GL.","route":"notes/01/14"},{"source":"01","page":17,"label":"Chapter 1 · Introduction","title":"Assembler, compiler and interpreter","text":"clrscr() is a legacy, non-standard facility. For a modern syntax example use cout \u003c\u003c \"Hello\"; with \u003ciostream>.","route":"notes/01/17"},{"source":"01","page":20,"label":"Chapter 1 · Introduction","title":"Assembler, compiler and interpreter","text":"Interpreter behaviour depends on implementation. SQL may be compiled/optimised by a database; it is not inherently interpreted one line at a time.","route":"notes/01/20"},{"source":"01","page":27,"label":"Chapter 1 · Introduction","title":"Algorithms and their three patterns","text":"The true and false paths are branches, not loops. Selection does not imply repetition.","route":"notes/01/27"},{"source":"01","page":29,"label":"Chapter 1 · Introduction","title":"Flowcharts and symbols","text":"On-page connectors continue on the same page; off-page connectors continue on another page.","route":"notes/01/29"},{"source":"01","page":30,"label":"Chapter 1 · Introduction","title":"Flowcharts and symbols","text":"The left symbol table is the reliable key. Use rounded/oval start and end symbols; the right example uses misleading rectangular start/end boxes.","route":"notes/01/30"},{"source":"02","page":1,"label":"Chapter 1 · Summary","title":"Program, programmer and programming","text":"Skim historical dates. Focus on definitions and exam tasks rather than the simplified claim about the first high-level language.","route":"notes/02/1"},{"source":"02","page":3,"label":"Chapter 1 · Summary","title":"Five generations of languages","text":"Choose SQL for 4GL and Prolog for 5GL. Avoid treating language generations as a precise modern taxonomy.","route":"notes/02/3"},{"source":"02","page":4,"label":"Chapter 1 · Summary","title":"Input, process and output","text":"The compiler/interpreter contrast is a course-level simplification. Know the core difference rather than claiming every implementation works identically.","route":"notes/02/4"},{"source":"03","page":6,"label":"Chapter 2 · Fundamentals","title":"Navigation / learning outcomes","text":"Linker errors are a separate build stage, before runtime. A missing function definition commonly causes a linker error.","route":"notes/03/6"},{"source":"03","page":20,"label":"Chapter 2 · Fundamentals","title":"Preprocessor directives","text":"Use \u003ccmath>, not \u003cmath>. #include includes a header; it does not itself call any function.","route":"notes/03/20"},{"source":"03","page":22,"label":"Chapter 2 · Fundamentals","title":"Preprocessor directives","text":"#define defines a macro, not an ordinary C++ function. Prefer const for a typed constant in new code.","route":"notes/03/22"},{"source":"03","page":25,"label":"Chapter 2 · Fundamentals","title":"Choose the right header","text":"Standard C++ library headers such as \u003ciostream> and \u003cstring> do not use a .h suffix.","route":"notes/03/25"},{"source":"03","page":26,"label":"Chapter 2 · Fundamentals","title":"Choose the right header","text":"Use \u003ccmath> for pow, sqrt and exp. cin/cout are stream objects. exp(x) computes e raised to x.","route":"notes/03/26"},{"source":"03","page":27,"label":"Chapter 2 · Fundamentals","title":"Choose the right header","text":"Use \u003ccctype> for character tests and \u003ccstring> for strlen/strncmp/strtok/strncpy. clrscr/conio are non-standard legacy facilities.","route":"notes/03/27"},{"source":"03","page":29,"label":"Chapter 2 · Fundamentals","title":"main(), namespaces and function bodies","text":"Correct the entry function to int main(). A bare main() with no return type and void main() are not standard C++.","route":"notes/03/29"},{"source":"03","page":30,"label":"Chapter 2 · Fundamentals","title":"main(), namespaces and function bodies","text":"A function header includes its return type, name and parameter list, not only its name.","route":"notes/03/30"},{"source":"03","page":32,"label":"Chapter 2 · Fundamentals","title":"return statements","text":"return ends the current function, not necessarily the entire program. At the end of main, falling off the end is equivalent to return 0;.","route":"notes/03/32"},{"source":"03","page":33,"label":"Chapter 2 · Fundamentals","title":"main(), namespaces and function bodies","text":"Write using namespace std; with lowercase using. Alternatively write std::cout, std::cin and std::string.","route":"notes/03/33"},{"source":"03","page":35,"label":"Chapter 2 · Fundamentals","title":"Input and output","text":"The single-quote escape is backslash followed by a single quote ('). The source repeats the double-quote entry by mistake.","route":"notes/03/35"},{"source":"03","page":36,"label":"Chapter 2 · Fundamentals","title":"Input and output","text":"The void print() function displays text and returns no value. The source comment claiming a returned value is incorrect.","route":"notes/03/36"},{"source":"03","page":39,"label":"Chapter 2 · Fundamentals","title":"Readable code and good practice","text":"The left rewrite is not generally equivalent: replacing nested if(a),if(b),if(c) with early returns on a,b,c changes behaviour. Guard clauses usually reject !a, !b, !c, with the intended work afterward.","route":"notes/03/39"},{"source":"03","page":42,"label":"Chapter 2 · Fundamentals","title":"Identifiers and reserved words","text":"cin and cout are standard library identifiers/objects; they are not reserved keywords. int, if and return are keywords.","route":"notes/03/42"},{"source":"03","page":44,"label":"Chapter 2 · Fundamentals","title":"Identifiers and reserved words","text":"For ordinary ASCII names, the first character may be a letter or underscore. There is no general 31-character C++ identifier limit. Prefer a leading letter to avoid reserved names.","route":"notes/03/44"},{"source":"03","page":50,"label":"Chapter 2 · Fundamentals","title":"Constants","text":"3.1459 is not a normal pi approximation. Use the question's given 3.142, or a suitable approximation such as 3.14159 when no value is specified.","route":"notes/03/50"},{"source":"03","page":53,"label":"Chapter 2 · Fundamentals","title":"Initialize before reading","text":"int a; cin >> a; is input assignment after declaration, not initialization at the declaration. auto deduces a type; it is not a class here.","route":"notes/03/53"},{"source":"03","page":54,"label":"Chapter 2 · Fundamentals","title":"Initialize before reading","text":"An ordinary local int declared without initialization has no usable predictable value. Global/static scalar variables are zero-initialized; do not generalise to all variables.","route":"notes/03/54"},{"source":"03","page":55,"label":"Chapter 2 · Fundamentals","title":"Initialize before reading","text":"There is no defined numeric output to trace from cout \u003c\u003c x when the ordinary local int x is uninitialized. Fix with int x = 0;.","route":"notes/03/55"},{"source":"03","page":56,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"The local global=2 hides the global global=5, so the displayed value is 2.","route":"notes/03/56"},{"source":"03","page":57,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"Local variables can be declared anywhere inside their block before use. Scope is a block concept, not only a whole-function concept.","route":"notes/03/57"},{"source":"03","page":59,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"This does not compile: age is local to func() and is not visible in main(). There is no valid output.","route":"notes/03/59"},{"source":"03","page":60,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"The output is Age is: 18 because func() prints its own local age.","route":"notes/03/60"},{"source":"03","page":63,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"The two calls display 5 then 10, each on its own line.","route":"notes/03/63"},{"source":"03","page":64,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"Output is \"Value of global x is 0\" then \"Value of local x is 10\". The first label is wrong: the global variable is actually named y.","route":"notes/03/64"},{"source":"03","page":65,"label":"Chapter 2 · Fundamentals","title":"Local and global variables","text":"For these simple scalar examples, globals start at zero; ordinary local scalars do not. Do not read an uninitialized local as if it had a reliable garbage value.","route":"notes/03/65"},{"source":"03","page":66,"label":"Chapter 2 · Fundamentals","title":"Identifiers and reserved words","text":"Keywords belong to the language, not the standard library. Names such as std::string, cin and cout are not C++ keywords.","route":"notes/03/66"},{"source":"03","page":70,"label":"Chapter 2 · Fundamentals","title":"Data types and suitable choices","text":"Floating-point types represent a finite set of approximations, not all real numbers. Empty strings are valid too.","route":"notes/03/70"},{"source":"03","page":71,"label":"Chapter 2 · Fundamentals","title":"Data types and suitable choices","text":"double usually gives more precision/range than float; C++ does not require it to use twice the storage. Write 2500000.17, without spaces inside the literal.","route":"notes/03/71"},{"source":"03","page":73,"label":"Chapter 2 · Fundamentals","title":"Data types and suitable choices","text":"A typical float has about 6-7 significant decimal digits, not a fixed maximum of six decimal places.","route":"notes/03/73"},{"source":"03","page":76,"label":"Chapter 2 · Fundamentals","title":"Data types and suitable choices","text":"The empty string is \"\" (no space). \" \" contains one space. std::string is a library type, not a keyword; include \u003cstring>.","route":"notes/03/76"},{"source":"03","page":79,"label":"Chapter 2 · Fundamentals","title":"Write, compile, link and run","text":"Compilation generally produces object code; linking produces the executable. A compiled executable is normally platform-specific.","route":"notes/03/79"},{"source":"03","page":83,"label":"Chapter 2 · Fundamentals","title":"Syntax, runtime and logic errors","text":"Separate compile-time, link-time and runtime problems. A linker error does not occur while the finished program is executing.","route":"notes/03/83"},{"source":"03","page":87,"label":"Chapter 2 · Fundamentals","title":"Syntax, runtime and logic errors","text":"The stray semicolon in if(i>10); makes the following block unconditional: a logic problem. Integer division by zero is undefined behaviour and may fail at runtime.","route":"notes/03/87"},{"source":"03","page":88,"label":"Chapter 2 · Fundamentals","title":"Syntax, runtime and logic errors","text":"Do not run integer division by zero expecting a portable output or guaranteed message. Check that the divisor is nonzero first.","route":"notes/03/88"},{"source":"03","page":90,"label":"Chapter 2 · Fundamentals","title":"Syntax, runtime and logic errors","text":"The semicolon after for(...) makes an empty loop. The following block runs once; remove the stray semicolon for five prints.","route":"notes/03/90"},{"source":"03","page":100,"label":"Chapter 2 · Fundamentals","title":"Assignment and compound assignment","text":"Each separate example displays 15.","route":"notes/03/100"},{"source":"03","page":103,"label":"Chapter 2 · Fundamentals","title":"Arithmetic and integer division","text":"With x=5,y=3, subtraction prints 2; addition prints 8. Treat them as separate programs.","route":"notes/03/103"},{"source":"03","page":104,"label":"Chapter 2 · Fundamentals","title":"Arithmetic and integer division","text":"12/3 prints 4; 5%2 prints 1.","route":"notes/03/104"},{"source":"03","page":108,"label":"Chapter 2 · Fundamentals","title":"Pre/post increment and decrement","text":"Starting separately from x=5, ++x prints 6 and --x prints 4.","route":"notes/03/108"},{"source":"03","page":109,"label":"Chapter 2 · Fundamentals","title":"Pre/post increment and decrement","text":"After int j=x++ with x initially 5, x is 6 and j is 5. Preserve any literal spaces/newlines when writing the output.","route":"notes/03/109"},{"source":"03","page":113,"label":"Chapter 2 · Fundamentals","title":"Relational comparisons","text":"The equality example displays 0; the greater-than example displays 1.","route":"notes/03/113"},{"source":"03","page":116,"label":"Chapter 2 · Fundamentals","title":"Logical expressions and truth tables","text":"The malformed x !0 is intended as x != 0. For x=2,y=3 the listed results are 1,1,0,1,1,0,1,0.","route":"notes/03/116"},{"source":"03","page":117,"label":"Chapter 2 · Fundamentals","title":"Logical expressions and truth tables","text":"The eight rows evaluate to 1,0,0,1,1,0,1,0 in order.","route":"notes/03/117"},{"source":"03","page":118,"label":"Chapter 2 · Fundamentals","title":"Logical expressions and truth tables","text":"The OR example prints 1. !(x>3 && x\u003c10), with x=5, prints 0.","route":"notes/03/118"},{"source":"03","page":119,"label":"Chapter 2 · Fundamentals","title":"Operator precedence","text":"This is a simplified precedence list. Prefix and postfix increment have different precedence; use parentheses and simple statements for clear exam work.","route":"notes/03/119"},{"source":"03","page":120,"label":"Chapter 2 · Fundamentals","title":"Operator precedence","text":"The grouping shown is ((x+y)==z)&&(m-n). Precedence alone does not guarantee that + executes before -; && short-circuits its right operand.","route":"notes/03/120"},{"source":"03","page":121,"label":"Chapter 2 · Fundamentals","title":"Pre/post increment and decrement","text":"If each part starts fresh: x++ yields 8 then x=9; x-- yields 8 then x=7; y++ yields 6 then y=7; y-- yields 6 then y=5. The three logic answers are 0,1,1.","route":"notes/03/121"},{"source":"03","page":122,"label":"Chapter 2 · Fundamentals","title":"Arithmetic and integer division","text":"Arithmetic answers: 12,1,16,15. Boolean x values: 1,0,1,0. These are independent parts.","route":"notes/03/122"},{"source":"04","page":3,"label":"Chapter 2 · Summary","title":"Choose the right header","text":"Use \u003ccmath>, not \u003cmath>. For ordinary console programs use int main().","route":"notes/04/3"},{"source":"04","page":4,"label":"Chapter 2 · Summary","title":"Identifiers and reserved words","text":"The PI value 3.1459 is a typo; use the question's given value or 3.14159. A name may start with a letter or underscore, followed by letters/digits/underscores. Some leading-underscore forms are reserved; use a leading letter in your own code.","route":"notes/04/4"},{"source":"04","page":5,"label":"Chapter 2 · Summary","title":"Data types and suitable choices","text":"An M/F code is char, text is string, a true/false flag is bool. A global must be declared before the point where it is used.","route":"notes/04/5"},{"source":"04","page":7,"label":"Chapter 2 · Summary","title":"Logical expressions and truth tables","text":"The missing OR operator is ||. OR means at least one true, including when both are true.","route":"notes/04/7"},{"source":"05","page":10,"label":"Chapter 3 · Control structures","title":"Sequential solutions","text":"Sequential flowcharts still use input/output and terminator symbols when needed. Not every box is a process rectangle.","route":"notes/05/10"},{"source":"05","page":14,"label":"Chapter 3 · Control structures","title":"Selection / if...else","text":"These are true/false branches, not true/false loops.","route":"notes/05/14"},{"source":"05","page":18,"label":"Chapter 3 · Control structures","title":"Selection / if...else","text":"end if is pseudocode notation. C++ uses braces to group statements and has no end if keyword.","route":"notes/05/18"},{"source":"05","page":22,"label":"Chapter 3 · Control structures","title":"Selection / if...else","text":"Braces are needed to group multiple statements under one condition, not because a condition has multiple true cases.","route":"notes/05/22"},{"source":"05","page":31,"label":"Chapter 3 · Control structures","title":"Selection / if...else","text":"The test number>=0 means nonnegative. Zero is neither positive nor negative; label it separately or say nonnegative.","route":"notes/05/31"},{"source":"05","page":33,"label":"Chapter 3 · Control structures","title":"Nested if and else-if ladders","text":"These are illustrative nesting patterns, not the only three formally defined types of nested if.","route":"notes/05/33"},{"source":"05","page":34,"label":"Chapter 3 · Control structures","title":"Nested if and else-if ladders","text":"If condition2 is false, condition3 is not evaluated; do not claim condition3 is known to be false.","route":"notes/05/34"},{"source":"05","page":37,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"A switch can execute following cases when break is omitted. One selected entry point does not guarantee only one case body runs.","route":"notes/05/37"},{"source":"05","page":40,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"break transfers control out of the switch. Without break, following statements execute by fall-through; it does not re-test every next case.","route":"notes/05/40"},{"source":"05","page":41,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"With day=4, the output is Thursday.","route":"notes/05/41"},{"source":"05","page":43,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"With grade D the output is You passed, then Your grade is D. Cases B and C share the same body.","route":"notes/05/43"},{"source":"05","page":44,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/05/44"},{"source":"05","page":45,"label":"Chapter 3 · Control structures","title":"switch, break and fall-through","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/05/45"},{"source":"05","page":50,"label":"Chapter 3 · Control structures","title":"Nested if and else-if ladders","text":"Use valid mark range 0..100, then descending thresholds 80,70,60,50. 80 must get A and 49 must fail.","route":"notes/05/50"},{"source":"05","page":51,"label":"Chapter 3 · Control structures","title":"Nested if and else-if ladders","text":"Validate age and category. Apply child ages before adult categories if children are determined by age; the problem is ambiguous for an adult labelled Children.","route":"notes/05/51"},{"source":"05","page":60,"label":"Chapter 3 · Control structures","title":"Loop components and selection","text":"This is an unrolled repetition example, not a model loop solution. A loop performs a counter/update process even without numeric user input.","route":"notes/05/60"},{"source":"05","page":66,"label":"Chapter 3 · Control structures","title":"while loops","text":"The example with i=0 and i\u003c5 prints 0,1,2,3,4, each on a new line.","route":"notes/05/66"},{"source":"05","page":68,"label":"Chapter 3 · Control structures","title":"while loops","text":"factorial starts at 1; 0! is 1. Restrict inputs to a small nonnegative range so the chosen integer type does not overflow.","route":"notes/05/68"},{"source":"05","page":69,"label":"Chapter 3 · Control structures","title":"while loops","text":"If you mean positive even numbers, use i=2; while(i\u003c20){cout\u003c\u003ci\u003c\u003c\" \"; i+=2;}. If zero is included, start at 0 and state that choice.","route":"notes/05/69"},{"source":"05","page":70,"label":"Chapter 3 · Control structures","title":"while loops","text":"Initialize sum=0 and count=0; read one value, add it, and advance the count until five inputs have been processed.","route":"notes/05/70"},{"source":"05","page":74,"label":"Chapter 3 · Control structures","title":"do...while loops","text":"counter; alone does not change the counter. Use an update such as ++counter or counter += 1;.","route":"notes/05/74"},{"source":"05","page":78,"label":"Chapter 3 · Control structures","title":"do...while loops","text":"The values are 10 through 19 inclusive, each labelled value of a:.","route":"notes/05/78"},{"source":"05","page":81,"label":"Chapter 3 · Control structures","title":"for loops and counting","text":"Correct the sentence: a for loop continues while the condition is TRUE and stops when it becomes FALSE.","route":"notes/05/81"},{"source":"05","page":84,"label":"Chapter 3 · Control structures","title":"for loops and counting","text":"Write lowercase for, not For. C++ keywords are case-sensitive.","route":"notes/05/84"},{"source":"05","page":85,"label":"Chapter 3 · Control structures","title":"for loops and counting","text":"The first example prints 0..4. The step-by-two example prints 0,2,4,6,8,10.","route":"notes/05/85"},{"source":"05","page":86,"label":"Chapter 3 · Control structures","title":"for loops and counting","text":"Hello World is printed 10 times.","route":"notes/05/86"},{"source":"05","page":87,"label":"Chapter 3 · Control structures","title":"for loops and counting","text":"As with the while factorial, start the product at 1 and keep the input within the chosen integer type's range.","route":"notes/05/87"},{"source":"05","page":92,"label":"Chapter 3 · Control structures","title":"break","text":"break occurs at i==4 before printing it, so the output is 0,1,2,3 on separate lines.","route":"notes/05/92"},{"source":"05","page":94,"label":"Chapter 3 · Control structures","title":"break","text":"The sentinel 0 ends input. The sample sum is 4+3.4+6.7-4.5=9.6.","route":"notes/05/94"},{"source":"05","page":98,"label":"Chapter 3 · Control structures","title":"continue","text":"The loop prints 0..9 except 4. continue skips the print for i==4.","route":"notes/05/98"},{"source":"05","page":100,"label":"Chapter 3 · Control structures","title":"continue","text":"Output values are 1,2,4,5 separated by tabs, then the message You are out of the for loop.","route":"notes/05/100"},{"source":"05","page":101,"label":"Chapter 3 · Control structures","title":"continue","text":"Output is 1,2,3,4,5,7,8,10 separated by tabs. Values 6 and 9 are skipped.","route":"notes/05/101"},{"source":"05","page":102,"label":"Chapter 3 · Control structures","title":"continue","text":"The example advances a before continue at a==15, so it prints 10..14 and 16..19 without getting stuck.","route":"notes/05/102"},{"source":"05","page":103,"label":"Chapter 3 · Control structures","title":"break, continue and exit","text":"break exits the nearest enclosing loop or switch; it does not merely terminate one ordinary statement. continue skips the rest of one iteration.","route":"notes/05/103"},{"source":"05","page":105,"label":"Chapter 3 · Control structures","title":"exit()","text":"Use \u003ccstdlib> and std::exit(status). A nonzero code signals status to the environment; it does not automatically display an error message.","route":"notes/05/105"},{"source":"05","page":107,"label":"Chapter 3 · Control structures","title":"exit()","text":"Only The value of x :10 is printed before exit(0). The later cout is never reached.","route":"notes/05/107"},{"source":"06","page":7,"label":"Chapter 4 · Arrays","title":"Declare and initialize 1D arrays","text":"A 1D array is a linear sequence; a drawing as one row is a visual aid. x[7] in a declaration specifies size, not a valid eighth element.","route":"notes/06/7"},{"source":"06","page":9,"label":"Chapter 4 · Arrays","title":"Declare and initialize 1D arrays","text":"Use lowercase int x[3];. x and X are different identifiers.","route":"notes/06/9"},{"source":"06","page":10,"label":"Chapter 4 · Arrays","title":"Declare and initialize 1D arrays","text":"These declarations are separate examples; repeatedly declaring number in the same scope would be an error. Missing braced elements become zero.","route":"notes/06/10"},{"source":"06","page":11,"label":"Chapter 4 · Arrays","title":"Access and update array elements","text":"nombor[3] is outside the valid indexes 0..2. Do not read it or invent an output.","route":"notes/06/11"},{"source":"06","page":17,"label":"Chapter 4 · Arrays","title":"Access and update array elements","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/06/17"},{"source":"06","page":19,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/06/19"},{"source":"06","page":21,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/06/21"},{"source":"06","page":25,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/06/25"},{"source":"06","page":26,"label":"Chapter 4 · Arrays","title":"Access and update array elements","text":"Answers: int alpha[15]; alpha[9]; alpha[4]=35; alpha[8]=alpha[4]+alpha[5];. Read only elements that have first been assigned values.","route":"notes/06/26"},{"source":"06","page":27,"label":"Chapter 4 · Arrays","title":"Access and update array elements","text":"The intended output is 8.7 because 1+2 is index 3. Use int main() in a standard complete program.","route":"notes/06/27"},{"source":"06","page":28,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"The code prints 1 through 10, each on a new line. It does not access an array.","route":"notes/06/28"},{"source":"06","page":29,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"The output is the ten values 1 through 10, each on a new line.","route":"notes/06/29"},{"source":"06","page":30,"label":"Chapter 4 · Arrays","title":"Declare and initialize 1D arrays","text":"Answers: int my_student[10]; staff[9] (if staff has >=10 elements); double matrix[5]; float my_size[5];.","route":"notes/06/30"},{"source":"06","page":31,"label":"Chapter 4 · Arrays","title":"Use loops with arrays","text":"Assume i is declared or write for(int i=0;...). Outputs without separators: 4203 and 68107.","route":"notes/06/31"},{"source":"06","page":40,"label":"Chapter 4 · Arrays","title":"Nested loops over 2D arrays","text":"Insert the missing comma: int array2[2][3]={{1,2,3},{4,5,6}};. Then nested loops display rows 1 2 3 and 4 5 6. Use int main().","route":"notes/06/40"},{"source":"06","page":41,"label":"Chapter 4 · Arrays","title":"Initialize and access 2D arrays","text":"marks_table[1][2] is row 1, column 2: the value 72.","route":"notes/06/41"},{"source":"06","page":42,"label":"Chapter 4 · Arrays","title":"Nested loops over 2D arrays","text":"Use a 3x3 string array for the table, including \u003cstring>. Rows are people; columns are first name, last name and location.","route":"notes/06/42"},{"source":"06","page":43,"label":"Chapter 4 · Arrays","title":"Nested loops over 2D arrays","text":"The declaration is 3x4 but the loops visit only 2x3. For the full array use row\u003c3 and col\u003c4, or change the declaration to [2][3].","route":"notes/06/43"},{"source":"06","page":44,"label":"Chapter 4 · Arrays","title":"2D arrays: rows and columns","text":"Correct the declaration to double values[][3] = {...};. The original [][] omits a required column bound. Then values[2][1] is 7.9. beta: int beta[10][20];.","route":"notes/06/44"},{"source":"06","page":45,"label":"Chapter 4 · Arrays","title":"2D arrays: rows and columns","text":"Correct choice: long stuff[5][7];. The others omit a name or reverse the dimensions.","route":"notes/06/45"},{"source":"07","page":12,"label":"Chapter 5 · Functions (original)","title":"Library functions","text":"\u003ccmath> is a header, not a function. sqrt(4) displays 2 and round(2.6) displays 3.","route":"notes/07/12"},{"source":"07","page":13,"label":"Chapter 5 · Functions (original)","title":"Library functions","text":"cin >> name reads one token. Use getline(cin,name) when the input may contain spaces. name.size() returns the character count.","route":"notes/07/13"},{"source":"07","page":15,"label":"Chapter 5 · Functions (original)","title":"User-defined functions","text":"A declaration must be visible before a call. A definition before the call also declares the function; a separate prototype is then optional.","route":"notes/07/15"},{"source":"07","page":20,"label":"Chapter 5 · Functions (original)","title":"Function prototypes","text":"The essential rule is declaration before use. If main calls a function defined later, place its prototype before that call (commonly before main).","route":"notes/07/20"},{"source":"07","page":34,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"Control returns to the function that called it, which may be another user-defined function rather than main. Do not fall off a value-returning function without a value.","route":"notes/07/34"},{"source":"07","page":35,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"main is the caller only in these examples. Any appropriate function may call another function.","route":"notes/07/35"},{"source":"07","page":37,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"void greet(){...} is a function definition (also a declaration), not merely a prototype.","route":"notes/07/37"},{"source":"07","page":38,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"Modern C++ correction: use #include \u003ciostream> and int main(), with return 0; at the end. Keep the demonstrated logic.","route":"notes/07/38"},{"source":"07","page":39,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"Trace: Calling function; Called function; Back to calling function. The strings each begin with two newlines.","route":"notes/07/39"},{"source":"07","page":40,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text
