":"Trace: Calling function; Called function; Back to calling function; Called function; Back to calling function.","route":"notes/07/40"},{"source":"07","page":41,"label":"Chapter 5 · Functions (original)","title":"Function calls and execution order","text":"Trace: Main function; Function1; Function2; Back to function1; Back to main function. A called function can call another function.","route":"notes/07/41"},{"source":"07","page":43,"label":"Chapter 5 · Functions (original)","title":"Four function combinations","text":"Classify by whether a return VALUE exists. A void function may contain return; without a value, so the presence of any return statement is not the distinction.","route":"notes/07/43"},{"source":"07","page":45,"label":"Chapter 5 · Functions (original)","title":"No arguments, no return value","text":"No arguments/no returned value describes the call interface. Such a function may still read cin, print cout or access visible global data.","route":"notes/07/45"},{"source":"07","page":51,"label":"Chapter 5 · Functions (original)","title":"Arguments, no return value","text":"void is a return type meaning no returned value. It is incorrect to say the function has no return type.","route":"notes/07/51"},{"source":"07","page":56,"label":"Chapter 5 · Functions (original)","title":"Arguments and a returned value","text":"Together with p57, the function results are: fungsi2 returns 1000; fungsi3(18,20) displays 38; fungsi4(100,200) returns 300. Some source comments mislabel arguments.","route":"notes/07/56"},{"source":"07","page":58,"label":"Chapter 5 · Functions (original)","title":"Four function combinations","text":"Use V=3.142*r*r*h when that pi approximation is specified. Give the four versions different names to put them in one program; C++ cannot overload by return type alone.","route":"notes/07/58"},{"source":"07","page":61,"label":"Chapter 5 · Functions (original)","title":"Passing techniques: coverage gap","text":"Important coverage gap: the outline includes passing techniques, but no detailed Part 2 file is supplied. The new guide adds value/reference and array-parameter examples.","route":"notes/07/61"},{"source":"08","page":4,"label":"Chapter 5 · Functions (supplied simplified)","title":"Functions: purpose and advantages","text":"The sketch illustrates reuse; call welcome() three times if you want to match three Welcome outputs.","route":"notes/08/4"},{"source":"08","page":6,"label":"Chapter 5 · Functions (supplied simplified)","title":"Return type and returned value","text":"The greet example displays Hello. tambah(10,5) returns 15, which the caller displays after Hasil tambah = .","route":"notes/08/6"},{"source":"08","page":11,"label":"Chapter 5 · Functions (supplied simplified)","title":"Function prototypes","text":"The arrows illustrate organisation, not runtime execution. A prototype is not executed; control reaches the call then the definition body.","route":"notes/08/11"},{"source":"08","page":16,"label":"Chapter 5 · Functions (supplied simplified)","title":"Function calls and execution order","text":"Add void greet(); before main(), or define greet before main(), so the call has a visible declaration.","route":"notes/08/16"},{"source":"08","page":19,"label":"Chapter 5 · Functions (supplied simplified)","title":"Function definition: header and body","text":"The notation myFunction() in the last row is shorthand for the called function. The actual demonstrated call is myFunction(\"Adam\");.","route":"notes/08/19"},{"source":"08","page":25,"label":"Chapter 5 · Functions (supplied simplified)","title":"Arguments and a returned value","text":"This page omits the worked code. A complete compact version is: int area(int side){return side*side;} then int answer=area(5); gives 25.","route":"notes/08/25"},{"source":"08","page":27,"label":"Chapter 5 · Functions (supplied simplified)","title":"Four function combinations","text":"Use different names for all four versions in one program, because return type alone cannot distinguish overloads. The formula is pi*r*r*h.","route":"notes/08/27"}]}</script>
