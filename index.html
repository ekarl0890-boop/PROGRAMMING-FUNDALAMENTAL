ah = \" « hasil; return 0; int = the function returns an integer value void = the function does not return any value int = the function returns an integer value\nvoid = the function does not return any value Return type and returned value I B2(c)(ii); II A30; II B2(c)(iii)","route":"notes/08/6"},{"kind":"notes","source":"08","score":1,"label":"Chapter 5 · Functions (supplied simplified) · p7","title":"Navigation / learning outcomes","text":"SECTION 1 Types of Functions There are two main types: built-in functions and user-defined functions. SECTION 1\nTypes of Functions\nThere are two main types: built-in functions and user-defined \nfunctions.\nƒ Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/08/7"},{"kind":"notes","source":"08","score":5,"label":"Chapter 5 · Functions (supplied simplified) · p8","title":"Library functions","text":"Built-in Functions https://www.freecodecamp.org/news/helpful-built-in-functions-in-cpp/ Library functions 1 Built-in functions are already provided by C++. #include \u003ciostream› #include ‹cmath› Also called library functions. Grouped under header files. Use the correct #include before using them. using namespace std; int main() cout «\u003c sqrt (4) « end1; cout « round (2.6) « end1; return 0; Examples sqrt(4) round(2.6) Output: 2 DFC10353 Programming Fundamentals • Chapter 5 Function https://www.freecodecamp.org/news/helpful-built-in-functions-in-cpp/Built-in Functions    Library functions\nDFC10353 Programming Fundamentals • Chapter 5 Function\nBuilt-in functions are already \nprovided by C++.\nAlso called library functions.\nGrouped under header files.\nUse the correct #include before using them.\nExamples sqrt(4) round(2.6)\nOutput: \n2 \n3\n1 Library functions Syllabus support; no direct item in the two DFC10353 papers.","route":"notes/08/8"},{"kind":"notes","source":"08","score":8,"label":"Chapter 5 · Functions (supplied simplified) · p9","title":"User-defined functions","text":"User-defined Functions 2 A user-defined function is written by the programmer to perform a specific task. To use it, we usually need: • 1. Declare the function 1 2. Define the function 1 3. Use/call it in main() User-Defined Function A user-defined function is a function created by the programmer to perform a specific task. Output: 100 DFC10353 Programming Fundamentals • Chapter 5 Functions we create #include ‹iostream› using namespace std; // 1. Function Declaration int sum(int num1, int num2); int main() // 3. Function Call cout \u003c\u003c sum(1, 99); return 0; // 2. Function Definition int sum(int num1, int num2) int total = num1 + num2; return total; } Function User-defined Functions Functions we create\nDFC10353 Programming Fundamentals • Chapter 5 Function\nA user-defined function is written by the \nprogrammer to perform a specific task.\nTo use it, we usually need:\n① 1. Declare the function\n② 2. Define the function\n③ 3. Use/call it in main()\nOutput: 100\n2\nUser-Defined Function\nA user-defined function is a function created by the programmer to\nperform a specific task. User-defined functions I B2(c); II A30; II B2(c)","route":"notes/08/9"},{"kind":"notes","source":"08","score":1,"label":"Chapter 5 · Functions (supplied simplified) · p10","title":"Navigation / learning outcomes","text":"SECTION 2 Parts of a Function Prototype, definition and call work together. SECTION 2\nParts of a Function\nPrototype, definition and call work together.\nƒ Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/08/10"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p11","title":"Function prototypes","text":"Three Main Parts 1. Prototype / Declaration Tells the compiler that the function exists. Prototype / Declaration Function Call Function Definition DFC10353 Programming Fundamentals • Chapter 5 Prototype • Definition • Call 2. Definition The real C++ code that performs the task. 3. Function Call Runs the function from main() or another function./tells the program to run the function. void greet(); int main() { greet(); } } // prototype // cal1 void greet() { // definition cout « \"Hello\"; Function Three Main Parts Prototype • Definition • Call\nDFC10353 Programming Fundamentals • Chapter 5 Function\n1. Prototype / \nDeclaration\nTells the compiler that the \nfunction exists.\n2. Definition\nThe real C++ code that \nperforms the task.\n3. Function Call\nRuns the function from main() \nor another function./tells the \nprogram to run the \nfunction.\nvoid greet();        // prototype\nint main() {\ngreet();        // call\n}\nvoid greet() {      // definition\ncout \u003c\u003c \"Hello\";\n}\nPrototype / Declaration\n↓\nFunction Call\n↓\nFunction Definition Function prototypes I A29; I B2(c)(i); II A29; II B2(c)(ii)","route":"notes/08/11"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p12","title":"Function prototypes","text":"Function Prototype / Declaration A function prototype is used to tell the compiler about a function before it is used. Tell the compiler first A prototype is the function header with a semicolon. void myFunction(string fname); void myFunction(string fname); // 1. Function Prototype / Declaration int main() myFunction(\"Adam\"); // 2. Function Call Return type Function name Parameters When the function is written after main(), declare it before main(). void myFunction(string fname) cout «\u003c fname; // 3. Function Definition A prototype is normally needed when the function definition is written after main(). Prototype = Tell the compiler first. DFC10353 Programming Fundamentals • Chapter 5 Function Function Prototype / Declaration Tell the compiler first\nDFC10353 Programming Fundamentals • Chapter 5 Function\nA prototype is the function header with \na semicolon.\nvoid myFunction(string fname);\nReturn type Function name Parameters\nWhen the function is written after main(), declare it \nbefore main().\nvoid myFunction(string fname);\nint main() {\nmyFunction(\"Adam\");\n}\nvoid myFunction(string fname) \n{\ncout \u003c\u003c fname;\n}\nA function prototype is used to tell the compiler about a \nfunction before it is used.\nA prototype is normally needed when the function definition \nis written after main().\nPrototype = Tell the compiler first.\n Function prototypes I A29; I B2(c)(i); II A29; II B2(c)(ii)","route":"notes/08/12"},{"kind":"notes","source":"08","score":9,"label":"Chapter 5 · Functions (supplied simplified) · p13","title":"Parameters and arguments","text":"Parameters vs Arguments Parameter A placeholder inside the function. Data moves into the function void greet(string name) cout « \"Hello \" « name; greet(\"Ali\"); name = parameter \"Ali\" = argument DFC10353 Programming Fundamentals • Chapter 5 Easy distinction Argument The actual value sent to the function. Function Parameters vs Arguments Easy distinction\nDFC10353 Programming Fundamentals • Chapter 5 Function\nParameter\nA placeholder inside the \nfunction.\nArgument\nThe actual value sent to the \nfunction.\nData moves into the function\nvoid greet(string name)\n{\ncout \u003c\u003c \"Hello \" \u003c\u003c name;\n}\ngreet(\"Ali\");\nname = parameter \"Ali\" = argument Parameters and arguments I A29; I B2(c)(ii); II B2(c)(ii),(iii)","route":"notes/08/13"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p14","title":"Return type and returned value","text":"Return Type and void void Means the function does not send any value back. int / double / string Means the function returns a value of that data type. DFC10353 Programming Fundamentals • Chapter 5 Output from a function No return value void display() cout « \"Hello\"; } int getNumber() return 10; returns 10 Rule: if the function is not void, it should return a value. Function Return Type and void Output from a function\nDFC10353 Programming Fundamentals • Chapter 5 Function\nvoid\nMeans the function does not send \nany value back.\nint / double / string\nMeans the function returns a value of \nthat data type.\nvoid display()\n{\ncout \u003c\u003c \"Hello\";\n}\nint getNumber()\n{\nreturn 10;\n}\nreturns 10\nNo return value\nRule: if the function is not void, it should return \na value. Return type and returned value I B2(c)(ii); II A30; II B2(c)(iii)","route":"notes/08/14"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p15","title":"Function definition: header and body","text":"Function Definition Anatomy Header + Body Function header Includes return type, function name and parameters. int mul(int a, int b) { int prod; prod = a * b; return prod; Function body Contains local variables, function statements and return statement. Definition = actual C++ code that performs the task. DFC10353 Programming Fundamentals • Chapter 5 Function Function Definition Anatomy Header + Body\nDFC10353 Programming Fundamentals • Chapter 5 Function\nint mul(int a, int b)\n{\nint prod;\nprod = a * b;\nreturn prod;\n}\nFunction header\nIncludes return type, function name and parameters.\nFunction body\nContains local variables, function statements and return \nstatement.\nDefinition = actual C++ code that performs the \ntask. Function definition: header and body I B2(c)(i),(ii); II A30; II B2(c)(i),(iii)","route":"notes/08/15"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p16","title":"Function calls and execution order","text":"Function Call Flow Calling and called function Calling Function Called Function main() calls another function to perform an action. The function performs its task, then returns control back. int main() greet(); void greet() { cout \u003c\u003c \"Hello\"; } Program control moves to the called function, then comes back to main(). DFC10353 Programming Fundamentals • Chapter 5 Function Function Call Flow Calling and called function\nDFC10353 Programming Fundamentals • Chapter 5 Function\nCalling Function\nmain() calls another function to \nperform an action.\nCalled Function\nThe function performs its task, then \nreturns control back.\nint main()\n{\ngreet();\n}\nvoid greet()\n{\ncout \u003c\u003c \n\"Hello\";\n}\nProgram control moves to the called function, then comes \nback to main(). Function calls and execution order I B2(c)(iii); II B2(c)(i)","route":"notes/08/16"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p17","title":"Function prototypes","text":"void myFunction(string fname); // 1. Function Prototype / Declaration int main() myFunction(\"Adam\"); // 2. Function Call void myFunction(string fname) cout ‹\u003c fname; // 3. Function Definition 1. Function Prototype / Declaration void myFunction(string fname); This tells the compiler that a function named myFunction exists. void myFunction (string fname); Return Type Function Name Parameter void → no value is returned • myFunction → function name • string fname → parameter • ; → shows that this is a prototype/declaration 2. Function Call Inside main(): myFunction(\"Adam\"); This calls or runs the function. Here: \"Adam\" = Argument The value \"Adam\" is sent to the parameter: \"Adam\" fname So: fname = \"Adam\" 1. Function Prototype / Declaration\nvoid myFunction(string fname);\nThis tells the compiler that a function named myFunction\nexists.\nvoid             myFunction (string fname);\n↓                            ↓                                       ↓\nReturn Type   Function Name       Parameter\n• void → no value is returned\n• myFunction → function name\n• string fname → parameter\n• ; → shows that this is a prototype/declaration\n2. Function Call\nInside main():\nmyFunction(\"Adam\");\nThis calls or runs the function.\nHere:\n\"Adam\" = Argument\nThe value \"Adam\" is sent to the parameter:\n\"Adam\"\n↓\nfname\nSo:\nfname = \"Adam\" Function prototypes I A29; I B2(c)(i); II A29; II B2(c)(ii)","route":"notes/08/17"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p18","title":"Function definition: header and body","text":"void myFunction(string fname); int main() myFunction(\"Adam\"); void myFunction(string fname) cout ‹\u003c fname; // 1. Function Prototype / Declaration // 2. Function Call // 3. Function Definition 3. Function Definition void myFunction(string fname) { cout \u003c\u003c fname; This is the actual code that performs the task. It has two parts: void myFunction(string fname) = Function Header and: { cout \u003c\u003c fname; = Function Body The body displays the value stored in fname. Since: fname = \"Adam\" the output is: Adam 3. Function Definition\nvoid myFunction(string fname)\n{\ncout \u003c\u003c fname;\n}\nThis is the actual code that performs the task.\nIt has two parts:\nvoid myFunction(string fname)\n= Function Header\nand:\n{\ncout \u003c\u003c fname;\n}\n= Function Body\nThe body displays the value stored in fname.\nSince:\nfname = \"Adam\"\nthe output is:\nAdam\n Function definition: header and body I B2(c)(i),(ii); II A30; II B2(c)(i),(iii)","route":"notes/08/18"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p19","title":"Function definition: header and body","text":"Complete identification Code void myFunction(string fname); myFunction(\"Adam\"); \"Adam\" string fname void myFunction void myFunction(string fname) {... } void myFunction(string fname) { cout \u003c\u003c fname; } main() myFunction() Part Function Prototype / Declaration Function Call Argument Parameter Return Type Function Name Function Definition Function Header Function Body Calling Function Called Function Prototype → tells Call → runs Definition → does the work Code Part\nvoid myFunction(string fname); Function Prototype / \nDeclaration\nmyFunction(\"Adam\"); Function Call\n\"Adam\" Argument\nstring fname Parameter\nvoid Return Type\nmyFunction Function Name\nvoid myFunction(string fname) { ... } Function Definition\nvoid myFunction(string fname) Function Header\n{ cout \u003c\u003c fname; } Function Body\nmain() Calling Function\nmyFunction() Called Function\nPrototype  → tells\nCall       → runs\nDefinition → does the work\nComplete identification Function definition: header and body I B2(c)(i),(ii); II A30; II B2(c)(i),(iii)","route":"notes/08/19"},{"kind":"notes","source":"08","score":1,"label":"Chapter 5 · Functions (supplied simplified) · p20","title":"Navigation / learning outcomes","text":"SECTION 3 Four Function Types Ask two questions: Does it accept arguments? Does it return a value? SECTION 3\nFour Function Types\nAsk two questions: Does it accept arguments? Does it return a \nvalue?\nƒ Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/08/20"},{"kind":"notes","source":"08","score":8,"label":"Chapter 5 · Functions (supplied simplified) · p21","title":"Four function combinations","text":"Four Types of Functions Argument + Return RETURN VALUE No Return With Return ARGUMENT No Argument Tyре 1 o argumer o return valu void area(); Type 2 No argument Return value int area(); With Argument Тyре 3 With argument No return value void area(int side); Type 4 With argument Return value int area(int side); Simple formula: Argument = input, Return = output. DFC10353 Programming Fundamentals • Chapter 5 Function Four Types of Functions Argument + Return\nDFC10353 Programming Fundamentals • Chapter 5 Function\nRETURN VALUE\nNo Return With Return\nARGUMENT\nNo Argument\nWith Argument\nType 1\nNo argument\nNo return value\nvoid area();\nType 2\nNo argument\nReturn value\nint area();\nType 3\nWith argument\nNo return value\nvoid area(int side);\nType 4\nWith argument\nReturn value\nint area(int side);\nSimple formula: Argument = input, Return = output. Four function combinations II A30; II B2(c)(ii),(iii); supports I B2(c)(ii)","route":"notes/08/21"},{"kind":"notes","source":"08","score":6,"label":"Chapter 5 · Functions (supplied simplified) · p22","title":"No arguments, no return value","text":"Type 1: No Argument + No Return Value The function does not receive data from main() and does not send data back. The function handles everything inside itself. No input from call - area(); No output returned DFC10353 Programming Fundamentals • Chapter 5 void functionName() #include \u003ciostream> using namespace std; // Function prototype void area(); int main() { area(); return 0; } // Function definition void area() int side, square area: cout \u003c \"Enter the side of the square:\"; cin >> side; square area = side * side; cout \u003c \"Area of square =\" \u003c squarearea ‹ endli Function Type 1: No Argument + No Return Value void functionName()\nDFC10353 Programming Fundamentals • Chapter 5 Function\nThe function does not receive data from \nmain() and does not send data back.\nThe function handles everything inside itself.\nNo input from call\nNo output returned\narea();\n No arguments, no return value Syllabus support; II A30 tests a void greet definition.","route":"notes/08/22"},{"kind":"notes","source":"08","score":6,"label":"Chapter 5 · Functions (supplied simplified) · p23","title":"No arguments, returns a value","text":"Type 2: No Argument + Return Value The tunction does not receive data, but sends one result back to main(). Useful when the function collects its own input and returns the answer. No argument area() Return value answer DFC10353 Programming Fundamentals • Chapter 5 int functionName() #include \u003ciostream> using namespace std; // Function prototype int area(); int main() int square area; square area = area(); cout \u003c \"Area of square = \" \u003c square area ‹ endli return 0; // Function definition int area() int side; cout \u003c \"Enter the side of the square:\"; cia >> side; return side * side; Function Type 2: No Argument + Return Value int functionName()\nDFC10353 Programming Fundamentals • Chapter 5 Function\nThe function does not receive data, but\nsends one result back to main().\nUseful when the function collects its own input and \nreturns the answer.\nint area();\nint main() {\nint square_area;\nsquare_area = area();\ncout \u003c\u003c square_area;\nreturn 0;\n}\nint area() {\nint side;\ncin >> side;\nreturn side * side;\n}\nNo argument\nReturn value\narea()\nanswer\n No arguments, returns a value Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/08/23"},{"kind":"notes","source":"08","score":9,"label":"Chapter 5 · Functions (supplied simplified) · p24","title":"Arguments, no return value","text":"Type 3: Argument + No Return Value The function receives data from main(), but does not send a value back. One-way communication: main() → function. Argument sent area(side) No return DFC10353 Programming Fundamentals • Chapter 5 void functionName(parameter) #include \u003ciostream> using namespace std; // Function prototype void area(int square side); int main() int square side; cout \u003c \"Enter the side of the square:\"; cia>> square side; area(square side); return 0; // Function definition void area(int square side) int square area: square area = square side * square side; cout \u003c\"Area of square =\"\u003c square area ‹ endli Function Type 3: Argument + No Return Value void functionName(parameter)\nDFC10353 Programming Fundamentals • Chapter 5 Function\nThe function receives data from main(), \nbut does not send a value back.\nOne-way communication: main() → function.\nvoid area(int square_side);\nint main() {\nint square_side;\ncin >> square_side;\narea(square_side);\nreturn 0;\n}\nvoid area(int square_side) {\nint square_area;\nsquare_area = square_side * square_side;\ncout \u003c\u003c square_area;\n}\nArgument sent\nNo return\narea(side)\n Arguments, no return value II B2(c)(ii)","route":"notes/08/24"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p25","title":"Arguments and a returned value","text":"Type 4: Argument + Return Value int functionName(parameter) The function receives data and sends one result back. Two-way communication: main() ‹› function. Argument sent area(side) Return value • answer DFC10353 Programming Fundamentals • Chapter 5 Function Type 4: Argument + Return Value int functionName(parameter)\nDFC10353 Programming Fundamentals • Chapter 5 Function\nThe function receives data and sends \none result back.\nTwo-way communication: main() \n function.\nint area(int square_side);\nint main() {\nint side, square_area;\ncin >> side;\nsquare_area = area(side);\ncout \u003c\u003c square_area;\nreturn 0;\n}\nint area(int square_side) {\nreturn square_side * square_side;\n}\nArgument sent\nReturn value\narea(side)\nanswer Arguments and a returned value I B2(c)(ii); II B2(c)(iii)","route":"notes/08/25"},{"kind":"notes","source":"08","score":8,"label":"Chapter 5 · Functions (supplied simplified) · p26","title":"Four function combinations","text":"Quick Comparison Тyрe 1 2 3 4 Accept Arguments? No No Yes Yes Return Value? No Yes No Yes Memory tip: Argument = input into the function. Return = output back to the caller. DFC10353 Programming Fundamentals • Chapter 5 Exam-friendly summary Example Prototype void area(); int area(); void area(int side); int area(int side); Function Quick Comparison Exam-friendly summary\nDFC10353 Programming Fundamentals • Chapter 5 Function\nType Accept Arguments? Return Value? Example Prototype\n1 No No void area();\n2 No Yes int area();\n3 Yes No void area(int side);\n4 Yes Yes int area(int side);\nMemory tip: Argument = input into the function.\nReturn = output back to the caller. Four function combinations II A30; II B2(c)(ii),(iii); supports I B2(c)(ii)","route":"notes/08/26"},{"kind":"notes","source":"08","score":8,"label":"Chapter 5 · Functions (supplied simplified) · p27","title":"Four function combinations","text":"Practice Activity Cylinder volume Task: Create a program to calculate the volume of a cylinder using all 4 types of user-defined functions. Formula V=Trh Тype 1 Get input and display answer inside function. Type 2 Get input inside function, then return volume. Тyре 3 Pass radius and height, display answer inside function. Тype 4 Pass radius and height, return volume. Student checklist Write the prototype. Call the function in main(). Write the function definition. Check whether argument/return is required. DFC10353 Programming Fundamentals • Chapter 5 Function Practice Activity Cylinder volume\nDFC10353 Programming Fundamentals • Chapter 5 Function\nTask: Create a program to calculate the volume of a cylinder using all 4 types \nof user-defined functions.\nFormula\nV = πr²h\nType 1\nGet input and display \nanswer inside \nfunction.\nType 2\nGet input inside \nfunction, then return \nvolume.\nType 3\nPass radius and \nheight, display answer \ninside function.\nType 4\nPass radius and \nheight, return volume.\nStudent checklist\nWrite the prototype.\nCall the function in main().\nWrite the function definition.\nCheck whether argument/return is required. Four function combinations II A30; II B2(c)(ii),(iii); supports I B2(c)(ii)","route":"notes/08/27"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p28","title":"Function prototypes","text":"Final Recap Function in one page Function = Input → Process → Output 1. Prototype Tell the compiler the function exists. Example: int add(int a, int b); 2. Call Run the function. Example: answer = add(5, 3); 3. Definition Write the real task. Example: return a + b; Key vocabulary function prototype definition call parameter argument return value void Remember: Argument is sent into a function. Return value comes back from a function. DFC10353 Programming Fundamentals • Chapter 5 Function Final Recap Function in one page\nDFC10353 Programming Fundamentals • Chapter 5 Function\nFunction = Input → Process → Output\n1. Prototype\nTell the compiler the function exists. \nExample: int add(int a, int b);\n2. Call\nRun the function. Example: answer = \nadd(5, 3);\n3. Definition\nWrite the real task. Example: return a + b;\nKey vocabulary\nfunction prototype definition call\nparameter argument return value void\nRemember: Argument is sent into a function. Return value comes back from a function. Function prototypes I A29; I B2(c)(i); II A29; II B2(c)(ii)","route":"notes/08/28"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p29","title":"Function prototypes","text":"#include ‹iostream› using namespace std; // 1. Function Declaration int sum(int num1, int num2); int main() // 3. Function Call cout «\u003c sum(1, 99); return 0; // 2. Function Definition int sum(int num1, int num2) int total = num1 + num2; return total; // 2. Function Definition int sum(int num1, int num2) int total = num1 + num2; return total; The purpose of this function is to add two numbers. // 1. Function Declaration int sum(int num1, int num2); 1. Declare the Function/Function Declaration/ Function Prototype A function declaration tells the compiler that a function exists. int → return type • sum → function name int num1 → first parameter int num2 → second parameter ; → shows that this is only a declaration The declaration tells the compiler: There will be a function called sum. It will receive two integer values and return an integer value. A separate declaration is normally needed when the actual function definition is written after main(). The purpose of this function is to add two numbers.\n1. Declare the Function/Function Declaration/ Function \nPrototype\nA function declaration tells the compiler that a function \nexists.\n• int → return type\n• sum → function name\n• int num1 → first parameter\n• int num2 → second parameter\n• ; → shows that this is only a declaration\nThe declaration tells the compiler:\nThere will be a function called sum. It will receive two integer values and return an \ninteger value.\nA separate declaration is normally needed when the actual function definition is \nwritten after main(). Function prototypes I A29; I B2(c)(i); II A29; II B2(c)(ii)","route":"notes/08/29"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p30","title":"Function definition: header and body","text":"2. Define the Function The function definition contains the actual instructions that the function will perform. // 2. Function Definition int sum(int numl, int num2) int total = num1 + num2; int int is the return type. this function will return an integer value. return total; sum sum is the function name. The programmer chooses the any name. (int num1, int num2) These are called parameters. Parameters are variables used to receive data. 2. Define the Function\nThe function definition contains the actual instructions that \nthe function will perform.\nint is the return type.\nthis function will return an integer value.\nsum is the function name.\nThe programmer chooses the any name.\nThese are called parameters.\nParameters are variables used to receive data. Function definition: header and body I B2(c)(i),(ii); II A30; II B2(c)(i),(iii)","route":"notes/08/30"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p31","title":"Function definition: header and body","text":"int total = num1 + num2; 3. Function Body The instructions inside {} are called the function body. This is the part where the function performs its task. return total; int total = num1 + num2; 4. This statement performs the calculation. num1 = 1 num2 = 99 the calculation becomes: total = 1 + 99 total = 100 So the variable total stores the answer 100. return total; 5. return total; sends the result back to the function that called sum(). Since: total = 100 the function returns: 100 3. Function Body\nThe instructions inside { } are called the function body.\nThis is the part where the function performs its task.\n4. This statement performs the calculation.\nnum1 = 1\nnum2 = 99\nthe calculation becomes:\ntotal = 1 + 99\ntotal = 100\nSo the variable total stores the answer 100.\nsends the result back to the function that called sum().\nSince:\ntotal = 100\nthe function returns:\n100\n5. return total; Function definition: header and body I B2(c)(i),(ii); II A30; II B2(c)(i),(iii)","route":"notes/08/31"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p32","title":"Function calls and execution order","text":"int main() cout ‹ sum(1, 99); return 0; 6. Call the Function in main() The function is used by calling it inside main(). The statement: sum(1,99) is called a function call. It tells the program: Go to the sum() function and add the values 1 and 99. cout ‹\u003c sum(1, 99); 7. Step by Step? When the program reaches: 1. main() calls sum(1, 99) 2. 1 is passed to num1 99 is passed to num2 3. The function calculates: total = num1 + num2 4. The calculation becomes: total = 1 + 99 5. total becomes: 100 6. return total sends 100 back to main() 7. cout displays 100 6. Call the Function in main()\nThe function is used by calling it inside main().\nThe statement:\nsum(1, 99)\nis called a function call.\nIt tells the program:\nGo to the sum() function and add the values 1 and 99.\n1. main() calls sum(1, 99)\n2. 1 is passed to num1\n99 is passed to num2\n3. The function calculates:\ntotal = num1 + num2\n4. The calculation becomes:\ntotal = 1 + 99\n5. total becomes:\n100\n6. return total sends 100 back to main()\n7. cout displays 100\n7. Step by Step?\nWhen the program reaches: Function calls and execution order I B2(c)(iii); II B2(c)(i)","route":"notes/08/32"},{"kind":"notes","source":"08","score":9,"label":"Chapter 5 · Functions (supplied simplified) · p33","title":"Parameters and arguments","text":"8. Parameter vs Argument int sum(int numl, int num2) num1 and num2 are called parameters. sum(1, 99); 1 and 99 are called arguments. Parameter = variable that receives the value Argument = actual value that is passed 9. Calling Function and Called Function int main() cout \u003c\u003c sum(1, 99); main() is the calling function because it calls another function. The function: int sum(int num1, int num2) is the called function because it is called by main(). 8. Parameter vs Argument\nnum1 and num2 are called parameters.\n1 and 99 are called arguments. Parameter = variable that receives the value\nArgument  = actual value that is passed\n9. Calling Function and Called Function\nmain() is the calling function because it calls\nanother function.\nThe function:\nis the called function because it is called by main(). Parameters and arguments I A29; I B2(c)(ii); II B2(c)(ii),(iii)","route":"notes/08/33"},{"kind":"notes","source":"08","score":10,"label":"Chapter 5 · Functions (supplied simplified) · p34","title":"Arguments and a returned value","text":"10. Why Does This Function Use int? The function is written as: int sum(int num1, int num2) 11. What Type of Function Is This? int sum(int num1, int num2) It uses int because the function returns an integer value. The function contains: return total; and total contains: 100 So the function returns an integer. It we use: void sum(...) then the function would not return any value. That is why int is used here. has: • arguments V • return value Therefore, this is: A function with arguments and a return value. 10. Why Does This Function Use int?\nThe function is written as:\n It uses int because the function returns an integer value.\nThe function contains:\nreturn total;\nand total contains:\n100\nSo the function returns an integer.\nIf we use:\nvoid sum(...)\nthen the function would not return any value.\nThat is why int is used here.\n11. What Type of Function Is This?\nhas:\n• arguments \n• return value \nTherefore, this is:\nA function with arguments and a return value. Arguments and a returned value I B2(c)(ii); II B2(c)(iii)","route":"notes/08/34"},{"kind":  | Original page 6 of 8\n2025-2026 | Session 2 | Original page 7 of 8","route":"paper/15/8"},{"kind":"paper","source":"15","score":null,"label":"Print-ready file · duplicated DFC10353 sections · p9","title":"Original page 9","text":"SULIT DFC10353: PROGRAMMING FUNDAMENTALS (iii) Write a function definition that calculate the area of rectangle named areaRectangle, using the formula area = length * width. The function should receive two integer parameters and return the calculated value. Tulis definisi fungsi yang mengira huas segi empat tepat bernama areaRectangle menggunakan formula area = length * width. Fıungsi tersebut hendaklah menerima dua parameter jenis integer dan memulangkan nilai yang dikira. [3 marks] [3 markah) SOALAN TAMAT SULIT 2025-2026 | Session 2 | Original page 8 of 8 2025-2026 | Session 2 | Original page 8 of 8","route":"paper/15/9"},{"kind":"analysis","label":"Final analysis · section 1","title":"What to prioritise first","text":"Marks in the two DFC10353 papers ['Chapter', 'I', 'II', 'Mean'] [['1 Introduction', '25', '23.5', '24.25'], ['2 Fundamentals', '21', '22.5', '21.75'], ['3 Control structures', '27', '27', '27'], ['4 Arrays', '14', '14', '14'], ['5 Functions', '13', '13', '13']] All five chapters appeared in both papers. Chapter 3 carried the largest repeated allocation. Best revision order 1. Control structures: if/else, switch, all three loops, tracing and boundaries. 2. Chapters 1 and 2: IPO, flowcharts, pseudocode, names/types, program structure, I/O and logic. 3. Arrays and functions: indexing, traversal, prototypes, definitions, calls and returned values. The side markers are evidence-based revision scores out of 10. They are not calibrated probabilities: 9/10 does not mean a measured 90% chance.","route":"analysis/1"},{"kind":"analysis","label":"Final analysis · section 2","title":"What appears most often","text":"Measured task frequency: I + II ['Task group', 'Items', 'Marks'] [['Arrays', '16', '28'], ['Loops and continue', '12', '26'], ['Selection / switch / break', '13', '25'], ['Function interfaces / calls', '10', '26'], ['Names, variables and types', '10', '22.5'], ['Language theory', '9', '20.5'], ['Algorithms / flowcharts', '7', '14.5'], ['IPO', '7', '13.5']] One MCQ or one labelled structured subquestion counts as one item. Each group appears in 2/2 primary papers. Read the counts carefully The two papers contain 94 items and 200 marks in total. The eight groups shown account for 84 items and 176 marks. The other 10 items / 24 marks concern program structure, I/O, errors, logical/increment operators and general control recognition. Groups here do not overlap. Chapter 3 combines selection, loops and general control recognition: 26 items / 54 marks across both papers. Arrays have many short questions; selection and loops together carry more marks. Page count in the notes does not increase exam frequency.","route":"analysis/2"},{"kind":"analysis","label":"Final analysis · section 3","title":"The repeated written-question pattern","text":"Section B: stable chapter allocation ['Written block', 'I', 'II'] [['Chapter 1', '13', '13'], ['Chapter 2', '12', '12'], ['Control structures', '15', '15'], ['Arrays', '5', '5'], ['Functions', '10', '10']] Both primary papers allocate 55 marks to Section B and 45 marks to 30 objective questions. What you need to be able to do IPO / algorithm: identify the required input and output, write the process, and translate a flowchart into pseudocode. Control: write selection and loops; explain break; trace fall-through and exact outputs. Arrays: declare an array, access the right element and display/accumulate values with a loop. Functions: identify prototype/header/call and write a function with the specified parameters and return type. I B2(c)(iii) is 2 marks in the question paper, despite 4 in its scheme. The paper value makes the totals reconcile to 100.","route":"analysis/3"},{"kind":"analysis","label":"Final analysis · section 4","title":"How the two DFC10353 sets differ","text":"I: Session I 2025/2026 Exam date: 2 December 2025. Strong written examples: compiler vs interpreter; circle-flowchart pseudocode; three-quiz IPO; data types and boolean expressions. Control questions include while-to-do conversion, a complete for-loop program and switch fall-through. Arrays require declaration/access and indexed arithmetic. Functions require anatomy, circle area and call-order tracing. Main references: B1(a)-(c), source PDF pp14-16; B2(a)-(c), pp17-21. II: Session II 2025/2026 Exam date: 6 May 2026. Written theory changes to paradigms, generation examples, IPO, four flowchart-symbol functions and identifier rules. Coding changes to integer square area, filling missing if/else lines, printing 1..50, visiting an array, function prototypes and rectangle area. Main references: B1(a)-(c), source PDF pp13-15; B2(a)-(c), pp16-19. Practise the common skill, then change the values/story. Do not memorise only the exact old question.","route":"analysis/4"},{"kind":"analysis","label":"Final analysis · section 5","title":"The related paper and duplicate check","text":"R: DFC20303 Session I 2025/2026 ['Main area', 'Marks'] [['Fundamentals', '24.5'], ['Control structures', '24.5'], ['Arrays', '11.5'], ['Functions', '22.5'], ['Pointers / structures', '17']] This set reinforces shared C++ skills but adds pointers, structures and reference parameters. Its course code differs, so it is supplementary evidence. What was counted Two unique DFC10353 papers plus one related DFC20303 paper; their three schemes were checked too. The separate 9-page print-ready PDF repeats the covers and written sections of I and II. It does not add independent exam sets. What the notes cover The supplied notes contain 421 pages plus a 3-page course outline. The outline mentions parameter-passing techniques, while the detailed notes supplied stop at Function Part 1. Do not treat R-only pointers/structures as an extra DFC10353 recurrence. The upcoming paper or blueprint was not supplied.","route":"analysis/5"},{"kind":"analysis","label":"Final analysis · section 6","title":"Use these original note pages first","text":"High-value page ranges ['Original file', 'PDF pages'] [['Chapter 1', '21-33: IPO, algorithms, symbols'], ['Chapter 2', '41-76: names, variables, types'], ['Chapter 2', '92-122: I/O and operators'], ['Chapter 3', '17-51: selection and switch'], ['Chapter 3', '58-104: loops and jumps'], ['Chapter 4', '9-31: 1D arrays and loops'], ['Chapter 4', '33-46: 2D arrays'], ['Chapter 5 Part 1', '20-41,49-58: function anatomy/code']] Other useful original pages Chapter 1 pp7-20: language types, paradigms, generations and translators. Chapter 2 pp11-36 and 83-90: program structure and errors. Function Part 1 (the already supplied simplified version) pp11-19,21-26,29-34 repeats function anatomy and interfaces. Use whichever original version you prefer. Score legend 9-10: master first. 7-8: tested detail / useful related skill. 5-6: supporting material. 3-4: skim after the core. 1-2: navigation / learning outcomes. A 1/10 cover or divider is rated as a page, not as the chapter. Repeated pages with the same skill keep the same score.","route":"analysis/6"},{"kind":"analysis","label":"Final analysis · section 7","title":"Important errors in the supplied papers","text":"Primary-paper issues to remember I A20: a single-statement while body does not require braces. The supplied key claims otherwise. I A21: p\u003c=10 prints an extra 12 in the given do-while. The intended sequence needs p\u003c10, which is absent from its options. I A23: both char[10][15] and string[10][15] meet the stated dimensions; the element type is not specified. II A5: a condition check needs Decision (D); the supplied key says C. Do not learn typos as C++ rules II A26: all choices incorrectly use cout >>. The intended index is [1][0]; correct output uses cout \u003c\u003c. II B2(a)(iii) scheme: do-while tests AFTER the body, despite the incorrect first table row. II B1(c)(ii): Gender -> bool is under-specified. The suitable type depends on whether it is M/F text, a character or a defined true/false flag. R A5: both int const and const int declarations are valid. R A23 needs const char* for the shown string literal in modern C++. Your note wording, diagrams, code and page order are left untouched. All analysis and caveats are separate in this report.","route":"analysis/7"},{"kind":"guide","label":"Optional guide · section 1","title":"Programming Fundamentals","text":"Study with a clear order DFC10353 | Exam revision + classmate teaching guide A rebuilt, screen-friendly guide based on every supplied note file, both unique DFC10353 past papers, their marking schemes and one separately analysed DFC20303 paper. Your strongest first target Control structures carried 27/100 marks in each DFC10353 paper. Learn to trace and write if/switch/for/while/do-while, then connect them to arrays and functions. Three ways to use this pack 1. Read this guide for the simplified explanation and corrected worked examples. 2. Read the exact original notes in Original notes. Only a small score appears beside each page. 3. Search all materials, jump by chapter or question, and save pages in this offline hub. A score out of 10 means revision priority, not a percentage chance. Two papers cannot support a reliable prediction of your next exam.","route":"guide/1"},{"kind":"guide","label":"Optional guide · section 2","title":"What was analysed","text":"Source inventory ['Material', 'Coverage'] [['Course outline', '3 pages'], ['Chapter 1 + summary', '35 + 6 pages'], ['Chapter 2 + summary', '122 + 7 pages'], ['Chapter 3', '108 pages'], ['Chapter 4', '47 pages'], ['Chapter 5: both versions', '62 + 34 pages']] Total: 421 note pages plus 3 outline pages. All 424 receive a page-level priority score in the original-notes volume. Count the evidence once I = DFC10353, Session I 2025/2026, 2 December 2025. II = DFC10353, Session II 2025/2026, 6 May 2026. R = DFC20303, Session I 2025/2026. Its pointers and structures extend beyond the supplied DFC10353 chapters, so its recurrence is reported separately. The print-ready 9-page PDF repeats the covers and Section B of I and II. It is a duplicate source, not two more independent papers. Each paper has 30 MCQs (45 marks) and two structured questions (55 marks). The ledger covers 90 MCQs and 51 structured subquestions across all three unique papers.","route":"guide/2"},{"kind":"guide","label":"Optional guide · section 3","title":"How to read the priority scores","text":"Use the score as a study decision ['Score', 'Action'] [['9-10', 'Master: repeated core skill / written application'], ['7-8', 'Practise: tested detail or useful related skill'], ['5-6', 'Understand: supporting concept / coverage gap'], ['3-4', 'Skim after core: limited direct evidence'], ['1-2', 'Navigate: covers, outcomes, dividers, references']] These are editorial ratings using recurrence, written-answer importance and prerequisite value. They are not a fitted statistical model. What the number does not mean 10/10 does not mean guaranteed. 3/10 does not mean impossible. All five chapters appeared in both DFC10353 papers. Repeated slides with the same skill keep the same score. Their page count does not increase the topic frequency. Covers and outcomes are rated for their own study value, so a 1/10 cover can introduce a 10/10 chapter skill. Best use Read a high-priority explanation once, close it, then write or trace a fresh example. Move on when you can explain why the answer is correct.","route":"guide/3"},{"kind":"guide","label":"Optional guide · section 4","title":"What carries the most marks","text":"Historical marks out of 100 ['Chapter', 'I', 'II', 'Mean'] [['1 Introduction', '25', '23.5', '24.25'], ['2 Fundamentals', '21', '22.5', '21.75'], ['3 Control structures', '27', '27', '27'], ['4 Arrays', '14', '14', '14'], ['5 Functions', '13', '13', '13']] Every chapter was present in 2/2 DFC10353 papers. These are marks in the supplied papers, not predicted marks for your exam. Why this matters Chapter 3 is the largest repeated allocation. Chapters 1 and 2 together supply 46 marks in each paper, so definitions, IPO, flowcharts and C++ basics deserve serious time too. Arrays and functions contribute 27 marks together. They are compact, repeatable skills; keep practising them even though each chapter is smaller. Totals use printed question-paper marks. I B2(c)(iii) is 2 marks in the paper although its scheme incorrectly labels it 4. Each paper reconciles to 100.","route":"guide/4"},{"kind":"guide","label":"Optional guide · section 5","title":"Repeated question patterns","text":"Present in both primary papers IPO and problem analysis; flowcharts/pseudocode; language generations; identifier recognition; data types; selection; loop syntax/tracing/writing; array indexing; array declaration/traversal; function prototypes and definitions. Written tasks worth mastering ['Pattern', 'I', 'II'] [['Control-structure block', '15 marks', '15 marks'], ['Array block', '5 marks', '5 marks'], ['Function block', '10 marks', '10 marks'], ['Chapter 1 block', '13 marks', '13 marks'], ['Chapter 2 block', '12 marks', '12 marks']] Differences to prepare for I asks compiler vs interpreter, circle-flowchart pseudocode, logical-expression working, while-to-do conversion and switch fall-through. II asks programming paradigms, generation examples, four symbol functions, identifier rules, a complete square-area program, break explanations and missing code lines. Read after core History dates, long lists of C++ uses, detailed library routines and exit() have no direct primary-paper item identified. They remain syllabus material. R is supplementary: it adds pointers, structures, pass-by-reference and more function questions. Do not use it to inflate the 2/2 primary frequency.","route":"guide/5"},{"kind":"guide","label":"Optional guide · section 6","title":"Which tasks repeat most?","text":"Across the two DFC10353 papers ['Task group', 'Items', 'Marks'] [['Arrays', '16', '28'], ['Loops and continue', '12', '26'], ['Selection / switch / break', '13', '25'], ['Function interfaces / calls', '10', '26'], ['Names, variables and types', '10', '22.5'], ['Language theory', '9', '20.5'], ['Algorithms / flowcharts', '7', '14.5'], ['IPO', '7', '13.5']] One MCQ or one labelled structured subquestion = one item. An item asking for four rules is still counted once. How to interpret these counts All eight groups occur in 2/2 primary papers. Arrays have many short objective questions, while selection and loops together account for most of Chapter 3. The groups are mutually exclusive in this table. They total 84 items / 176 marks. The remaining 10 items / 24 marks concern structure, I/O, errors, logical/increment operators and general control recognition. Grouping affects the apparent ranking: Chapter 3 has 26 items / 54 marks across both papers when all its skills are combined. Question counts and marks describe these papers only. Do not convert them into a probability for your next exam. R is excluded.","route":"guide/6"},{"kind":"guide","label":"Optional guide · section 7","title":"Words you must distinguish","text":"Three basic definitions ['Term', 'Exam-ready meaning'] [['Program', 'Instructions that perform a task'], ['Programmer', 'Person who writes/tests programs'], ['Programming', 'Designing, writing, testing and maintaining code']] Language types Machine: binary instructions directly executed by the processor. Assembly: mnemonics such as MOV/ADD, translated by an assembler. High-level: more readable languages such as C++, Java and Python. Three programming concepts Procedural: steps grouped into functions. Example: calculate a total, then print a receipt. Object-oriented: data and behaviour organised in objects. Example: a Student object stores details and provides actions. Event-driven: an event source produces an event, a listener detects it and a handler responds. Example: clicking a button displays a message. A language may support several approaches. Event-driven code still executes ordinary statements inside the handler.","route":"guide/7"},{"kind":"guide","label":"Optional guide · section 8","title":"Generations and translators","text":"Use safe course examples ['Generation', 'Language / example'] [['1GL', 'Machine language / binary'], ['2GL', 'Assembly / MOV, ADD'], ['3GL', 'C, C++, Java, Python'], ['4GL', 'SQL'], ['5GL', 'Prolog']] Generation questions often ask for a match or example. MOV and ADD signal assembly, so answer second generation. Compiler vs interpreter Course-level comparison: a compiler translates the source before execution; an interpreter evaluates/translates instructions during execution. A good paired answer: \"A compiler translates the program before it runs, whereas an interpreter processes instructions during execution.\" Assembler An assembler converts assembly language into machine code. Use SQL for 4GL. The II scheme also lists Prolog/LISP under 4GL, which clashes with the notes and II A3. Prolog is the safest 5GL example here.","route":"guide/8"},{"kind":"guide","label":"Optional guide · section 9","title":"IPO: turn a story into a solution","text":"Worked example: three quizzes ['Part', 'Answer'] [['Input', 'quiz1, quiz2, quiz3'], ['Process', 'total = quiz1 + quiz2 + quiz3'], ['Process', 'average = total / 3.0'], ['Output', 'total and average']] If marks are 70, 80 and 90: total = 240, average = 80. A fixed divisor of 3 is part of the calculation, not another user input. Worked example: square perimeter Input: side length. Process: perimeter = 4 * side. Output: perimeter. For side 6, output 24. Quick method Underline what is entered -> inputs. Circle what is requested -> outputs. Write the formula connecting them -> process. Different questions may ask for different outputs from the same story. If the question asks for average only, do not answer \"total\" instead.","route":"guide/9"},{"kind":"guide","label":"Optional guide · section 10","title":"Flowcharts: recognise and translate","text":"Symbols with a purpose ['Shape', 'Purpose'] [['Oval / rounded terminator', 'Start or end'], ['Parallelogram', 'Input or output'], ['Rectangle', 'Processing / calculation'], ['Diamond', 'Decision / condition'], ['Arrow', 'Direction of control'], ['Connector', 'Continue flow here/elsewhere']] A decision has labelled outcomes such as True/False. Follow the branch that matches the condition. Circle flowchart -> pseudocode START\nINPUT radius\narea = 3.142 * radius * radius\nOUTPUT area\nEND None  None Same logic in C++: read radius, calculate area, display area. Preserve the formula and the order of the original flowchart. II A5: a condition check uses a diamond/Decision, option D. The supplied key incorrectly says C.","route":"guide/10"},{"kind":"guide","label":"Optional guide · section 11","title":"Algorithm patterns and pseudocode","text":"Three patterns SEQUENCE\nINPUT side\narea = side * side\nOUTPUT area\n\nSELECTION\nIF mark >= 60 THEN\n    OUTPUT \"Passed\"\nELSE\n    OUTPUT \"Failed\"\nEND IF None  None Indent the controlled steps so the structure is obvious. Iteration counter = 1\nWHILE counter \u003c= 3\n    OUTPUT counter\n    counter = counter + 1\nEND WHILE None  None This displays 1, 2 and 3. Then counter becomes 4, so the condition is false and repetition stops. Pseudocode has no single universal syntax. Use clear, consistent wording; C++ code needs actual C++ keywords and braces.","route":"guide/11"},{"kind":"guide","label":"Optional guide · section 12","title":"A complete C++ program","text":"Memorise the structure #include \u003ciostream>\nusing namespace std;\n\nint main() {\n    // Calculate a square area\n    int side = 0;\n    cin >> side;\n    int area = side * side;\n    cout \u003c\u003c area \u003c\u003c \"\\n\";\n    return 0;\n} square 6\n 36\n Label the components #include is a preprocessor directive. \u003ciostream> is the header providing stream declarations. main is the entry function for this console program. Braces contain its body. Each ordinary declaration/expression statement ends with a semicolon. // starts a single-line comment. /* ... */ encloses a block comment. return 0; ends main successfully. Correct the legacy examples when writing your own answers: use int main() and \u003ciostream>. Do not copy void main() or \u003ciostream.h>.","route":"guide/12"},{"kind":"guide","label":"Optional guide · section 13","title":"Names, variables and constants","text":"Identify valid names ['Name', 'Verdict'] [['total_mark', 'Valid'], ['box22A', 'Valid'], ['2ndValue', 'Invalid: begins with a digit'], ['my name', 'Invalid: space'], ['int', 'Invalid: keyword'], ['sum-total', 'Invalid: hyphen operator']] Age and age are different names. For your own code, start with a letter to avoid reserved underscore forms. Three different actions int count = 0; // declaration + init\ncount = 5;     // later assignment\nconst int LIMIT = 10; // constant\nconst char GRADE = 'A'; None  None Scope A local variable is visible in its block after declaration. A global is outside functions and available where its declaration is visible. A local name may hide a global name. There is no general 31-character identifier limit. Keywords are language tokens; cin, cout and string are library names, not keywords.","route":"guide/13"},{"kind":"guide","label":"Optional guide · section 14","title":"Choose types; initialise values","text":"Match the meaning to the type ['Data', 'Suitable choice'] [['Number of students', 'int'], ['Temperature / currency rate', 'float or double'], ['Price', 'float/double for this course'], ['Phone / address', 'string'], ['An M/F character code', 'char'], ['A yes/no flag', 'bool']] A phone number is text: preserve leading zeroes and symbols. Use char for a single quoted character such as 'M'. Initialize before use int total = 0;\nint count = 0;\ndouble average = 0.0;\nchar grade = 'A';\nstring phone = \"0123456789\";\nbool passed = true; None  None int x; by itself does not give an ordinary local int a usable predictable value. Read/assign it before using it. float is about significant-digit precision, not a fixed six-decimal-place limit. The source scheme says bool for Gender without specifying an encoding; that field is ambiguous.","route":"guide/14"},{"kind":"guide","label":"Optional guide · section 15","title":"Input/output and the working order","text":"Read -> calculate -> display #include \u003ciostream>\nusing namespace std;\nint main() {\n    int a = 0, b = 0;\n    cin >> a >> b;\n    int sum = a + b;\n    cout \u003c\u003c \"Sum is: \" \u003c\u003c sum \u003c\u003c \"\\n\";\n    return 0;\n} sum 3 4\n Sum is: 7\n Two arrows to remember cin >> variable receives a value. cout \u003c\u003c expression displays a value. cout \u003c\u003c \"score\" prints the word; cout \u003c\u003c score prints the stored value. Text with spaces string name;\ngetline(cin >> ws, name);\ncout \u003c\u003c name; None  None Include \u003cstring> when using string. cin >> name alone stops at whitespace. Do not print a calculation before reading its inputs. II A26 has cout >> in every choice; the intended output operator is \u003c\u003c.","route":"guide/15"},{"kind":"guide","label":"Optional guide · section 16","title":"Operators: arithmetic and updates","text":"Use the correct operation ['Expression', 'Result'] [['2 * 5 + 2 / 1', '12'], ['12 % 5 - 1', '1'], ['4 + (7 - 3) * 3', '16'], ['(2 * 4) * 2 - (6 + 2) / 8', '15'], ['5 / 2  (int operands)', '2'], ['5.0 / 2', '2.5']] Parentheses first; then * / %; then + -. Integer division discards the fractional part. Assignments change the value int x = 10;\nx += 5; // x becomes 15\nx *= 2; // x becomes 30 None  None Prefix vs postfix, independently int i = 6;\nint j = ++i; // i=7, j=7\n\n// Start again from i=6\nint k = 6;\nint m = k++; // k=7, m=6 None  None In a standalone statement x++; and ++x; both add one. Their yielded values differ when used in another expression.","route":"guide/16"},{"kind":"guide","label":"Optional guide · section 17","title":"Boolean expressions: show the steps","text":"AND, OR and NOT ['P', 'Q', 'P&&Q', 'P||Q', '!P'] [['0', '0', '0', '0', '1'], ['0', '1', '0', '1', '1'], ['1', '0', '0', '1', '0'], ['1', '1', '1', '1', '0']] With x=0, y=6, z=3: ((x==z) && (y==z)) || (x\u003c1)\n= (false && false) || true\n= false || true\n= true None  None Second expression !(x==0) && (y!=2)\n= !true && true\n= false && true\n= false None  None Use the original paper expression. The supplied I scheme mistranscribes parts of its substitution, although the final True/False answers agree. = assigns; == compares. For &&, a false left side skips the right. For ||, a true left side skips the right.","route":"guide/17"},{"kind":"guide","label":"Optional guide · section 18","title":"Errors: diagnose before fixing","text":"Separate the stages ['Kind', 'Example / meaning'] [['Syntax / compile', 'Missing ; or invalid grammar'], ['Link', 'Declared function has no linked definition'], ['Runtime problem', 'Failure during execution'], ['Logic', 'Runs but produces wrong result']] The exam asks whether a compiler can detect a logic mistake. Usually it cannot know your intended formula. A legal statement can be wrong if (mark >= 60); // empty if body\n{\n    cout \u003c\u003c \"Passed\"; // always runs\n} None  None Remove the stray semicolon to make the block conditional. Unsafe output questions Reading outside an array or reading an uninitialized local int has no fixed, valid numeric answer. Integer division by zero is undefined behaviour; no portable error message is guaranteed.","route":"guide/18"},{"kind":"guide","label":"Optional guide · section 19","title":"Selection: one condition at a time","text":"The mark boundary matters if (mark >= 80) {\n    cout \u003c\u003c \"Very Good\";\n} else {\n    cout \u003c\u003c \"Good\";\n} None  None 79 -> Good. 80 -> Very Good. 81 -> Very Good. Braces group statements Without braces, only the next statement belongs to the if/else/loop body. Trace the unbraced example int mark = 35;\nif (mark >= 50)\n    cout \u003c\u003c \"Pass\";\ncout \u003c\u003c \"Your mark is \" \u003c\u003c mark; unbraced  Your mark is 35 Only the first cout is conditional. Since 35>=50 is false, the second line still prints Your mark is 35. For an else-if ladder, test the highest grade threshold first. Validate 0..100 if the task includes input validation.","route":"guide/19"},{"kind":"guide","label":"Optional guide · section 20","title":"Switch: follow execution past labels","text":"Fall-through example char grade = 'P';\nswitch (grade) {\ncase 'P':\n    cout \u003c\u003c \"Pass\\n\";\ncase 'F':\n    cout \u003c\u003c \"Fail\\n\";\n    break;\ndefault:\n    cout \u003c\u003c \"Invalid Grade\\n\";\n} fallthrough  Pass\nFail\n Why both lines appear The switch enters case P, prints Pass and continues into case F because there is no break after Pass. It prints Fail, reaches break and exits the switch. Two purposes of break It transfers control out of the switch. It prevents unintended fall-through into following case statements. default handles an unmatched value. Group case labels when several exact values share one body. switch uses integral/enum values, including char. Use if/else for ranges such as mark>=80 or conditions on strings.","route":"guide/20"},{"kind":"guide","label":"Optional guide · section 21","title":"Choose and compare loops","text":"Know the test position ['Loop', 'Test', 'Minimum runs'] [['for', 'Before body', '0'], ['while', 'Before body', '0'], ['do...while', 'After body', '1']] Typical choice: for when a count is known; while when repetition depends on a condition; do-while when the body must run first. All three can express many of the same algorithms. The choice guidance is a convention, not a hard language restriction. Three essential components Initialisation sets the starting state. Condition decides whether to continue. Update makes progress toward stopping. for (int i=1; i\u003c=3; ++i) {\n    cout \u003c\u003c i \u003c\u003c \" \";\n} None  None Trace: i=1 print 1; i=2 print 2; i=3 print 3; update to 4; condition false; stop. A for loop continues while its condition is true. Chapter 3 p81 incorrectly says it continues until true.","route":"guide/21"},{"kind":"guide","label":"Optional guide · section 22","title":"For loops: count and print exactly","text":"Complete program: Number 1..3 #include \u003ciostream>\nusing namespace std;\nint main() {\n    for (int i=1; i\u003c=3; ++i) {\n        cout \u003c\u003c \"Number \" \u003c\u003c i \u003c\u003c \"\\n\";\n    }\n    return 0;\n} numbers  Number 1\nNumber 2\nNumber 3\n Display 1 through 50 for (int i=1; i\u003c=50; ++i) {\n    cout \u003c\u003c i \u003c\u003c \" \";\n} None  None Count the iterations Contrast: count=0; count\u003c15 visits 0..14 (15 times). The actual I A17 image uses count\u003c=15, so it visits 0..15 (16 times). With i=0;i\u003c=10;i+=2 there are 6 iterations. Count body executions, not the number of condition checks. The condition is tested once more when the loop stops.","route":"guide/22"},{"kind":"guide","label":"Optional guide · section 23","title":"While to do-while: preserve the logic","text":"Corrected while accumulation int total = 0, num = 1, count = 0;\nwhile (count \u003c 10) {\n    total = total + num;\n    ++count;\n}\ncout \u003c\u003c total \u003c\u003c \"\\n\"; while_total  10\n The original question leaves total uninitialized. Initialize it to zero when writing a correct working solution. Equivalent here: do-while int total = 0, num = 1, count = 0;\ndo {\n    total = total + num;\n    ++count;\n} while (count \u003c 10);\ncout \u003c\u003c total \u003c\u003c \"\\n\"; do_total  10\n The initial condition is true, so both execute ten times here. If it might be false initially, an unguarded do-while changes behaviour. Use if(condition) { do {...} while(condition); } to preserve a possible zero-iteration case. Keep the original output location outside the loop.","route":"guide/23"},{"kind":"guide","label":"Optional guide · section 24","title":"Jump statements and boundary traps","text":"Where does control go? ['Statement', 'Effect'] [['break', 'Leave nearest loop/switch'], ['continue', 'Skip rest of this iteration'], ['return', 'Leave current function'], ['exit(status)', 'Terminate program']] for (int i=1; i\u003c=5; ++i) {\n    if (i==3) continue;\n    cout \u003c\u003c i \u003c\u003c \" \";\n} skip  1 2 4 5  Do-while off-by-one trap int p = 0;\ndo {\n    p += 2;\n    cout \u003c\u003c p \u003c\u003c \" \";\n} while (p \u003c 10); even  2 4 6 8 10  Because the update/print happen before the test, p\u003c=10 would run once more and print 12. The I A21 answer choices do not include the correct p\u003c10. In a for loop, continue still executes the update. In a while loop, it may skip an update placed after continue.","route":"guide/24"},{"kind":"guide","label":"Optional guide · section 25","title":"Arrays: size, index and element","text":"One name, several same-type values int a[5] = {10,20,30,40,50};\n// index:     0  1  2  3  4\ncout \u003c\u003c a[0]; // 10: first element\ncout \u003c\u003c a[4]; // 50: fifth/last\na[2] = 75;    // third becomes 75 None  None Size is 5. The indexes are 0..4. An element is a stored value such as a[2]. Past-paper declaration int studentAge[10] = {};\ncout \u003c\u003c studentAge[0]; None  None The original task asks for declaration and first-element access. The added {} safely initializes all elements; a real student age should be read/assigned before use. Trace the index first For num={70.5,82.5,63.0,55.5,100.0}, num[3]-4 = 55.5-4 = 51.5. There is no valid a[5] element in a size-5 array. Do not confuse fifth element a[4] with index 5.","route":"guide/25"},{"kind":"guide","label":"Optional guide · section 26","title":"Array loops: input, output and sums","text":"Visit each element once int matrix[6] = {1,2,3,4,5,6};\ncout \u003c\u003c matrix[4] \u003c\u003c \"\\n\";\nfor (int i=0; i\u003c6; ++i) {\n    cout \u003c\u003c matrix[i] \u003c\u003c \" \";\n} matrix  5\n1 2 3 4 5 6  Read into an array int marks[5] = {};\nfor (int i=0; i\u003c5; ++i)\n    cin >> marks[i]; None  None Output exactly as written int a[4] = {4,2,0,3};\nfor (int i=0; i\u003c4; ++i)\n    cout \u003c\u003c 10-a[i]; arraytrace  68107 The values are 6,8,10,7. With no separators they appear as 68107. Accumulator Start total at 0, then add a[i] on every visited index. I A28 begins at index 1 and sums 2+4+6+7+5+3 = 27.","route":"guide/26"},{"kind":"guide","label":"Optional guide · section 27","title":"2D arrays: row first, column second","text":"Draw the table before tracing int a[2][3] = {{1,2,3},{4,5,6}};\n//             col0 col1 col2\n// row0          1    2    3\n// row1          4    5    6\ncout \u003c\u003c a[1][2]; // 6 None  None 2 rows x 3 columns = 6 elements. Row 1 is the second row. Column 2 is the third column. Missing initializers become zero int b[3][3] = {{1,2},{3,4}};\n// row0: 1 2 0\n// row1: 3 4 0\n// row2: 0 0 0\ncout \u003c\u003c b[1][0]; // 3 None  None Full traversal for (int r=0; r\u003c2; ++r) {\n    for (int c=0; c\u003c3; ++c)\n        cout \u003c\u003c a[r][c] \u003c\u003c \" \";\n    cout \u003c\u003c \"\\n\";\n} None  None For a[4][5], the loop bounds are r\u003c4 and c\u003c5. A declaration may omit the first bound when initialized, but not the column bound.","route":"guide/27"},{"kind":"guide","label":"Optional guide · section 28","title":"Functions: prototype, call, definition","text":"One complete example #include \u003ciostream>\nusing namespace std;\nint add(int a, int b); // prototype\nint main() {\n    cout \u003c\u003c add(5,3) \u003c\u003c \"\\n\"; // call\n    return 0;\n}\nint add(int a, int b) { // header\n    return a + b;       // body\n} add  8\n Identify the vocabulary Prototype: int add(int a,int b); tells the compiler the interface and ends with ;. Call: add(5,3). Values 5 and 3 are arguments. a and b in the header are parameters. Definition: the header plus its braced body. Return type is int. add returns 8 to the caller. If the definition appears before the call, it already serves as a declaration. Do not execute prototypes when tracing runtime output.","route":"guide/28"},{"kind":"guide","label":"Optional guide · section 29","title":"The four function interfaces","text":"Two yes/no questions ['Arguments?', 'Return value?', 'Prototype'] [['No', 'No', 'void show();'], ['No', 'Yes', 'int readArea();'], ['Yes', 'No', 'void showArea(int side);'], ['Yes', 'Yes', 'int area(int side);']] No arguments refers to data passed in the call. No return value refers to the value sent back to the caller. Printing is not returning void showArea(int side) {\n    cout \u003c\u003c side * side;\n}\nint area(int side) {\n    return side * side;\n} None  None showArea(5); displays 25. int result=area(5); stores 25 but does not print it until cout is used. A void function can perform keyboard input and screen output. void is a return type meaning no returned value; it is not a missing return type.","route":"guide/29"},{"kind":"guide","label":"Optional guide · section 30","title":"Return the requested calculation","text":"Circle: exact requested signature float calculateArea(float radius) {\n    float areaCircle =\n        3.142f * radius * radius;\n    return areaCircle;\n} None  None Match name, return type and parameter count/type. Use the provided pi approximation. Rectangle int areaRectangle(int length,\n                  int width) {\n    return length * width;\n} None  None Function outputs follow call order powerOfThree(2); powerOfTwo(2); produces: Power of three:8\nPower of two:4 None  None Overloading in I A30 Two operate functions have different parameter types. int arguments select multiplication -> 10. float arguments select division -> 2.5. The program separates them with a tab. Functions cannot be overloaded by return type alone. Also, the I B2(c)(i) add function literally returns 0; do not assume it returns number+100.","route":"guide/30"},{"kind":"guide","label":"Optional guide · section 31","title":"Passing techniques: fill the notes gap","text":"Value copies; reference aliases void byValue(int n) { n *= 2; }\nvoid byReference(int& n) { n *= 2; }\n\nint x = 5;\nbyValue(x);     // x is still 5\nbyReference(x); // x becomes 10 None  None Pass by value changes a separate parameter. Pass by reference uses the caller's object, so changes can persist. Why this is included The course outline lists parameters/arguments passing techniques. Chapter 5 Part 1 p61 previews them, but the supplied folder has no detailed Part 2 notes. Neither DFC10353 paper directly tests pass-by-reference. The related DFC20303 paper does. This is a syllabus-coverage supplement, not evidence of extra primary-paper frequency. Do this after you can identify prototypes, calls and definitions and write a basic returned-value function.","route":"guide/31"},{"kind":"guide","label":"Optional guide · section 32","title":"Arrays as parameters; structures","text":"An array plus its element count int total(const int a[], int n) {\n    int sum = 0;\n    for (int i=0; i\u003cn; ++i)\n        sum += a[i];\n    return sum;\n}\n// int a[3]={2,4,6};\n// total(a,3) returns 12 None  None An array parameter adjusts to a pointer. Its length is not carried automatically; pass the count. const prevents changing its elements through this parameter. Structure: related-paper extension struct Menu {\n    string name;\n    double price;\n    int calories;\n};\nvoid show(const Menu& item) {\n    cout \u003c\u003c item.name;\n} None  None A structure groups named fields that may have different types. Include \u003cstring> and \u003ciostream> for this example. Pointers/structures are direct DFC20303 topics. The DFC10353 outline summary does not explicitly list them; Ch5 p61 previews structures as arguments. Treat this page as extension coverage.","route":"guide/32"},{"kind":"guide","label":"Optional guide · section 33","title":"Session I: written answers, Question 1","text":"B1(a), (b)(i)-(iii) (a) Machine language; assembly language; high-level language. (b)(i) A compiler translates before execution; an interpreter processes instructions during execution. Give both sides of one difference. START\nINPUT radius\narea = 3.142 * radius * radius\nOUTPUT area\nEND None  None (b)(iii) Input quiz1,quiz2,quiz3. Process total=quiz1+quiz2+quiz3 and average=total/3.0. Output total,average. B1(c)(i)-(iii) (i) Any four: comments, preprocessor directives, header files, main function, return statements. (ii) temperature_c -> float/double; price_of_book -> float/double; phone_number -> string; currency_rate -> float/double. (iii) ((0==3)&&(6==3))||(0\u003c1) = (false&&false)||true = true. !(0==0)&&(6!=2) = !true&&true = false. Use the expressions in the question paper. Its scheme has inconsistent substitutions but the final values True and False agree.","route":"guide/33"},{"kind":"guide","label":"Optional guide · section 34","title":"Session I: selection and loops","text":"B2(a)(i)-(iii) (i) Single if; if...else; nested if. switch is another selection construct, but use the requested three course forms here. if (mark >= 80)\n    cout \u003c\u003c \"Very Good\";\nelse\n    cout \u003c\u003c \"Good\"; None  None int total=0, num=1, count=0;\ndo {\n    total += num;\n    ++count;\n} while (count \u003c 10);\ncout \u003c\u003c total \u003c\u003c endl; None  None B2(a)(iv)-(v) #include \u003ciostream>\nusing namespace std;\nint main() {\n    for(int i=1; i\u003c=3; ++i)\n        cout \u003c\u003c \"Number \" \u003c\u003c i \u003c\u003c endl;\n    return 0;\n} None  None (v) For grade P, the output is Pass then Fail on separate lines. There is no break after the first case. The conversion above fixes uninitialized total and leaves the output after the loop. The scheme moves cout into the loop, changing the printed output sequence.","route":"guide/34"},{"kind":"guide","label":"Optional guide · section 35","title":"Session I: arrays and functions","text":"B2(b)(i)-(ii) int studentAge[10] = {};\ncout \u003c\u003c studentAge[0]; None  None The {} is a safety improvement; the original task asks for declaration and access syntax, not a meaningful student age. Value is\n51.5 None  None num[3] is 55.5, so num[3]-4 is 51.5. B2(c)(i) Prototype: int add(int a);. Header: int add(int number). The parameter names may differ between prototype and definition. B2(c)(ii)-(iii) float calculateArea(float radius) {\n    float areaCircle =\n        3.142f * radius * radius;\n    return areaCircle;\n} None  None Power of three:8\nPower of two:4 None  None The call to powerOfThree comes first. Each function prints before returning its result. The paper assigns 2 marks to B2(c)(iii). Its scheme says 4; the paper value makes Section B total 55.","route":"guide/35"},{"kind":"guide","label":"Optional guide · section 36","title":"Session II: written answers, Question 1","text":"B1(a), (b)(i)-(iii) (a) Procedural; object-oriented; event-driven programming. (b)(i) Input is data entered for processing; output is the result produced after processing. (b)(ii) 1GL machine/binary; 2GL assembly; 3GL C/C++/Java; 4GL SQL. (b)(iii) In displayed order: terminator (start/end), input/output, process/operation, decision. B1(c)(i)-(ii) (i) Give four rules: letters/digits/underscores only for basic ASCII examples; first character not a digit; no spaces; no keywords. Names are case-sensitive too. (ii) price -> float/double; address -> string; number of students -> int; Gender -> depends on representation. The scheme says bool for Gender. The field has no encoding specified. Use char for M/F, string for text, and bool only for an explicitly defined true/false flag. Raise this ambiguity with the lecturer before teaching a single forced answer.","route":"guide/36"},{"kind":"guide","label":"Optional guide · section 37","title":"Session II: square area and control","text":"B1(c)(iii): complete program #include \u003ciostream>\nusing namespace std;\nint main() {\n    int side=0, area=0;\n    cin >> side;\n    area = side * side;\n    cout \u003c\u003c area \u003c\u003c endl;\n    return 0;\n} None  None The question explicitly requires integer variables. Use an int side and int area. B2(a)(i)-(iii) (i) Sequence; selection; iteration/repetition. (ii) break transfers control out of the switch and prevents fall-through into following cases. (iii) for tests before the body and may execute zero times; do-while tests after the body and executes at least once. B2(a)(iv): fill the lines X: cin >> gender;\nY: if (gender == 'M') {\nZ: cout \u003c\u003c \"You are Female\" \u003c\u003c endl; None  None If the diagram already supplies if( ), fill only its missing condition with gender=='M'. Keep the surrounding printed syntax.","route":"guide/37"},{"kind":"guide","label":"Optional guide · section 38","title":"Session II: arrays and functions","text":"B2(a)(v), (b)(i)-(ii) for(int i=1; i\u003c=50; ++i)\n    cout \u003c\u003c i \u003c\u003c \" \"; None  None cout \u003c\u003c matrix[4];\n\nfor(int i=0; i\u003c6; ++i)\n    cout \u003c\u003c matrix[i] \u003c\u003c \" \"; None  None B2(c)(i) Call: displayMessage(\"Ali\");. Header: void displayMessage(string name). B2(c)(ii)-(iii) void printValue(string text);\nint maxValue(int a, int b); None  None int areaRectangle(int length,\n                  int width) {\n    return length * width;\n} None  None For string prototypes, include \u003cstring> and use std::string or a visible using namespace std; in a complete program. A prototype ends with ;. A definition has a body. A call supplies values/expressions without redeclaring their types.","route":"guide/38"},{"kind":"guide","label":"Optional guide · section 39","title":"Source corrections: primary papers","text":"I: correct the question, not your logic A20 (PDF p9): while(total\u003c100) sum=sum+total; is legal with one unbraced body statement. Key B incorrectly says braces are required. If total never changes, an initially true condition may never end. A21 (PDF p10): p\u003c=10 prints 2,4,6,8,10,12. Use p\u003c10 for the intended five even values. None of the listed conditions matches the target. A25 (PDF p11): wording says last and first but option C lists first then last. Correct indexes are 0 and 9; reverse their order if asked last-first. II: two definite printed errors A5 (PDF p4): correct answer is D, Decision. The scheme says C. A26 (PDF p11): every option prints cout >>. The intended index choice is B, [1][0], but correct code is cout \u003c\u003c numbers[1][0];. Why preserve the originals? The original layouts stay visible for cross-reference. The separate analysis, source checks and optional guide explain corrections. An answer-key label is not proof that faulty code is valid.","route":"guide/39"},{"kind":"guide","label":"Optional guide · section 40","title":"Source corrections: marking schemes","text":"I: preserve defined behaviour B1(c)(iii), scheme p4: the question uses (x\u003c1); the scheme transcription/substitution is inconsistent. With x=0,y=6,z=3, answers are True then False. B2(a)(iii), scheme p6: total is uninitialized in the source. A sound working version starts total=0. The scheme also moves cout inside the do loop; keep it after the loop to preserve the original output location. B2(c)(iii), scheme p11: 4 marks printed in the scheme, 2 marks in the question paper. Use 2 for historical totals. II: represent the data clearly B1(b)(ii), scheme p2: use SQL as 4GL. Prolog is presented as 5GL elsewhere in the same course material. B1(c)(ii), scheme p4: Gender -> bool is under-specified. Match the type to a defined encoding. B2(a)(iii), scheme p6: its do-while table wrongly says the condition is checked before the body. Correct: after the body. The separate source-check list contains page-specific corrections. The original schemes are evidence of intended marking, but are not all technically reliable.","route":"guide/40"},{"kind":"guide","label":"Optional guide · section 41","title":"Related DFC20303 paper: use carefully","text":"Useful extra practice Shared topics: structure/comments, identifiers/types/constants, I/O/operators, selection/loops, arrays and function anatomy. Written tasks add switch-to-if conversion, countdown output and function completion. Additional topics: pointers, struct fields/objects and reference parameters. These are reported as related-paper extensions. Two answer-key problems A5: both int const max_student=25; and const int max_student=25; are valid. The key selects D, but C is valid too. More corrections before teaching A14: with input P and no break after case P, output is perempuan then lelaki. That is option C; the key says C, so retain the case-sensitive input. A23: char* nama=\"ZARA\" is not a valid modern C++ conversion from a string literal. Correct to const char* nama=\"ZARA\";. Then *nama is 'Z' (the first character), which is the intended answer. A26: the displayed prototype omits a return type. Correct to e.g. void computeSale(int,double,int);. The intended matching argument list is (10,45.7,2). Do not add R to the two DFC10353 observations when stating a recurrence rate.","route":"guide/41"},{"kind":"guide","label":"Optional guide · section 42","title":"Objective answers: Session I","text":"DFC10353 I: intended answers ['Q', 'Ans', 'Q', 'Ans', 'Q', 'Ans'] [['1', 'C', '11', 'A', '21', 'D'], ['2', 'C', '12', 'A', '22', 'A'], ['3', 'C', '13', 'A', '23', 'C'], ['4', 'C', '14', 'B', '24', 'D'], ['5', 'B', '15', 'D', '25', 'C'], ['6', 'C', '16', 'C', '26', 'A'], ['7', 'D', '17', 'D', '27', 'A'], ['8', 'A', '18', 'A', '28', 'B'], ['9', 'C', '19', 'B', '29', 'D'], ['10', 'A', '20', 'B', '30', 'C']] Read the exceptions before marking. For malformed or ambiguous items, a letter alone is not a technically complete answer. Exceptions and ambiguities A17: the image has count\u003c=15, starting at 0. It gives 16 iterations, D. A s
