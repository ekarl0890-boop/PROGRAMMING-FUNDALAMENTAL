n syllabus material."],["note","R is supplementary: it adds pointers, structures, pass-by-reference and more function questions. Do not use it to inflate the 2/2 primary frequency."]],"source":"The offline navigator includes the complete 141-item question ledger"},{"title":"Which tasks repeat most?","chapter":"EVIDENCE","score":1,"left":[["head","Across the two DFC10353 papers"],["table",["Task group","Items","Marks"],[["Arrays","16","28"],["Loops and continue","12","26"],["Selection / switch / break","13","25"],["Function interfaces / calls","10","26"],["Names, variables and types","10","22.5"],["Language theory","9","20.5"],["Algorithms / flowcharts","7","14.5"],["IPO","7","13.5"]]],["text","One MCQ or one labelled structured subquestion = one item. An item asking for four rules is still counted once."]],"right":[["head","How to interpret these counts"],["text","All eight groups occur in 2/2 primary papers. Arrays have many short objective questions, while selection and loops together account for most of Chapter 3."],["text","The groups are mutually exclusive in this table. They total 84 items / 176 marks. The remaining 10 items / 24 marks concern structure, I/O, errors, logical/increment operators and general control recognition."],["text","Grouping affects the apparent ranking: Chapter 3 has 26 items / 54 marks across both papers when all its skills are combined."],["note","Question counts and marks describe these papers only. Do not convert them into a probability for your next exam. R is excluded."]],"source":"94 primary items / 200 marks in total | Exact item references appear in the navigator ledger"},{"title":"Words you must distinguish","chapter":"1 | INTRODUCTION","score":8,"left":[["head","Three basic definitions"],["table",["Term","Exam-ready meaning"],[["Program","Instructions that perform a task"],["Programmer","Person who writes/tests programs"],["Programming","Designing, writing, testing and maintaining code"]]],["head","Language types"],["text","Machine: binary instructions directly executed by the processor. Assembly: mnemonics such as MOV/ADD, translated by an assembler. High-level: more readable languages such as C++, Java and Python."]],"right":[["head","Three programming concepts"],["text","Procedural: steps grouped into functions. Example: calculate a total, then print a receipt."],["text","Object-oriented: data and behaviour organised in objects. Example: a Student object stores details and provides actions."],["text","Event-driven: an event source produces an event, a listener detects it and a handler responds. Example: clicking a button displays a message."],["note","A language may support several approaches. Event-driven code still executes ordinary statements inside the handler."]],"source":"I A1, B1(a); II A1,A2, B1(a) | Notes: Ch1 pp5,7-13,15"},{"title":"Generations and translators","chapter":"1 | INTRODUCTION","score":9,"left":[["head","Use safe course examples"],["table",["Generation","Language / example"],[["1GL","Machine language / binary"],["2GL","Assembly / MOV, ADD"],["3GL","C, C++, Java, Python"],["4GL","SQL"],["5GL","Prolog"]]],["text","Generation questions often ask for a match or example. MOV and ADD signal assembly, so answer second generation."]],"right":[["head","Compiler vs interpreter"],["text","Course-level comparison: a compiler translates the source before execution; an interpreter evaluates/translates instructions during execution."],["text","A good paired answer: \"A compiler translates the program before it runs, whereas an interpreter processes instructions during execution.\""],["head","Assembler"],["text","An assembler converts assembly language into machine code."],["note","Use SQL for 4GL. The II scheme also lists Prolog/LISP under 4GL, which clashes with the notes and II A3. Prolog is the safest 5GL example here."]],"source":"I A5, B1(b)(i); II A3, B1(b)(ii) | Notes: Ch1 pp14,16-20"},{"title":"IPO: turn a story into a solution","chapter":"1 | INTRODUCTION","score":10,"left":[["head","Worked example: three quizzes"],["table",["Part","Answer"],[["Input","quiz1, quiz2, quiz3"],["Process","total = quiz1 + quiz2 + quiz3"],["Process","average = total / 3.0"],["Output","total and average"]]],["text","If marks are 70, 80 and 90: total = 240, average = 80. A fixed divisor of 3 is part of the calculation, not another user input."]],"right":[["head","Worked example: square perimeter"],["text","Input: side length. Process: perimeter = 4 * side. Output: perimeter. For side 6, output 24."],["head","Quick method"],["text","Underline what is entered -> inputs. Circle what is requested -> outputs. Write the formula connecting them -> process."],["note","Different questions may ask for different outputs from the same story. If the question asks for average only, do not answer \"total\" instead."]],"source":"I A6,A8,A13, B1(b)(iii); II A4,A7, B1(b)(i) | Notes: Ch1 pp21-24,33"},{"title":"Flowcharts: recognise and translate","chapter":"1 | INTRODUCTION","score":10,"left":[["head","Symbols with a purpose"],["table",["Shape","Purpose"],[["Oval / rounded terminator","Start or end"],["Parallelogram","Input or output"],["Rectangle","Processing / calculation"],["Diamond","Decision / condition"],["Arrow","Direction of control"],["Connector","Continue flow here/elsewhere"]]],["text","A decision has labelled outcomes such as True/False. Follow the branch that matches the condition."]],"right":[["head","Circle flowchart -> pseudocode"],["code","START\nINPUT radius\narea = 3.142 * radius * radius\nOUTPUT area\nEND",null,"",null],["text","Same logic in C++: read radius, calculate area, display area. Preserve the formula and the order of the original flowchart."],["note","II A5: a condition check uses a diamond/Decision, option D. The supplied key incorrectly says C."]],"source":"I A3,A4, B1(b)(ii); II A5, B1(b)(iii) | Notes: Ch1 pp29-33"},{"title":"Algorithm patterns and pseudocode","chapter":"1 | INTRODUCTION","score":8,"left":[["head","Three patterns"],["code","SEQUENCE\nINPUT side\narea = side * side\nOUTPUT area\n\nSELECTION\nIF mark >= 60 THEN\n    OUTPUT \"Passed\"\nELSE\n    OUTPUT \"Failed\"\nEND IF",null,"",null],["text","Indent the controlled steps so the structure is obvious."]],"right":[["head","Iteration"],["code","counter = 1\nWHILE counter \u003c= 3\n    OUTPUT counter\n    counter = counter + 1\nEND WHILE",null,"",null],["text","This displays 1, 2 and 3. Then counter becomes 4, so the condition is false and repetition stops."],["note","Pseudocode has no single universal syntax. Use clear, consistent wording; C++ code needs actual C++ keywords and braces."]],"source":"I A2; II A6 | Notes: Ch1 pp25-28,31-33"},{"title":"A complete C++ program","chapter":"2 | FUNDAMENTALS","score":9,"left":[["head","Memorise the structure"],["code","#include \u003ciostream>\nusing namespace std;\n\nint main() {\n    // Calculate a square area\n    int side = 0;\n    cin >> side;\n    int area = side * side;\n    cout \u003c\u003c area \u003c\u003c \"\\n\";\n    return 0;\n}","square","6\n","36\n"]],"right":[["head","Label the components"],["text","#include is a preprocessor directive. \u003ciostream> is the header providing stream declarations."],["text","main is the entry function for this console program. Braces contain its body. Each ordinary declaration/expression statement ends with a semicolon."],["text","// starts a single-line comment. /* ... */ encloses a block comment. return 0; ends main successfully."],["note","Correct the legacy examples when writing your own answers: use int main() and \u003ciostream>. Do not copy void main() or \u003ciostream.h>."]],"source":"I B1(c)(i); II A8, B1(c)(iii) | Notes: Ch2 pp11-36,80-81"},{"title":"Names, variables and constants","chapter":"2 | FUNDAMENTALS","score":9,"left":[["head","Identify valid names"],["table",["Name","Verdict"],[["total_mark","Valid"],["box22A","Valid"],["2ndValue","Invalid: begins with a digit"],["my name","Invalid: space"],["int","Invalid: keyword"],["sum-total","Invalid: hyphen operator"]]],["text","Age and age are different names. For your own code, start with a letter to avoid reserved underscore forms."]],"right":[["head","Three different actions"],["code","int count = 0; // declaration + init\ncount = 5;     // later assignment\nconst int LIMIT = 10; // constant\nconst char GRADE = 'A';",null,"",null],["head","Scope"],["text","A local variable is visible in its block after declaration. A global is outside functions and available where its declaration is visible. A local name may hide a global name."],["note","There is no general 31-character identifier limit. Keywords are language tokens; cin, cout and string are library names, not keywords."]],"source":"I A9-A12; II A9, B1(c)(i) | Notes: Ch2 pp41-67"},{"title":"Choose types; initialise values","chapter":"2 | FUNDAMENTALS","score":10,"left":[["head","Match the meaning to the type"],["table",["Data","Suitable choice"],[["Number of students","int"],["Temperature / currency rate","float or double"],["Price","float/double for this course"],["Phone / address","string"],["An M/F character code","char"],["A yes/no flag","bool"]]],["text","A phone number is text: preserve leading zeroes and symbols. Use char for a single quoted character such as 'M'."]],"right":[["head","Initialize before use"],["code","int total = 0;\nint count = 0;\ndouble average = 0.0;\nchar grade = 'A';\nstring phone = \"0123456789\";\nbool passed = true;",null,"",null],["text","int x; by itself does not give an ordinary local int a usable predictable value. Read/assign it before using it."],["note","float is about significant-digit precision, not a fixed six-decimal-place limit. The source scheme says bool for Gender without specifying an encoding; that field is ambiguous."]],"source":"I A14, B1(c)(ii); II A10, B1(c)(ii) | Notes: Ch2 pp52-76"},{"title":"Input/output and the working order","chapter":"2 | FUNDAMENTALS","score":9,"left":[["head","Read -> calculate -> display"],["code","#include \u003ciostream>\nusing namespace std;\nint main() {\n    int a = 0, b = 0;\n    cin >> a >> b;\n    int sum = a + b;\n    cout \u003c\u003c \"Sum is: \" \u003c\u003c sum \u003c\u003c \"\\n\";\n    return 0;\n}","sum","3 4\n","Sum is: 7\n"]],"right":[["head","Two arrows to remember"],["text","cin >> variable receives a value. cout \u003c\u003c expression displays a value. cout \u003c\u003c \"score\" prints the word; cout \u003c\u003c score prints the stored value."],["head","Text with spaces"],["code","string name;\ngetline(cin >> ws, name);\ncout \u003c\u003c name;",null,"",null],["text","Include \u003cstring> when using string. cin >> name alone stops at whitespace."],["note","Do not print a calculation before reading its inputs. II A26 has cout >> in every choice; the intended output operator is \u003c\u003c."]],"source":"II A12,A13, B1(c)(iii) | Notes: Ch2 pp92-94"},{"title":"Operators: arithmetic and updates","chapter":"2 | FUNDAMENTALS","score":7,"left":[["head","Use the correct operation"],["table",["Expression","Result"],[["2 * 5 + 2 / 1","12"],["12 % 5 - 1","1"],["4 + (7 - 3) * 3","16"],["(2 * 4) * 2 - (6 + 2) / 8","15"],["5 / 2  (int operands)","2"],["5.0 / 2","2.5"]]],["text","Parentheses first; then * / %; then + -. Integer division discards the fractional part."]],"right":[["head","Assignments change the value"],["code","int x = 10;\nx += 5; // x becomes 15\nx *= 2; // x becomes 30",null,"",null],["head","Prefix vs postfix, independently"],["code","int i = 6;\nint j = ++i; // i=7, j=7\n\n// Start again from i=6\nint k = 6;\nint m = k++; // k=7, m=6",null,"",null],["note","In a standalone statement x++; and ++x; both add one. Their yielded values differ when used in another expression."]],"source":"II A14; supports I B1(c)(iii), A28,A30 | Notes: Ch2 pp96-109,119-122"},{"title":"Boolean expressions: show the steps","chapter":"2 | FUNDAMENTALS","score":8,"left":[["head","AND, OR and NOT"],["table",["P","Q","P&&Q","P||Q","!P"],[["0","0","0","0","1"],["0","1","0","1","1"],["1","0","0","1","0"],["1","1","1","1","0"]]],["text","With x=0, y=6, z=3:"],["code","((x==z) && (y==z)) || (x\u003c1)\n= (false && false) || true\n= false || true\n= true",null,"",null]],"right":[["head","Second expression"],["code","!(x==0) && (y!=2)\n= !true && true\n= false && true\n= false",null,"",null],["text","Use the original paper expression. The supplied I scheme mistranscribes parts of its substitution, although the final True/False answers agree."],["note","= assigns; == compares. For &&, a false left side skips the right. For ||, a true left side skips the right."]],"source":"I B1(c)(iii) | Notes: Ch2 pp110-120"},{"title":"Errors: diagnose before fixing","chapter":"2 | FUNDAMENTALS","score":8,"left":[["head","Separate the stages"],["table",["Kind","Example / meaning"],[["Syntax / compile","Missing ; or invalid grammar"],["Link","Declared function has no linked definition"],["Runtime problem","Failure during execution"],["Logic","Runs but produces wrong result"]]],["text","The exam asks whether a compiler can detect a logic mistake. Usually it cannot know your intended formula."]],"right":[["head","A legal statement can be wrong"],["code","if (mark >= 60); // empty if body\n{\n    cout \u003c\u003c \"Passed\"; // always runs\n}",null,"",null],["text","Remove the stray semicolon to make the block conditional."],["head","Unsafe output questions"],["text","Reading outside an array or reading an uninitialized local int has no fixed, valid numeric answer. Integer division by zero is undefined behaviour; no portable error message is guaranteed."]],"source":"I A7; II A11 | Notes: Ch2 pp83-90"},{"title":"Selection: one condition at a time","chapter":"3 | CONTROL STRUCTURES","score":10,"left":[["head","The mark boundary matters"],["code","if (mark >= 80) {\n    cout \u003c\u003c \"Very Good\";\n} else {\n    cout \u003c\u003c \"Good\";\n}",null,"",null],["text","79 -> Good. 80 -> Very Good. 81 -> Very Good."],["head","Braces group statements"],["text","Without braces, only the next statement belongs to the if/else/loop body."]],"right":[["head","Trace the unbraced example"],["code","int mark = 35;\nif (mark >= 50)\n    cout \u003c\u003c \"Pass\";\ncout \u003c\u003c \"Your mark is \" \u003c\u003c mark;","unbraced","","Your mark is 35"],["text","Only the first cout is conditional. Since 35>=50 is false, the second line still prints Your mark is 35."],["note","For an else-if ladder, test the highest grade threshold first. Validate 0..100 if the task includes input validation."]],"source":"I A16,A19,A22, B2(a)(i),(ii); II A17,A21, B2(a)(iv) | Ch3 pp17-36,46-51"},{"title":"Switch: follow execution past labels","chapter":"3 | CONTROL STRUCTURES","score":10,"left":[["head","Fall-through example"],["code","char grade = 'P';\nswitch (grade) {\ncase 'P':\n    cout \u003c\u003c \"Pass\\n\";\ncase 'F':\n    cout \u003c\u003c \"Fail\\n\";\n    break;\ndefault:\n    cout \u003c\u003c \"Invalid Grade\\n\";\n}","fallthrough","","Pass\nFail\n"]],"right":[["head","Why both lines appear"],["text","The switch enters case P, prints Pass and continues into case F because there is no break after Pass. It prints Fail, reaches break and exits the switch."],["head","Two purposes of break"],["text","It transfers control out of the switch. It prevents unintended fall-through into following case statements."],["text","default handles an unmatched value. Group case labels when several exact values share one body."],["note","switch uses integral/enum values, including char. Use if/else for ranges such as mark>=80 or conditions on strings."]],"source":"I B2(a)(v); II A18, B2(a)(ii) | Notes: Ch3 pp37-45"},{"title":"Choose and compare loops","chapter":"3 | CONTROL STRUCTURES","score":10,"left":[["head","Know the test position"],["table",["Loop","Test","Minimum runs"],[["for","Before body","0"],["while","Before body","0"],["do...while","After body","1"]]],["text","Typical choice: for when a count is known; while when repetition depends on a condition; do-while when the body must run first."],["text","All three can express many of the same algorithms. The choice guidance is a convention, not a hard language restriction."]],"right":[["head","Three essential components"],["text","Initialisation sets the starting state. Condition decides whether to continue. Update makes progress toward stopping."],["code","for (int i=1; i\u003c=3; ++i) {\n    cout \u003c\u003c i \u003c\u003c \" \";\n}",null,"",null],["text","Trace: i=1 print 1; i=2 print 2; i=3 print 3; update to 4; condition false; stop."],["note","A for loop continues while its condition is true. Chapter 3 p81 incorrectly says it continues until true."]],"source":"I A17,A18; II A16,A19, B2(a)(iii) | Notes: Ch3 pp53-65,71-89"},{"title":"For loops: count and print exactly","chapter":"3 | CONTROL STRUCTURES","score":10,"left":[["head","Complete program: Number 1..3"],["code","#include \u003ciostream>\nusing namespace std;\nint main() {\n    for (int i=1; i\u003c=3; ++i) {\n        cout \u003c\u003c \"Number \" \u003c\u003c i \u003c\u003c \"\\n\";\n    }\n    return 0;\n}","numbers","","Number 1\nNumber 2\nNumber 3\n"]],"right":[["head","Display 1 through 50"],["code","for (int i=1; i\u003c=50; ++i) {\n    cout \u003c\u003c i \u003c\u003c \" \";\n}",null,"",null],["head","Count the iterations"],["text","Contrast: count=0; count\u003c15 visits 0..14 (15 times). The actual I A17 image uses count\u003c=15, so it visits 0..15 (16 times). With i=0;i\u003c=10;i+=2 there are 6 iterations."],["note","Count body executions, not the number of condition checks. The condition is tested once more when the loop stops."]],"source":"I A17, B2(a)(iv); II B2(a)(v) | Notes: Ch3 pp81-89"},{"title":"While to do-while: preserve the logic","chapter":"3 | CONTROL STRUCTURES","score":9,"left":[["head","Corrected while accumulation"],["code","int total = 0, num = 1, count = 0;\nwhile (count \u003c 10) {\n    total = total + num;\n    ++count;\n}\ncout \u003c\u003c total \u003c\u003c \"\\n\";","while_total","","10\n"],["text","The original question leaves total uninitialized. Initialize it to zero when writing a correct working solution."]],"right":[["head","Equivalent here: do-while"],["code","int total = 0, num = 1, count = 0;\ndo {\n    total = total + num;\n    ++count;\n} while (count \u003c 10);\ncout \u003c\u003c total \u003c\u003c \"\\n\";","do_total","","10\n"],["text","The initial condition is true, so both execute ten times here. If it might be false initially, an unguarded do-while changes behaviour."],["note","Use if(condition) { do {...} while(condition); } to preserve a possible zero-iteration case. Keep the original output location outside the loop."]],"source":"I B2(a)(iii); II B2(a)(iii) | Notes: Ch3 pp61-80"},{"title":"Jump statements and boundary traps","chapter":"3 | CONTROL STRUCTURES","score":8,"left":[["head","Where does control go?"],["table",["Statement","Effect"],[["break","Leave nearest loop/switch"],["continue","Skip rest of this iteration"],["return","Leave current function"],["exit(status)","Terminate program"]]],["code","for (int i=1; i\u003c=5; ++i) {\n    if (i==3) continue;\n    cout \u003c\u003c i \u003c\u003c \" \";\n}","skip","","1 2 4 5 "]],"right":[["head","Do-while off-by-one trap"],["code","int p = 0;\ndo {\n    p += 2;\n    cout \u003c\u003c p \u003c\u003c \" \";\n} while (p \u003c 10);","even","","2 4 6 8 10 "],["text","Because the update/print happen before the test, p\u003c=10 would run once more and print 12. The I A21 answer choices do not include the correct p\u003c10."],["note","In a for loop, continue still executes the update. In a while loop, it may skip an update placed after continue."]],"source":"II A22; I A21; II B2(a)(ii) | Notes: Ch3 pp90-107"},{"title":"Arrays: size, index and element","chapter":"4 | ARRAYS","score":10,"left":[["head","One name, several same-type values"],["code","int a[5] = {10,20,30,40,50};\n// index:     0  1  2  3  4\ncout \u003c\u003c a[0]; // 10: first element\ncout \u003c\u003c a[4]; // 50: fifth/last\na[2] = 75;    // third becomes 75",null,"",null],["text","Size is 5. The indexes are 0..4. An element is a stored value such as a[2]."]],"right":[["head","Past-paper declaration"],["code","int studentAge[10] = {};\ncout \u003c\u003c studentAge[0];",null,"",null],["text","The original task asks for declaration and first-element access. The added {} safely initializes all elements; a real student age should be read/assigned before use."],["head","Trace the index first"],["text","For num={70.5,82.5,63.0,55.5,100.0}, num[3]-4 = 55.5-4 = 51.5."],["note","There is no valid a[5] element in a size-5 array. Do not confuse fifth element a[4] with index 5."]],"source":"I A24,A25, B2(b)(i),(ii); II A24,A25,A27, B2(b)(i) | Ch4 pp3-17,26-30"},{"title":"Array loops: input, output and sums","chapter":"4 | ARRAYS","score":10,"left":[["head","Visit each element once"],["code","int matrix[6] = {1,2,3,4,5,6};\ncout \u003c\u003c matrix[4] \u003c\u003c \"\\n\";\nfor (int i=0; i\u003c6; ++i) {\n    cout \u003c\u003c matrix[i] \u003c\u003c \" \";\n}","matrix","","5\n1 2 3 4 5 6 "],["head","Read into an array"],["code","int marks[5] = {};\nfor (int i=0; i\u003c5; ++i)\n    cin >> marks[i];",null,"",null]],"right":[["head","Output exactly as written"],["code","int a[4] = {4,2,0,3};\nfor (int i=0; i\u003c4; ++i)\n    cout \u003c\u003c 10-a[i];","arraytrace","","68107"],["text","The values are 6,8,10,7. With no separators they appear as 68107."],["head","Accumulator"],["text","Start total at 0, then add a[i] on every visited index. I A28 begins at index 1 and sums 2+4+6+7+5+3 = 27."]],"source":"I A28; II A28, B2(b)(ii) | Notes: Ch4 pp18-25,28-31"},{"title":"2D arrays: row first, column second","chapter":"4 | ARRAYS","score":9,"left":[["head","Draw the table before tracing"],["code","int a[2][3] = {{1,2,3},{4,5,6}};\n//             col0 col1 col2\n// row0          1    2    3\n// row1          4    5    6\ncout \u003c\u003c a[1][2]; // 6",null,"",null],["text","2 rs to data passed in the call. No return value refers to the value sent back to the caller."]],"right":[["head","Printing is not returning"],["code","void showArea(int side) {\n    cout \u003c\u003c side * side;\n}\nint area(int side) {\n    return side * side;\n}",null,"",null],["text","showArea(5); displays 25. int result=area(5); stores 25 but does not print it until cout is used."],["note","A void function can perform keyboard input and screen output. void is a return type meaning no returned value; it is not a missing return type."]],"source":"I B2(c)(ii); II A30, B2(c)(ii),(iii) | Ch5 original pp42-58; simplified pp20-27"},{"title":"Return the requested calculation","chapter":"5 | FUNCTIONS","score":10,"left":[["head","Circle: exact requested signature"],["code","float calculateArea(float radius) {\n    float areaCircle =\n        3.142f * radius * radius;\n    return areaCircle;\n}",null,"",null],["text","Match name, return type and parameter count/type. Use the provided pi approximation."],["head","Rectangle"],["code","int areaRectangle(int length,\n                  int width) {\n    return length * width;\n}",null,"",null]],"right":[["head","Function outputs follow call order"],["text","powerOfThree(2); powerOfTwo(2); produces:"],["code","Power of three:8\nPower of two:4",null,"",null],["head","Overloading in I A30"],["text","Two operate functions have different parameter types. int arguments select multiplication -> 10. float arguments select division -> 2.5. The program separates them with a tab."],["note","Functions cannot be overloaded by return type alone. Also, the I B2(c)(i) add function literally returns 0; do not assume it returns number+100."]],"source":"I A30, B2(c)(ii),(iii); II B2(c)(iii) | Ch5 original pp32,49,55-58"},{"title":"Passing techniques: fill the notes gap","chapter":"5 | SUPPLEMENT","score":6,"left":[["head","Value copies; reference aliases"],["code","void byValue(int n) { n *= 2; }\nvoid byReference(int& n) { n *= 2; }\n\nint x = 5;\nbyValue(x);     // x is still 5\nbyReference(x); // x becomes 10",null,"",null],["text","Pass by value changes a separate parameter. Pass by reference uses the caller's object, so changes can persist."]],"right":[["head","Why this is included"],["text","The course outline lists parameters/arguments passing techniques. Chapter 5 Part 1 p61 previews them, but the supplied folder has no detailed Part 2 notes."],["text","Neither DFC10353 paper directly tests pass-by-reference. The related DFC20303 paper does. This is a syllabus-coverage supplement, not evidence of extra primary-paper frequency."],["note","Do this after you can identify prototypes, calls and definitions and write a basic returned-value function."]],"source":"Course Outline p2; Ch5 Part 1 p61; R A30 and B2(b)(iii),(iv)"},{"title":"Arrays as parameters; structures","chapter":"5 | SUPPLEMENT","score":5,"left":[["head","An array plus its element count"],["code","int total(const int a[], int n) {\n    int sum = 0;\n    for (int i=0; i\u003cn; ++i)\n        sum += a[i];\n    return sum;\n}\n// int a[3]={2,4,6};\n// total(a,3) returns 12",null,"",null],["text","An array parameter adjusts to a pointer. Its length is not carried automatically; pass the count. const prevents changing its elements through this parameter."]],"right":[["head","Structure: related-paper extension"],["code","struct Menu {\n    string name;\n    double price;\n    int calories;\n};\nvoid show(const Menu& item) {\n    cout \u003c\u003c item.name;\n}",null,"",null],["text","A structure groups named fields that may have different types. Include \u003cstring> and \u003ciostream> for this example."],["note","Pointers/structures are direct DFC20303 topics. The DFC10353 outline summary does not explicitly list them; Ch5 p61 previews structures as arguments. Treat this page as extension coverage."]],"source":"Ch5 Part 1 p61; R B2(a)(ii),(iv) | Supplement, not primary recurrence"},{"title":"Session I: written answers, Question 1","chapter":"W e corrections: marking schemes","chapter":"CHECKED ERRATA","score":1,"left":[["head","I: preserve defined behaviour"],["text","B1(c)(iii), scheme p4: the question uses (x\u003c1); the scheme transcription/substitution is inconsistent. With x=0,y=6,z=3, answers are True then False."],["text","B2(a)(iii), scheme p6: total is uninitialized in the source. A sound working version starts total=0. The scheme also moves cout inside the do loop; keep it after the loop to preserve the original output location."],["text","B2(c)(iii), scheme p11: 4 marks printed in the scheme, 2 marks in the question paper. Use 2 for historical totals."]],"right":[["head","II: represent the data clearly"],["text","B1(b)(ii), scheme p2: use SQL as 4GL. Prolog is presented as 5GL elsewhere in the same course material."],["text","B1(c)(ii), scheme p4: Gender -> bool is under-specified. Match the type to a defined encoding."],["text","B2(a)(iii), scheme p6: its do-while table wrongly says the condition is checked before the body. Correct: after the body."],["note","The separate source-check list contains page-specific corrections. The original schemes are evidence of intended marking, but are not all technically reliable."]],"source":"Verified against the supplied question images, schemes and standard C++ behaviour"},{"title":"Related DFC20303 paper: use carefully","chapter":"SUPPLEMENTARY EVIDENCE","score":5,"left":[["head","Useful extra practice"],["text","Shared topics: structure/comments, identifiers/types/constants, I/O/operators, selection/loops, arrays and function anatomy. Written tasks add switch-to-if conversion, countdown output and function completion."],["text","Additional topics: pointers, struct fields/objects and reference parameters. These are reported as related-paper extensions."],["head","Two answer-key problems"],["text","A5: both int const max_student=25; and const int max_student=25; are valid. The key selects D, but C is valid too."]],"right":[["head","More corrections before teaching"],["text","A14: with input P and no break after case P, output is perempuan then lelaki. That is option C; the key says C, so retain the case-sensitive input."],["text","A23: char* nama=\"ZARA\" is not a valid modern C++ conversion from a string literal. Correct to const char* nama=\"ZARA\";. Then *nama is 'Z' (the first character), which is the intended answer."],["text","A26: the displayed prototype omits a return type. Correct to e.g. void computeSale(int,double,int);. The intended matching argument list is (10,45.7,2)."],["note","Do not add R to the two DFC10353 observations when stating a recurrence rate."]],"source":"R = DFC20303 Session I 2025/2026 | All R items appear separately in the navigator ledger"},{"title":"Objective answers: Session I","chapter":"CHECKED ANSWER KEY","score":1,"left":[["head","DFC10353 I: intended answers"],["table",["Q","Ans","Q","Ans","Q","Ans"],[["1","C","11","A","21","D"],["2","C","12","A","22","A"],["3","C","13","A","23","C"],["4","C","14","B","24","D"],["5","B","15","D","25","C"],["6","C","16","C","26","A"],["7","D","17","D","27","A"],["8","A","18","A","28","B"],["9","C","19","B","29","D"],["10","A","20","B","30","C"]]],["text","Read the exceptions before marking. For malformed or ambiguous items, a letter alone is not a technically complete answer."]],"right":[["head","Exceptions and ambiguities"],["text","A17: the image has count\u003c=15, starting at 0. It gives 16 iterations, D. A similar count\u003c15 example would give 15."],["text","A18: key A (for) is the closest pre-test-loop match. B (do-while) is also repetition, so \"same concept\" is loosely worded."],["text","A20: the key says B, but one unbraced body statement is legal. No listed repair correctly identifies the actual issue."],["text","A21: the key says D, but p\u003c=10 prints 12 too. Correct condition p\u003c10 is absent."],["text","A23: key C uses string[10][15], but A char[10][15] also declares a 2D array of the specified dimensions. The question do ","score":1,"label":"Chapter 1 · Introduction · p3","title":"Navigation / learning outcomes","text":"BY THE END TOPIC STUDENT BE ABLE TO: 1.2 Describe fundamentals of programming languages. • 1.2.1 State the definitions of programmer, program and programming • 1.2.2 Explain the following language translators: • a. Assembler • b. Compiler • c. Interpreter 1.3 Identify problem solving concept. • 1.3.1 Define input, process and output • 1.3.2 List the steps in problem solving: • a. Identify the inputs and outputs • b. Identify other data and constants required to solve the problem • c. Identify what needs to be computed DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nBY THE END TOPIC STUDENT BE ABLE TO:\n1.2 Describe fundamentals of programming \nlanguages.\n• 1.2.1 State the definitions of programmer, \nprogram and programming\n• 1.2.2 Explain the following language \ntranslators:\n• a. Assembler\n• b. Compiler\n• c. Interpreter\n1.3 Identify problem solving concept.\n• 1.3.1 Define input, process and output\n• 1.3.2 List the steps in problem solving:\n• a. Identify the inputs and outputs\n• b. Identify other data and constants \nrequired to solve the problem\n• c. Identify what needs to be computed Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/01/3"},{"kind":"notes","source":"01","score":1,"label":"Chapter 1 · Introduction · p4","title":"Navigation / learning outcomes","text":"BY THE END TOPIC STUDENT BE ABLE TO: 1.4 Describe the different types and patterns in algorithms to solve problem. 1.4.1 Define algorithm 1.4.2 Describe the different patterns (construct) in algorithm: Sequential, Conditional, Iterational 1.4.3 Define flowcharts 1.4.4 Identify the standardized symbols to visually represent various aspects of an algorithm or a process a. Terminator b. Connector Lines c . Process d. Data e. Decision f. On and Off Page Reference 1.4.5 Develop flowchart based on the problem statements 1.4.6 Define pseudo code 1.4.7 Explain the purpose of using pseudo code and best practices 1.4.8 Solve problem using pseudo code DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nBY THE END TOPIC STUDENT BE ABLE TO:\n1.4 Describe the different types and patterns in algorithms to solve problem. \n1.4.1 Define algorithm\n1.4.2 Describe the different patterns (construct) in algorithm: Sequential, Conditional, Iterational\n1.4.3 Define flowcharts\n1.4.4 Identify the standardized symbols to visually represent various aspects of an algorithm or a process\na. Terminator\nb. Connector Lines\nc . Process\nd. Data\ne. Decision\nf. On and Off Page Reference\n1.4.5 Develop flowchart based on the problem statements\n1.4.6 Define pseudo code\n1.4.7 Explain the purpose of using pseudo code and best practices\n1.4.8 Solve problem using pseudo code Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/01/4"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p5","title":"Program, programmer and programming","text":"Programming Languages • Programming Language - A set of rules and reserved words (keywords) that can be used to tell a computer what are the operations to be done. • Artificial language composed by a fixed vocabulary and set of rules is used to create instructions for the computer to follow. • Now, there are over 200 programming languages in the world. • For example: Cobol, Pascal, C, C++, JAVA and Fortran. Introduction to programming Machine 000100006 language instruction opco de ADD operand-1 4 Program Set of instructions to perform a tasK Computer •101 operand-2 Assembly Language instruction can execute only machine language instructions CPU central processing unit DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nProgramming Languages\n▪ Programming Language - A set of rules and reserved words (keywords) that can be used \nto tell a computer what are the operations to be done.\n▪ Artificial language composed by a fixed vocabulary and set of rules is used to create \ninstructions for the computer to follow.\n▪ Now, there are over 200 programming languages in the world. \n▪ For example: Cobol, Pascal, C, C++, JAVA and Fortran.\n Program, programmer and programming I A1; II A1","route":"notes/01/5"},{"kind":"notes","source":"01","score":3,"label":"Chapter 1 · Introduction · p6","title":"History and uses of languages","text":"The history of programming language and approaches EVOLUTION OF PROGRAMMING LANGUAGES • 1940s - 1950s: Low-level languages like Machine Language and Assembly Language were used. • 1957: FORTRAN - the first high-level programming language. • 1960s - 1980s: Emergence of procedural languages such as C and Pascal. • 1990s: The era of Object-Oriented Programming - Java, C++. • 2000s to present: Scripting languages (Python, JavaScript) and visual programming (Scratch) became popular. ASSEMBLY LANGUAGE LANGUAGE FORTRAN FORTRAN COBOL COBOL HIGH-LEVEL LANUAGES Development approach: From machine level → more human-readable → cross-platform usability. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nThe history of programming language and approaches\n• 1940s – 1950s: Low-level languages like Machine Language and Assembly Language \nwere used.\n • 1957: FORTRAN – the first high-level programming language.\n • 1960s – 1980s: Emergence of procedural languages such as C and Pascal.\n • 1990s: The era of Object-Oriented Programming – Java, C++.\n • 2000s to present: Scripting languages (Python, JavaScript) and visual programming \n(Scratch) became popular.\n Development approach: From machine level → more human-readable → cross-platform \nusability.\n History and uses of languages Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/01/6"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p7","title":"Machine, assembly and high-level languages","text":"Differentiate the different types of programming languages: • 1. Machine Language - Binary language (0 and 1). - Direct instructions to CPU. - Hard for humans to understand, but fastest to execute. 2. Assembly Language - Uses symbols or mnemonic codes (e.g., MOV, ADD). - Requires an assembler to translate into machine code. - Easier than machine language, but still low-level. 3. High-Level Language - Human-friendly and easy to write. - Examples: C, C++, Java, Python. - Requires a compiler or interpreter to execute. 10110000 00000001 ; Load 1 into register 10110001 00000010 ; Load 2 into another register 00000001 ; Add the two registers MOV AL, 1 ; Load 1 into register AL MOV BL, 2 ; Load 2 into register BL ADD AL, BL ; Add the values MOV CL, AL ; Store the result in CL num1 = 1 num2 = 2 sum = num1 + num2 print(\"The sum is:\", sum) DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nDifferentiate the different types of programming languages:\n• 1. Machine Language\n    - Binary language (0 and 1).\n    - Direct instructions to CPU.\n    - Hard for humans to understand, but fastest to execute.\n 2. Assembly Language\n    - Uses symbols or mnemonic codes (e.g., MOV, ADD).\n    - Requires an assembler to translate into machine code.\n    - Easier than machine language, but still low-level.\n 3. High-Level Language\n    - Human-friendly and easy to write.\n    - Examples: C, C++, Java, Python.\n    - Requires a compiler or interpreter to execute.\n10110000 00000001  ; Load 1 into register\n10110001 00000010  ; Load 2 into another \nregister\n00000001           ; Add the two registers\nMOV AL, 1     ; Load 1 into register AL\nMOV BL, 2     ; Load 2 into register BL\nADD AL, BL    ; Add the values\nMOV CL, AL    ; Store the result in CL\nnum1 = 1\nnum2 = 2\nsum = num1 + num2\nprint(\"The sum is:\", sum) Machine, assembly and high-level languages I B1(a)","route":"notes/01/7"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p8","title":"Procedural, object-oriented and event-driven","text":"Describe the programming language concepts: a. Procedural Programming #include \u003cstdio.h> Programming approach that focuses on a sequence of steps int main() { or procedures (functions) to solve a problem. int a = 5, b = 3; int sum = a + b; • Follows a top-down approach. printf(\"Sum: %d\", sum); • Uses functions/procedures to organize code. return 0; • Executes instructions step by step. Example Languages: C, Pascal Code Example (C): DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nDescribe the programming language concepts:\na. Procedural Programming\nProgramming approach that focuses on a sequence of steps \nor procedures (functions) to solve a problem.\n• Follows a top-down approach.\n• Uses functions/procedures to organize code.\n• Executes instructions step by step.\nExample Languages:\nC, Pascal\nCode Example (C):\n#include \u003cstdio.h>\nint main() {\n    int a = 5, b = 3;\n    int sum = a + b;\n    printf(\"Sum: %d\", sum);\n    return 0;\n} Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/8"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p9","title":"Procedural, object-oriented and event-driven","text":"b. Object-Oriented Programming (OOP) A programming approach that structures a program using objects that contain data (attributes) and functions (methods). • Encapsulation -Combining data and functions into a single unit (class). • Inheritance- One class can inherit properties and methods from another. • Polymorphism -Functions or methods can behave differently based on the context. • Abstraction - Hiding internal details and showing only the necessary features. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nb. Object-Oriented Programming (OOP)\nA programming approach that structures a program using objects that contain data (attributes) and \nfunctions (methods).\n• Encapsulation -Combining data and functions into a single unit (class).\n• Inheritance- One class can inherit properties and methods from another.\n• Polymorphism -Functions or methods can behave differently based on the context.\n• Abstraction - Hiding internal details and showing only the necessary features. Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/9"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p10","title":"Procedural, object-oriented and event-driven","text":"b. Object-Oriented Programming (OOP) Class = Blueprint • A class is like a house blueprint. • It describes how the house looks (rooms, doors) but is not a house yet. • In programming: A class defines attributes and behaviors. class Student { string name; int age; void study(; • Object = Real House • An object is the real house built from the blueprint. • You can create many houses from one blueprint. • In programming: Each object has its own data. Student s1; // an object of class Student DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nb. Object-Oriented Programming (OOP)\nClass = Blueprint\n• A class is like a house blueprint.\n• It describes how the house looks (rooms, doors) \nbut is not a house yet.\n• In programming: A class defines attributes and \nbehaviors.\nclass Student {\n    string name;\n    int age;\n    void study();\n};\n• Object = Real House\n• An object is the real house built from the \nblueprint.\n• You can create many houses from one blueprint.\n• In programming: Each object has its own data.\nStudent s1; // an object of class Student Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/10"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p11","title":"Procedural, object-oriented and event-driven","text":"b. Object-Oriented Programming (OOP) Advantages of OOP • Easier to manage and scale large programs. • Promotes code reuse via inheritance. • Supports modularity, making debugging and maintenance easier. • Fits real-world modeling (e.g., Student, BankAccount, Car). C++ Example: #include \u003ciostream> using namespace std; // Define a class (Blueprint) class Student { public: string name; int age; void introduce() { cout «\"Hello, my name is \" « name \u003c\" and I am \" « age \u003c\"years old.\" \u003c endl; }: int main() { // Create an object of the class Student s1; s1.name = \"Ali\"; s1.age = 20; // Call the method s1.introduce(); return 0; DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nb. Object-Oriented \nProgramming (OOP)\n#include \u003ciostream>\nusing namespace std;\n// Define a class (Blueprint)\nclass Student {\npublic:\n    string name;\n    int age;\n    void introduce() {\n        cout \u003c\u003c \"Hello, my name is \" \u003c\u003c name \u003c\u003c \" and I am \" \u003c\u003c age \u003c\u003c \" years \nold.\" \u003c\u003c endl;\n    }\n};\nint main() {\n    // Create an object of the class\n    Student s1;\n    s1.name = \"Ali\";\n    s1.age = 20;\n    // Call the method\n    s1.introduce();\n    return 0;\n}\nAdvantages of OOP\n•\n  Easier to manage and scale large programs.\n•\n  Promotes code reuse via inheritance.\n•\n  Supports modularity, making debugging and \nmaintenance easier.\n•\n  Fits real-world modeling (e.g., Student, \nBankAccount, Car).\nC++ Example: Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/11"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p12","title":"Procedural, object-oriented and event-driven","text":"c. Event-Driven Programming A programming style where the flow of the program is controlled by events like: • Mouse clicks • Keyboard presses • Touch gestures • Sensor triggers Instead of running line-by-line, the program waits for events and then executes a specific action. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nc. Event-Driven Programming\nA programming style where the flow of the program is controlled by events like:\n• Mouse clicks\n• Keyboard presses\n• Touch gestures\n• Sensor triggers\nInstead of running line-by-line, the program waits for events and then executes a specific action. Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/12"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p13","title":"Procedural, object-oriented and event-driven","text":"c. Event-Driven Programming Explanation: •onclick = event listener •When the button is clicked → alert message appears. \u003cbutton onclick=\"alert('Button Clicked!)\">Click Me\u003c/button> Imagine a doorbell: •The doorbell button is the event. •When someone presses it, the bell rings (action). •The program is idle until the event happens. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nc. Event-Driven Programming\n\u003cbutton onclick=\"alert('Button Clicked!')\">Click Me\u003c/button>\nExplanation:\n•onclick = event listener\n•When the button is clicked → alert message appears.\nImagine a doorbell:\n•The doorbell button is the event.\n•When someone presses it, the bell rings (action).\n•The program is idle until the event happens. Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/01/13"},{"kind":"notes","source":"01","score":9,"label":"Chapter 1 · Introduction · p14","title":"Five generations of languages","text":"The generations of programming language with example: High Level Programming Low Level Programming First generation -Type: Machine Language Written in binary (0 and 1) Executed directly by the CPU Pros: Very fast execution Cons: Hard to read, hardware- dependent Second Generation Type: Assembly Language Uses mnemonics (short words like MOV, ADD) Needs an assembler to translate into machine code Pros: Easier than binary Cons: Still hardware-specific 10110101 11001001 MOV A, 05 ADD A, 10 Third Generation Type: High-Level Language Human-readable with English- like syntax Needs compiler or interpreter Languages: C, Java, Python Pros: Portable, easier to learn Cons: Slower than machine language int sum = a + b; printf(\"%d\", sum); Fourth generation Type: Declarative or Non- procedural Focus on what to do, not how Used for databases, reports, and scripting Pros: Faster development, less coding Cons: Limited control over low-level operations SELECT name FROM students WHERE score > 80; Info Brothel 00 & Visual Language FORTRAN Pascal High-level-Language Assembly Language Machine Language Hardware Type: Logic & Al-based Languages Used in Artificial Intelligence and Machine Learning Focus on solving problems automatically Example Languages: Prolog, LISP Pros: Can solve complex AI problems Cons: High processing requirements, niche usage System : Is it true that there's petrol in the fuel tank? User System : Is it true that the engine turns over? User : No. System : Is it true that the lights come on? User : No. System : I conclude that there is a problem with battery DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nThe generations of \nprogramming language with \nexample:\nFirst generation\n-Type: Machine Language\nWritten in binary (0 and 1)\nExecuted directly by the CPU\nPros: Very fast execution\nCons: Hard to read, hardware-\ndependent\nSecond Generation\nType: Assembly Language\nUses mnemonics (short words \nlike MOV, ADD)\nNeeds an assembler to \ntranslate into machine code\nPros: Easier than binary\nCons: Still hardware-specific\nThird Generation\nType: High-Level Language\nHuman-readable with English-\nlike syntax\nNeeds compiler or interpreter\nLanguages: C, Java, Python\nPros: Portable, easier to learn\nCons: Slower than machine \nlanguage\nFourth generation\nType: Declarative or Non-\nprocedural\nFocus on what to do, not how\nUsed for databases, reports, \nand scripting\nPros: Faster development, less \ncoding\nCons: Limited control over \nlow-level operations\nFifth Generation\nType: Logic & AI-based \nLanguages\nUsed in Artificial Intelligence \nand Machine Learning\nFocus on solving problems \nautomatically\nExample Languages: Prolog, \nLISP\nPros: Can solve complex AI \nproblems\nCons: High processing \nrequirements, niche usage\n10110101 \n11001001\nMOV A, 05\nADD A, 10\nint sum = a + b;\nprintf(\"%d\", sum);\nSELECT name FROM \nstudents WHERE score \n> 80;\nparent(john, mary).\n Five generations of languages I A5; II A3; II B1(b)(ii)","route":"notes/01/14"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p15","title":"Program, programmer and programming","text":"The definitions of programmer, program and programming Programmer: A person who writes and tests code to create software programs. Program: A set of instructions written in a programming language to perform a specific task. Programming: The process of designing, writing, testing, and maintaining the source code of software applications. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nThe definitions of programmer, program and programming\nProgrammer: A \nperson who writes \nand tests code to \ncreate software \nprograms.\nProgram: A set of \ninstructions written \nin a programming \nlanguage to perform a \nspecific task.\nProgramming: The \nprocess of designing, \nwriting, testing, and \nmaintaining the \nsource code of \nsoftware applications. Program, programmer and programming I A1; II A1","route":"notes/01/15"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p16","title":"Assembler, compiler and interpreter","text":"Language translators A translator is a program that: • Checks syntax of a program to ensure the programming language is used correctly, by giving you the syntax-error messages, which is known as diagnostics. • Produces descriptive error messages known as syntax-error to programmer if there are errors in the programs. Translates a program into language that the computer can understand. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nLanguage translators\nA translator is a program that:\n▪ Checks syntax of a program to ensure the programming language is used correctly, \nby giving you the syntax-error messages, which is known as diagnostics.\n▪ Produces descriptive error messages known as syntax-error to programmer if \nthere are errors in the programs.\n▪ Translates a program into language that the computer can understand. Assembler, compiler and interpreter I B1(b)(i)","route":"notes/01/16"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p17","title":"Assembler, compiler and interpreter","text":"Language translators • Syntax - set of rules to be followed when writing a program, these rules are similar to the grammatical rules in English. • Syntax Error - error in the use of a programming language. • Example in C: Statement: clrscr() If semicolon (;) is not placed after statement, a message will display: \"Error DIT103.CPP: Declaration syntax- error\" • The correct syntax is: clrscr(); DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nLanguage translators\n▪ Syntax – set of rules to be followed when writing a program, these rules are similar to the \ngrammatical rules in English.\n▪ Syntax Error – error in the use of a programming language.\n▪ Example in C: Statement: clrscr()\n If semicolon (;) is not placed after statement, a message will display:\n “Error DIT103.CPP: Declaration syntax- error”\n▪  The correct syntax is: clrscr(); Assembler, compiler and interpreter I B1(b)(i)","route":"notes/01/17"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p18","title":"Assembler, compiler and interpreter","text":"Assembler: • Translates the whole program at one time. • Also called assembler program. • A program, which is used to convert assembly language to machine language. sseg sseg dseg data dseg ends cseg assume segment stack db 256 dup (?) ends segment db\"2x4=\" segment cs:cseg:ds:sdeg:ss:sseg. es:nothing Start proc far Assembler 11101 100000 100000 11110 10111000 11101000 11111100 10111000 10001110 11011000 10111000 10001110 11000000 Machine Language Assembly Language DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nAssembler:\n• Translates the whole program at one time.\n• Also called assembler program.\n• A program, which is used to convert assembly language to machine language.\n Assembler, compiler and interpreter I B1(b)(i)","route":"notes/01/18"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p19","title":"Assembler, compiler and interpreter","text":"Compiler • Translate the whole program at one time. • Translates the source code, for example COBOL language to machine language. • Used to translate C, C++,COBOL and other language. # include \u003cstdio.h> main() 11101 100000 100000 11110 int x, y, z, sum; double avg; 10111000 Compiler 11101000 11111100 printf(\" Enter 3 numbers:\"); 10111000 scanf(\"%d %d %d\", &x, &y, &z); 10001110 11011000 sum =x + y + Z; 10111000 avg = sum / 3; 10001110 11000000 printf(\"x = %d y = %d z = %d \", x, y, Z); printf(\"the average is = %f\",avg); Machine Langeage return 0; C Language DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nCompiler \n• Translate the whole program at one time.\n• Translates the source code, for example COBOL language to machine language.\n• Used to translate C, C++,COBOL and other language.\n Assembler, compiler and interpreter I B1(b)(i)","route":"notes/01/19"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p20","title":"Assembler, compiler and interpreter","text":"Interpreter • Program that translates a high level language to machine language. • It translates one line at a time and executes each line after it is translated. • Displays feedback as the error occurred. • Used to translate BASIC and SQL language. 'BASIC PROGRAM 'AVERAGING THREE INTEGERS PRINT \"Mengira Purata\" PRINT \" PRINT \"Nilai A = \": 20 PRINT \"Nilai B = \". ; 30 PRINT \"Nilai C =\": 40 PRINT \"Purata tiga nombor ialah\": (20+30+40)/3 END Interperter 10001110 10111010 10111011 10001101 10111111 10110000 10110011 11100011 00001110 10100000 10111001 10100100 11000000 110110 000000010 000001000 111111000 110000 Basic Language Machine Language DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nInterpreter \n• Program that translates a high level language to machine language.\n• It translates one line at a time and executes each line after it is translated.\n• Displays feedback as the error occurred.\n• Used to translate BASIC and SQL language.\n Assembler, compiler and interpreter I B1(b)(i)","route":"notes/01/20"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p21","title":"Input, process and output","text":"Input, Process and Output Input: Data provided to the program to be processed. Process: The manipulation of input data according to rules or algorithms. Output: The result produced after processing the input. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nInput, Process and Output\nInput: Data \nprovided to the \nprogram to be \nprocessed.\nProcess: The \nmanipulation of \ninput data \naccording to rules \nor algorithms.\nOutput: The result \nproduced after \nprocessing the \ninput. Input, process and output I A6,A8,A13; I B1(b)(iii); II A4,A7; II B1(b)(i)","route":"notes/01/21"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p22","title":"Input, process and output","text":"Example: Flow of ATM program • Assume that our transaction is money withdrawal. The instructions are: • Get the card number from the user. (Input, Process, Output) • Get pin number from the user. (Input, Process, Output) • Process the input data. (Input, Process, Output) Get the transaction chosen by the user. (Input, Process, Output) • Get the account type from the user. (Input, Process, Output) • Process the transaction as wanted by the user. (Input, Process, Output) • Withdraw amount of money required by the user. (Input, Process, Output) • Print receipt for the user. (Input, Process, Output) DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nExample: Flow of ATM program\n• Assume that our transaction is money withdrawal. The \ninstructions are:\n• Get the card number from the user. (Input, Process, Output)\n• Get pin number from the user. (Input, Process, Output)\n• Process the input data. (Input, Process, Output)\n• Get the transaction chosen by the user. (Input, Process, Output)\n• Get the account type from the user. (Input, Process, Output)\n• Process the transaction as wanted by the user. (Input, Process, Output)\n• Withdraw amount of money required by the user. (Input, Process, Output)\n• Print receipt for the user. (Input, Process, Output) Input, process and output I A6,A8,A13; I B1(b)(iii); II A4,A7; II B1(b)(i)","route":"notes/01/22"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p23","title":"Input, process and output","text":"• Input: Example: Card number, ATM pin number, type of transaction, type of account, amount of money to withdraw. • Process: • Output: Example: Process to identify card number, valid pin number, type of transaction, type of account and deducts the withdrawal from the user's account. Example: Receipt will show balance in user's account and money withdrawn. ATM MACHINE ction Your transa is being processe RM 100. 17.7.2000 040 : 100 Date ATM No : Amount ank you INPUT PROCESS OUTPUT DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\n• Input: \n Example: Card number, ATM pin number, type of transaction, type of account, \namount of money to withdraw.\n• Process: \n Example: Process to identify card number, valid pin number, type of transaction, \ntype of account and deducts the withdrawal from the user’s account.\n• Output:  \n Example: Receipt will show balance in user’s account and money withdrawn.\nINPUT PROCESS OUTPUT Input, process and output I A6,A8,A13; I B1(b)(iii); II A4,A7; II B1(b)(i)","route":"notes/01/23"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p24","title":"Input, process and output","text":"List the steps in problem solving: Identify the Inputs and * Inputs: What information or data is provided to the system? Example: For a program that calculates the average of three numbers, the inputs are the three numbers. Outputs: What results or outcomes are expected? Example: The average value is the output. Other Data and Constants Determine if there are any fixed values, formulas, or assumptions needed to compute the output. Example: You may need a constant like pi = 3.1416 for a circle area calculation. What Needs to Be Computed Analyze the logic or operations required to process the inputs into outputs. Example: Use the formula (num1 + num2 + num3) / 3 to compute the average. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nList the steps in problem solving:\nIdentify the Inputs and \nOutputs\nInputs: What information \nor data is provided to the \nsystem?\nExample: For a program \nthat calculates the \naverage of three numbers, \nthe inputs are the three \nnumbers.\nOutputs: What results or \noutcomes are expected?\nExample: The average \nvalue is the output.\nOther Data and Constants \nRequired \nDetermine if there are any \nfixed values, formulas, \nor assumptions needed to \ncompute the output.\nExample: You may need a \nconstant like pi = 3.1416\nfor a circle area \ncalculation.\nWhat Needs to Be Computed\nAnalyze the logic or \noperations required to \nprocess the inputs into \noutputs.\nExample: Use the formula \n(num1 + num2 + num3) / 3\nto compute the average. Input, process and output I A6,A8,A13; I B1(b)(iii); II A4,A7; II B1(b)(i)","route":"notes/01/24"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p25","title":"Algorithms and their three patterns","text":"Algorithms and Problem-Solving Patterns An algorithm is a step-by-step set of instructions designed to perform a specific task or solve a particular problem. It is written in a way that can be implemented using programming languages or flowcharts. Algorithm is a sequence of instructions to solve a problem, written in human language, and it can solve any problems when it is used with the correct procedure. Example: Get Input 3 numbers Total up the 3 numbers using formula: Total = number1 + number2 + number3 Calculate average 3 number using formula; Average = (number1 + number2 + number3)/3 Display Total, Average DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nAlgorithms and Problem-Solving Patterns\nAn algorithm is a step-by-step set of instructions designed to perform a specific task or solve a particular \nproblem. It is written in a way that can be implemented using programming languages or flowcharts.\nAlgorithm is a sequence of instructions to solve a problem, written in human language, and it can solve \nany problems when it is used with the correct procedure.\nExample:\n1. Get Input 3 numbers\n2. Total up the 3 numbers using formula:\n               Total = number1 + number2 + number3\n3.      Calculate average 3 number using formula;\n                Average = (number1 + number2 + number3)/3\n4.        Display Total, Average Algorithms and their three patterns I A2,A3; II A6","route":"notes/01/25"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p26","title":"Algorithms and their three patterns","text":"Different pattern in algorithm 1. Sequential: • Instructions are executed one after another in a specific order. • In this control, every step will be executed one by one from top to bottom. • Every box in control structure is a process. Every process is done sequentially • The beginning and end of a block of statements can be optionally marked with the keywords begin/start and end. Start Statement A Statement B End DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nDifferent pattern in algorithm\n1. Sequential: \n• Instructions are executed one after another in a specific \norder.\n• In this control, every step will be executed one by one \nfrom top to bottom. \n• Every box in control structure is a process. Every \nprocess is done sequentially\n• The beginning and end of a block of statements can be \noptionally marked with the keywords begin/start and end.\nStart\nStatement A\nStatement B\nEnd Algorithms and their three patterns I A2,A3; II A6","route":"notes/01/26"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p27","title":"Algorithms and their three patterns","text":"2. Conditional Instructions include decision-making (e.g., if-else statements). • Usually used in structured programming. • Control structure will execute an instruction based on result of a condition or comparison, the result either TRUE or FALSE. • If the condition result is true, the control program will execute the instruction within the TRUE loop operation. • Otherwise, it will execute the next instruction or the instruction within the FALSE loop operation. START Condition True → Statement False END DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\n2. Conditional\nInstructions include decision-making (e.g., if-else statements).\n Usually used in structured programming. \n Control structure will execute an instruction based on result \nof a condition or comparison, the result either TRUE or \nFALSE.\n If the condition result is true, the control program will execute \nthe instruction within the TRUE loop operation.\n Otherwise, it will execute the next instruction or the \ninstruction within the FALSE loop operation.\nSTART\nCondition Statement\nEND\nFalse\nTrue Algorithms and their three patterns I A2,A3; II A6","route":"notes/01/27"},{"kind":"notes","source":"01","score":8,"label":"Chapter 1 · Introduction · p28","title":"Algorithms and their three patterns","text":"3. Iterative: Instructions repeat a set of steps using loops (e.g., for, while). • An iterative control structure allows a set of instructions to repeat until a certain condition is met. • Instead of writing the same code many times, you use a loop to execute it multiple times automatically. Start ¡=0 i++ Yes Print i i \u003c 10? No End DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\n3. Iterative: Instructions repeat a set of steps \nusing loops (e.g., for, while).\n• An iterative control structure allows a set of \ninstructions to repeat until a certain condition \nis met.\n• Instead of writing the same code many times, \nyou use a loop to execute it multiple times \nautomatically.\n Algorithms and their three patterns I A2,A3; II A6","route":"notes/01/28"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p29","title":"Flowcharts and symbols","text":"Flowcharts A flowchart is a graphical representation of a process or algorithm. It uses standardized symbols to illustrate the sequence of steps needed to complete a task. a. Terminator - Represents the start or end of a process. b. Connector Lines - Arrows that indicate the flow of the process. c. Process - Represents a task or operation. d. Data - Represents input or output. e. Decision - Represents a decision point with yes/no or true/false outcomes. f. On and Off Page Reference - Used to indicate continuation of flowcharts on another page. DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nFlowcharts\nA flowchart is a graphical representation of a process or algorithm. It uses standardized \nsymbols to illustrate the sequence of steps needed to complete a task.\na. Terminator – Represents the start or end of a process.\nb. Connector Lines – Arrows that indicate the flow of the process.\nc. Process – Represents a task or operation.\nd. Data – Represents input or output.\ne. Decision – Represents a decision point with yes/no or true/false outcomes.\nf. On and Off Page Reference – Used to indicate continuation of flowcharts on another page. Flowcharts and symbols I A3,A4; I B1(b)(ii); II A5; II B1(b)(iii)","route":"notes/01/29"},{"kind":"notes","source":"01","score":10,"label":"Chapter 1 · Introduction · p30","title":"Flowcharts and symbols","text":"Flowchart Symbols Carta alir / Flowchart Symbol Name Start/end Arrows Input/Output Process Decision Function An oval represents a start or end point. A line is a connector that shows elationships between th epresentative shape A parallelogram represents input or ouptut. A rectangle represents a process. A diamond indicates a d. Q START Input Process Output END Penerangan / Explanation Enter data from keyboard Calculate total Display data and total DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nFlowchart Symbols\n Flowcharts and symbols I A3,A4; I B1(b)(ii); II A5; II B1(b)(iii)","route":"notes/01/30"},{"kind":"notes","source":"01","score":9,"label":"Chapter 1 · Introduction · p31","title":"Pseudocode and worked algorithms","text":"Pseudo Code v Steps in problem solving that is written half in programming code and half in human language. • Example: START Input number1, number2, number3; Total = number1 + number2 + number3; Average = (number1 + number2 + number3)/3 Display Total, Average; END DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nPseudo Code\n Steps in problem solving that is written half in programming \ncode and half in human language.\n Example:\n START\n Input number1, number2, number3;\n Total = number1 + number2 + number3;\n Average = (number1 + number2 + number3)/3\n Display Total, Average;\n END\n• Pseudocode and worked algorithms I A2; I B1(b)(ii); II A6","route":"notes/01/31"},{"kind":"notes","source":"01","score":9,"label":"Chapter 1 · Introduction · p32","title":"Pseudocode and worked algorithms","text":"Pseudo Code v Steps in problem solving that is written half in programming code and half in human language. v Example: START Input number1, number2, number3; Total = number1 + number2 + number3; Average = (number1 + number2 + number3)/3 Display Total, Average; END DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nPseudo Code\n Steps in problem solving that is written half in programming code and half \nin human language.\n Example:\n START\n Input number1, number2, number3;\n Total = number1 + number2 + number3;\n Average = (number1 + number2 + number3)/3\n Display Total, Average;\n END Pseudocode and worked algorithms I A2; I B1(b)(ii); II A6","route":"notes/01/32"},{"kind":"notes","source":"01","score":9,"label":"Chapter 1 · Introduction · p33","title":"Pseudocode and worked algorithms","text":"Program to calculate average 3 number. Write the algorithm, flowchart and pseudocode 1. Get Input 3 numbers ALGORITHM 2. Total up the 3 numbers using formula: Total = number1 + number2 + number3 3. Calculate average 3 number using formula; Average = (number1 + number2 + number3)/3 Display Total, Average START PSEUDOCODE Input number1, number2, number3; Total = number1 + number2 + number3; Average = (number1 + number2 + number3)/3 Display Total, Average; END START NUMBER 1. NUMBER 2, NUMBER 3 TOTAL = NUMBER1+NUMBER2+NUMBER 3 AVERAGE = TOTAL / 3 TOTAL AVERAGE END FLOWCHART DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nProgram to calculate average 3 number. Write \nthe algorithm, flowchart and pseudocode\n1. Get Input 3 numbers\n2. Total up the 3 numbers using formula:\n   Total = number1 + number2 + number3\n3.      Calculate average 3 number using \nformula;\n      Average = (number1 + number2 + \nnumber3)/3\n4.        Display Total, Average\nSTART\n       Input number1, number2, number3;\n       Total = number1 + number2 + number3;\n       Average = (number1 + number2 + \nnumber3)/3\n       Display Total, Average;\nEND\nALGORITHM\nPSEUDOCODE\nFLOWCHART Pseudocode and worked algorithms I A2; I B1(b)(ii); II A6","route":"notes/01/33"},{"kind":"notes","source":"01","score":4,"label":"Chapter 1 · Introduction · p34","title":"Readable code and good practice","text":"BEST PRACTICES 1. Use Meaningful Names •Choose clear and descriptive names for variables, functions, and classes. studentName instead of X sn calculateTotal() instead of X ct() 2. Keep Code Readable •Indent properly (4 spaces or 1 tab). •Use blank lines to separate different logic sections. •Avoid writing everything in one long line. 3. Comment Your Code •Use comments to explain what the code does, not to repeat the obvious. // Calculate the average score of the students average = totalScore / numberOfStudents; DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTALS\nBEST PRACTICES \n1. Use Meaningful Names\n•Choose clear and descriptive names for variables, functions, and classes.\nstudentName instead of \n  sn\ncalculateTotal() instead of \n  ct()\n2. Keep Code Readable\n•Indent properly (4 spaces or 1 tab).\n•Use blank lines to separate different logic sections.\n•Avoid writing everything in one long line.\n3. Comment Your Code\n•Use comments to explain what the code does, not to repeat \nthe obvious.\n// Calculate the average score of the students\naverage = totalScore / numberOfStudents; Readable code and good practice Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/01/34"},{"kind":"notes","source":"01","score":4,"label":"Chapter 1 · Introduction · p35","title":"Readable code and good practice","text":"4. Test Often, Test Small • Test your code in small sections before moving on. •Don't wait until the whole program is written. 5. Don't Repeat Yourself (DRY Principle) •If you write the same code twice, make it a function. 6. Save & Backup Frequently •Save your work often. •Keep backups in cloud storage (Google Drive, GitHub, OneDrive). DFC10353 PROGRAMMING FUNDAMENTALS DFC10353 PROGRAMMING FUNDAMENTA
