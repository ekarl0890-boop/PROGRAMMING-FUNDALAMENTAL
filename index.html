on tool between humans and \ncomputers. \n2. History of Programming Language \n1. 1940s–1950s \no Machine Language \no Assembly Language \no Low-level language \n2. 1957 \no FORTRAN introduced as the first high-level programming language. \n3. 1960s–1980s \no Procedural languages became popular. \no Examples: C, Pascal \n4. 1990s \no Object-Oriented Programming became popular. \no Examples: Java, C++ \n5. 2000s–Present \no Scripting and visual programming became popular. \no Examples: Python, JavaScript, Scratch \n6. Development trend \no From machine-level language to more human-readable language.  Program, programmer and programming I A1; II A1","route":"notes/02/1"},{"kind":"notes","source":"02","score":8,"label":"Chapter 1 · Summary · p2","title":"Procedural, object-oriented and event-driven","text":"3. Types of Programming Languages • Machine Language • Uses binary numbers: 0 and 1 • Directly understood by CPU • Very fast • Difficult for humans to understand • Assembly Language • Uses short codes or mnemonics • Examples: MOV, ADD o Needs assembler to translate into machine language • Easier than machine language but still low-level • High-Level Language • Easier for humans to read and write • Examples: C, C++, Java, Python • Needs compiler or interpreter before execution 4. Programming Language Concepts • Procedural Programming • Program runs step by step. • Uses procedures or functions. • Follows top-down approach. • Examples: C, Pascal • Object-Oriented Programming • Program is built using objects. • Object contains data and methods. • Key concepts: • Encapsulation • Inheritance • Polymorphism • Abstraction • Example objects: • Student • Car • BankAccount • Event-Driven Programming • Program responds to events. • Examples of events: • Mouse click • Keyboard press • Touch gesture • Sensor trigger • Example: Button clicked → message appears 3. Types of Programming Languages \n• Machine Language \no Uses binary numbers: 0 and 1 \no Directly understood by CPU \no Very fast \no Difficult for humans to understand \n• Assembly Language \no Uses short codes or mnemonics \no Examples: MOV, ADD \no Needs assembler to translate into machine language \no Easier than machine language but still low-level \n• High-Level Language \no Easier for humans to read and write \no Examples: C, C++, Java, Python \no Needs compiler or interpreter before execution \n \n4. Programming Language Concepts \n• Procedural Programming \no Program runs step by step. \no Uses procedures or functions. \no Follows top-down approach. \no Examples: C, Pascal \n• Object-Oriented Programming \no Program is built using objects. \no Object contains data and methods. \no Key concepts: \n▪ Encapsulation \n▪ Inheritance \n▪ Polymorphism \n▪ Abstraction \no Example objects: \n▪ Student \n▪ Car \n▪ BankAccount \n• Event-Driven Programming \no Program responds to events. \no Examples of events: \n▪ Mouse click \n▪ Keyboard press \n▪ Touch gesture \n▪ Sensor trigger \no Example: \n▪ Button clicked → message appears \n  Procedural, object-oriented and event-driven II A2; II B1(a)","route":"notes/02/2"},{"kind":"notes","source":"02","score":9,"label":"Chapter 1 · Summary · p3","title":"Five generations of languages","text":"5. Generations of Programming Language • First Generation • Machine Language • Written in binary • Executed directly by CPU • Second Generation • Assembly Language • Uses mnemonics like MOV and ADD • Needs assembler • Third Generation • High-Level Language • Human-readable syntax • Examples: C, Java, Python • Fourth Generation • Declarative or non-procedural language • Focuses on what to do, not how to do it • Example: SQL • Fifth Generation • Logic and Al-based language • Used in Artificial Intelligence and Machine Learning • Examples: Prolog, LISP 6. Basic Terms in Programming • Programmer • A person who writes and tests code. • Program • A set of instructions written in a programming language. • Programming o The process of designing, writing, testing and maintaining code. 7. Language Translators • Purpose • Translate programming language into machine language. • Check syntax errors. • Give error messages to programmers. • Syntax o Rules for writing a program. • Syntax Error • Error caused by incorrect programming rules. 5. Generations of Programming Language \n• First Generation \no Machine Language \no Written in binary \no Executed directly by CPU \n• Second Generation \no Assembly Language \no Uses mnemonics like MOV and ADD \no Needs assembler \n• Third Generation \no High-Level Language \no Human-readable syntax \no Examples: C, Java, Python \n• Fourth Generation \no Declarative or non-procedural language \no Focuses on what to do, not how to do it \no Example: SQL \n• Fifth Generation \no Logic and AI-based language \no Used in Artificial Intelligence and Machine Learning \no Examples: Prolog, LISP \n \n6. Basic Terms in Programming \n• Programmer \no A person who writes and tests code. \n• Program \no A set of instructions written in a programming language. \n• Programming \no The process of designing, writing, testing and maintaining code. \n \n7. Language Translators \n• Purpose \no Translate programming language into machine language. \no Check syntax errors. \no Give error messages to programmers. \n• Syntax \no Rules for writing a program. \n• Syntax Error \no Error caused by incorrect programming rules. \n  Five generations of languages I A5; II A3; II B1(b)(ii)","route":"notes/02/3"},{"kind":"notes","source":"02","score":10,"label":"Chapter 1 · Summary · p4","title":"Input, process and output","text":"• Types of Translators • Assembler • Converts assembly language into machine language. Compiler- • Translates the whole program at one time. • Used for C, C++, COBOL and others. • Interpreter • Translates one line at a time. • Executes each line immediately. • Shows errors as they occur. 8. Problem Solving Concept • Input • Data entered into the program. • Example: numbers, name, PIN number • Process • Steps or calculations performed by the program. • Example: calculating total or checking PIN • Output • Result produced after processing. • Example: answer, receipt, balance • Problem Solving Steps • Identify the inputs. • Identify the expected outputs. • Identify other data or constants needed. • Identify what needs to be calculated. 9. Algorithm • Definition • A step-by-step instruction to solve a problem. • Purpose • Helps plan a solution before writing code. • Example: Calculate average of 3 numbers • Input 3 numbers. • Add the 3 numbers. • Divide total by 3. • Display total and average. • Types of Translators \no Assembler \n▪ Converts assembly language into machine language. \no Compiler-  \n▪ Translates the whole program at one time. \n▪ Used for C, C++, COBOL and others. \no Interpreter \n▪ Translates one line at a time. \n▪ Executes each line immediately. \n▪ Shows errors as they occur. \n \n8. Problem Solving Concept \n• Input \no Data entered into the program. \no Example: numbers, name, PIN number \n• Process \no Steps or calculations performed by the program. \no Example: calculating total or checking PIN \n• Output \no Result produced after processing. \no Example: answer, receipt, balance \n• Problem Solving Steps \no Identify the inputs. \no Identify the expected outputs. \no Identify other data or constants needed. \no Identify what needs to be calculated. \n \n9. Algorithm \n• Definition \no A step-by-step instruction to solve a problem. \n• Purpose \no Helps plan a solution before writing code. \n• Example: Calculate average of 3 numbers \no Input 3 numbers. \no Add the 3 numbers. \no Divide total by 3. \no Display total and average. \n \n \n  Input, process and output I A6,A8,A13; I B1(b)(iii); II A4,A7; II B1(b)(i)","route":"notes/02/4"},{"kind":"notes","source":"02","score":10,"label":"Chapter 1 · Summary · p5","title":"Flowcharts and symbols","text":"10. Algorithm Patterns • Sequential • Instructions run one after another. • Example: • Start Statement A • Statement B • End • Conditional • Uses decision making. • Based on TRUE or FALSE. Example: • If mark >= 50, pass. • Else, fail. • Iterative • Repeats instructions using loops. • Examples: for • while • Useful when the same task must be repeated. 11. Flowchart • Definition • A diagram that shows the flow of a process or algorithm. • Purpose • Helps visualize the steps of a program. • Common Symbols • Terminator Start or end of process • Connector Lines • Show flow direction • Process • Task or operation • Data • Input or output • Decision • Yes/no or true/false choice • On-page / Off-page Reference • Continue flowchart on same or different page 10. Algorithm Patterns \n• Sequential \no Instructions run one after another. \no Example: \n▪ Start \n▪ Statement A \n▪ Statement B \n▪ End \n• Conditional \no Uses decision making. \no Based on TRUE or FALSE. \no Example: \n▪ If mark >= 50, pass. \n▪ Else, fail. \n• Iterative \no Repeats instructions using loops. \no Examples: \n▪ for \n▪ while \no Useful when the same task must be repeated. \n \n11. Flowchart \n• Definition \no A diagram that shows the flow of a process or algorithm. \n• Purpose \no Helps visualize the steps of a program. \n• Common Symbols \no Terminator \n▪ Start or end of process \no Connector Lines \n▪ Show flow direction \no Process \n▪ Task or operation \no Data \n▪ Input or output \no Decision \n▪ Yes/no or true/false choice \no On-page / Off-page Reference \n▪ Continue flowchart on same or different page \n \n \n \n  Flowcharts and symbols I A3,A4; I B1(b)(ii); II A5; II B1(b)(iii)","route":"notes/02/5"},{"kind":"notes","source":"02","score":9,"label":"Chapter 1 · Summary · p6","title":"Pseudocode and worked algorithms","text":"12. Pseudocode • Definition • A simple way to write programming logic using human language and code style. • Purpose • Helps plan the program before writing real code. • Example structure • START • Input numbers • Calculate total • Calculate average • Displa ment COMMENTS\nComments used to improve the \nreadability and understanding of the \nprogram.\n// (Double Slash) \nrepresents comments in \nC++ program. Comments can be of \nsingle line or multiple lines. Double \nSlash comments are used to \nrepresent single line comments.\n Single-line and block comments Supports I B1(c)(i); direct comment questions in related R B1(a)(ii)","route":"notes/03/14"},{"kind":"notes","source":"03","score":6,"label":"Chapter 2 · Fundamentals · p15","title":"Single-line and block comments","text":"COMMENTS Multi-line comments start with /* and ends with */. Any text between /* and */ will be ignored by the compiler: Example /* The code below will print the words Hello World! to the screen, and it is amazing */ cout « \"Hello World!\"; COMMENTS\nMulti-line comments start with /* \nand ends with */.\nAny text between /* and */ will\nbe ignored by the compiler:\n Single-line and block comments Supports I B1(c)(i); direct comment questions in related R B1(a)(ii)","route":"notes/03/15"},{"kind":"notes","source":"03","score":6,"label":"Chapter 2 · Fundamentals · p16","title":"Single-line and block comments","text":"COMMENTS Increase the reading program To document the program As reference Provide additional information COMMENTS\nIncrease the reading program\nTo document the program\nAs reference\nProvide additional information Single-line and block comments Supports I B1(c)(i); direct comment questions in related R B1(a)(ii)","route":"notes/03/16"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p17","title":"Preprocessor directives","text":"PREPROCESSOR DIRECTIVES > The preprocessors are the directives, which give instructions to the compiler to preprocess the information before actual compilation starts. >All preprocessor directives begin with #, and only white-space characters may appear before a preprocessor directive on a line. Preprocessor directives are not C++ statements, so they do not end in a semicolon (;). >You already have seen a #include directive in all the examples. This macro is used to include a header file into the source file. > There are number of preprocessor directives supported by C++ like #include, #define, #if, #else, #line, etc PREPROCESSOR DIRECTIVES \nThe preprocessors are the directives, which give instructions to the compiler to \npreprocess the information before actual compilation starts.\nAll preprocessor directives begin with #, and only white-space characters may \nappear before a preprocessor directive on a line. Preprocessor directives are not \nC++ statements, so they do not end in a semicolon (;).\nYou already have seen a #include directive in all the examples. This macro is used \nto include a header file into the source file.\nThere are number of preprocessor directives supported by C++ like #include, \n#define, #if, #else, #line, etc Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/17"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p18","title":"Preprocessor directives","text":"PREPROCESSOR DIRECTIVES • Pre-processor is a component command of the C++ will be called by the C++ program that contains a special command such as: • Enter the file into the program • Substituting the value of certain data using a representation of the name. PREPROCESSOR DIRECTIVES \n•Pre-processor is a component command of the C++ will be called by \nthe C++ program that contains a special command such as:\n◦ Enter the file into the program \n◦ Substituting the value of certain data using a  representation of the \nname.  Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/18"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p19","title":"Preprocessor directives","text":"PREPROCESSOR DIRECTIVES •Two examples of preprocessor instructions are: • include • define •Rules to provide preprocessor V Place on the top v Begin with the symbol # v Written in small letters v Cannot be end with the semicolon PREPROCESSOR DIRECTIVES \n•Two examples of preprocessor instructions are:\n include \n define\n•Rules to provide preprocessor \n Place on the top \n Begin with the symbol # \n Written in small letters \n Cannot  be end with the semicolon Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/19"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p20","title":"Preprocessor directives","text":"Instruction finclude Calling a function from standard library #include \u003cFileName> File name between signs\u003c > (angle bracket) Example #include \u003c iostream #include \u003cstring> #include \u003cmath> > Instruction \n#include\nCalling a function from \nstandard library\n#include \u003cFileName> File name between \nsigns\u003c >\n(angle bracket)\n#include \u003c iostream >\n#include \u003cstring>\n#include \u003cmath>\nExample Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/20"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p21","title":"Preprocessor directives","text":"PREPROCESSOR DIRECTIVES - #include \u003ciostream> # #include \u003ciostream> Lines starting with the '#' symbol is processed by the pre-processor, before compiling the program. • Is known as pre-processor directive. • Each pre-processor directive has its own header file (FileName). • Pre-processor directive gives instruction so that manipulation can be done on the programs. Example, by instructing the processor to include other files that are needed by the program. #include \u003cFileName> or #include \"FileName\" Used for the process of displaying output on the screen or getting input from the user via the keyboard ( example cin and cout) PREPROCESSOR DIRECTIVES \n–\n#include \u003ciostream>\n# • Lines starting with the ‘#’ symbol is processed by the pre-processor, before \ncompiling the program.\n#include • Is known as pre-processor directive.\n• Each pre-processor directive has its own header file (FileName).\n• Pre-processor directive gives instruction so that manipulation  can be done on \nthe programs. Example, by instructing the processor to include other files that \nare needed by the program.\n\u003ciostream> • Used for the process of displaying output on the screen or getting input from the user \nvia the keyboard ( example cin and cout)\n#include \u003cFileName> \nor\n#include “FileName” Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/21"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p22","title":"Preprocessor directives","text":"Instruction #define Declare / define a new function name or constant #define constant name constant value Define the constant named MAX with the value of 100 #define MAX 100 Instruction \n#define\nDeclare / define a new function \n name or constant\n#define constant name \nconstant value\n#define MAX 100\nDefine the constant \nnamed MAX with the \nvalue of 100 Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/22"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p23","title":"Preprocessor directives","text":"PREPROCESSOR DIRECTIVES - #define AGE 22 # #define AGE 22 • Lines starting with the '#' symbol is processed by the pre-processor, before compiling the program. • It does a search-and-replace command on a word processor (editor) #define ‹constant name> \u003cconstant value> • Name of constant • Usually written in CAPITAL letters • Value assigned to AGE PREPROCESSOR DIRECTIVES \n–\n \n#define AGE 22\n# • Lines starting with the ‘#’ symbol is processed by \nthe pre-processor, before compiling the program.\n#define • It does  a search-and-replace command on a word \nprocessor (editor)\nAGE • Name of constant\n• Usually written in CAPITAL letters\n22 • Value assigned to AGE\n#define \u003cconstant name>  \u003cconstant value> Preprocessor directives II A8; supports I B1(c)(i)","route":"notes/03/23"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p24","title":"Choose the right header","text":"HEADER FILES • Header files used in the program are listed here. • Header File provides Prototype declaration for different library functions. > We can also include user define header file. • #include \u003ciostream> is a header file library that lets us work with input and output objects, such as > Header files add functionality to C++ programs. HEADER FILES\nHeader files used in the program are listed here.\nHeader File provides Prototype declaration for different library \nfunctions.\nWe can also include user define header file.\n#include \u003ciostream> is a header file library that lets us work with \ninput and output objects, such as \nHeader files add functionality to C++ programs. Choose the right header II A8; supports I B1(c)(i)","route":"notes/03/24"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p25","title":"Choose the right header","text":"HEADER FILES • Code files (with a .cpp extension) are not the only files commonly seen in programs. > The other type of file is called a header file, sometimes known as an include file. • Header files almost always have a .h extension. • The purpose of a header file is to hold declarations for other files to use. HEADER FILES\nCode files (with a .cpp extension) are not the only files commonly \nseen in programs. \nThe other type of file is called a header file, sometimes known as \nan include file. \nHeader files almost always have a .h extension. \nThe purpose of a header file is to hold declarations for other files \nto use. Choose the right header II A8; supports I B1(c)(i)","route":"notes/03/25"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p26","title":"Choose the right header","text":"HEADER FILES HEADER FILES iostream LIBRARY FUNCTIONS cin cout math pow(x,y) sqrt(x) exp(x) USES Receives input from keyboard Displays output on screen • Receives input in the form of string • Receives a character as input • Displays output in string form Computes the value of x raised to the power of y • Computes the square root of x • Computes the exponent value of x HEADER FILES\nHEADER \nFILES\nLIBRARY \nFUNCTIONS\nUSES\niostream cin\ncout\n Receives input from keyboard\n Displays output on screen\n Receives input in the form of string\n Receives a character as input\n Displays output in string form \nmath pow(x,y)\nsqrt(x)\nexp(x)\n Computes the value of x raised to the \npower of y\n Computes the square root of x\n Computes the exponent value of x Choose the right header II A8; supports I B1(c)(i)","route":"notes/03/26"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p27","title":"Choose the right header","text":"HEADER FILES HEADER FILES LIBRARY FUNCTIONS ctype string conio isalnum(c) isdigit(c) ispunct(c) islower(c) strlen(c) strncmp(c) strtok(c) strncpy(c) clrscr() USES To test whether c is alphabetic or digit To test whether c is a numeric • To test whether c is a punctuation mark • To test whether c is a lower case character • To get the length of a string • Compares the part of two strings • Splits string into words Copies one part of a chosen string Clears the output screen HEADER FILES\nHEADER \nFILES\nLIBRARY \nFUNCTIONS\nUSES\nctype isalnum(c)\nisdigit(c)\nispunct(c)\nislower(c)\n To test whether c is alphabetic or  digit\n To test whether c is a numeric\n To test whether c is a punctuation mark\n To test whether c is a lower case character\nstring strlen(c)\nstrncmp(c)\nstrtok(c)\nstrncpy(c)\n To get the length of a string \n Compares the part of two strings \n Splits string into words\n Copies one  part of a chosen string\nconio clrscr()  Clears the output screen Choose the right header II A8; supports I B1(c)(i)","route":"notes/03/27"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p28","title":"main(), namespaces and function bodies","text":"MAIN FUNCTIONS > Every C++ program contains a main function which is called main() > Each and every C++ program always starts with main function. > This is entry point for all the function. Each and every method is called indirectly through main. > Program execution starts from this main function. > main() function has two parts: Head body MAIN FUNCTIONS\nEvery C++ program contains a main function which is called main()\nEach and every C++ program always starts with main function.\nThis is entry point for all the function. Each and every method is called \nindirectly through main.\nProgram execution starts from this main function.\nmain() function has two parts: \n Head \n body main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/28"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p29","title":"main(), namespaces and function bodies","text":"SYNTAX Data_type function_name(parameter) { l/variable // C++ statements void main () variable declaration C++ statement main() (i) head Example char b; b = 'A' ; (ii) body  main() \n{ \n char b; \nb = ‘A’; \n} \n(i) head \n(ii) body \nvoid main()\n{  variable declaration\n   C++ statement\n}\nData_type function_name(parameter)\n{  //variable\n   // C++ statements\n}\nSYNTAX\nExample main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/29"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p30","title":"main(), namespaces and function bodies","text":"MAIN FUNCTIONS Head • Every function must have a header. • Function header is the name of that function. • main() function has a fixed name. • We cannot change the name of main( ) function MAIN FUNCTIONS\nHead\n◦ Every function must have a header. \n◦ Function header is the name of that function.\n◦ main() function has a fixed name.\n◦ We cannot change the name of main( ) function main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/30"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p31","title":"main(), namespaces and function bodies","text":"MAIN FUNCTIONS Body • Every function must have a body which starts with an open curly bracket \"' and ends with a close curly bracket \". • Every body function contains a program statement. • A program statement will perform certain tasks such as receiving value, display value, calculation and so on. MAIN FUNCTIONS\nBody\n◦ Every function must have a body which starts with an open curly \nbracket  ‘{’ and ends with a close curly bracket ‘}’.\n◦ Every body function contains a program statement.\n◦ A program statement will  perform certain  tasks such as receiving \nvalue, display value, calculation and so on. main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/31"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p32","title":"return statements","text":"RETURN STATEMENT > The return statement returns the flow of the execution to the function from where it is called. > This statement does not mandatorily need any conditional statements. • As soon as the statement is executed, the flow of the program stops immediately and return the control from where it was called. • The return statement may or may not return anything for a void function, but for a non-void function, a return value is must be returned. >Syntaх: return[expression]; RETURN STATEMENT\nThe return statement returns the flow of the execution to the function from \nwhere it is called.\nThis statement does not mandatorily need any conditional statements.\n As soon as the statement is executed, the flow of the program stops \nimmediately and return the control from where it was called.\nThe return statement may or may not return anything for a void function, but \nfor a non-void function, a return value is must be returned.\nSyntax:\n return statements I B2(c)(ii),(iii); II B2(c)(iii)","route":"notes/03/32"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p33","title":"main(), namespaces and function bodies","text":"Using namespace std; All the elements of the standard C++ library are declared within what is called a namespace. In this case the namespace with the name std. We put this line in to declare that we will make use of the functionality offered in the namespace std. This line of code is used very frequent in C+ + programs that use the standard library. // program without using namespace std #include\u003ciostream› int main() std: : cout « \"HELLO WORL\"; return 0; Using namespace std;\nAll the elements of the standard C++ library \nare declared within what is called a \nnamespace. \nIn this case the namespace with the name \nstd. We put this line in to declare that we will \nmake use of the functionality offered in the \nnamespace std. \nThis line of code is used very frequent in \nC++ programs that use the standard library. \n main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/33"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p34","title":"main(), namespaces and function bodies","text":"INDENTION AND SPACING As you can see the cout and the return statement have been indented or moved to the right side. This is done to make the code more readable. In a program as Hello World, it seems a stupid thing to do. But as the programs become more complex, you will see that it makes the code more readable. (Also you will make fewer errors, like forgetting a curly bracket on the end of a function). int main() cout « \"Hello World!\"; return 0; } INDENTION AND SPACING\nAs you can see the cout and the return statement have been \nindented or moved to the right side. \nThis is done to make the code more readable. In a program as Hello \nWorld, it seems a stupid thing to do. But as the programs become \nmore complex, you will see that it makes the code more readable. \n(Also you will make fewer errors, like forgetting a curly bracket on the \nend of a function). int main() \n{ \ncout \u003c\u003c \"Hello World!\"; \nreturn 0;\n} main(), namespaces and function bodies I B1(c)(i); II B1(c)(iii)","route":"notes/03/34"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p35","title":"Input and output","text":"BACKSLASH CHARACTER CONSTANT Code The backslash character constant is also known as the 'Escape Sequence'. Certain characters such as the backspace and carriage return are not printable characters and these characters pose special problems when printing using text editor. The backslash character constant is used together with other character constant when such problems are encountered. In Ir It la Meaning Backspace Form feed Newline Carriage return Horizontal tab Double quote Single quote character Backslash Vertical tab Alert BACKSLASH CHARACTER \nCONSTANT\nThe backslash character constant is also known \nas the ‘Escape Sequence’. \nCertain characters such as the backspace and \ncarriage return are not printable characters and \nthese characters pose special problems when \nprinting using text editor. \nThe backslash character constant is used \ntogether with other character constant when \nsuch problems are encountered.\nCode Meaning\n\\b Backspace\n\\f Form feed\n\\n Newline\n\\r Carriage return\n\\t Horizontal tab\n\\” Double quote\n\\” Single quote character\n\\\\ Backslash\n\\v Vertical tab\n\\a Alert Input and output II A12,A13; II B1(c)(iii)","route":"notes/03/35"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p36","title":"Input and output","text":"//ct+ code to show using return statement //with a value in void return type function // and format code #include \u003ciostream› using namespace std; //void method void print() cout « \"Welcome It to DFC 20113 In Programming Fundamental\"; //driver method int main() //calling print method print(); return 0j  Input and output II A12,A13; II B1(c)(iii)","route":"notes/03/36"},{"kind":"notes","source":"03","score":4,"label":"Chapter 2 · Fundamentals · p37","title":"Readable code and good practice","text":"CODING STANDARDS BEST PRACTICES Use consistent indentation There is no right or wrong indentation that everyone should follow. The best style, is a consistent style. Once you start competing in large projects you'll immediately understand the mportance of consistent code styling. Follow the DRY Principle DRY stands for \"Don't Repeat Yourself. The same piece of code should not be repeated over and over again. Avoid Deep Nesting o many levels of nesting can make code harder to read and follow. CODING STANDARDS BEST \nPRACTICES\nUse consistent indentation\nThere is no right or wrong indentation that everyone should follow. The best style, is a \nconsistent style. Once you start competing in large projects you’ll immediately understand the \nimportance of consistent code styling.\nFollow the DRY Principle\nDRY stands for “Don’t Repeat Yourself.\nThe same piece of code should not be repeated over and over again.\nAvoid Deep Nesting\nToo many levels of nesting can make code harder to read and follow. Readable code and good practice Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/03/37"},{"kind":"notes","source":"03","score":4,"label":"Chapter 2 · Fundamentals · p38","title":"Readable code and good practice","text":"Limit line length Long lines are hard to read. It is a good practice to avoid writing horizontally long lines of code. File and folder structure You should avoid writing all of your code in one of 1-2 files. That won't break your app but it would be a nightmare to read, debug and maintain your application later. Keeping a clean folder structure will make the code a lot more readable and maintainable. Naming conventions Use of proper naming conventions is a well known best practice. Is a very common issue where developers use variables like X1, Y1 and forget to replace them with meaningful ones, causing confusion and making the code less readable. Limit line length \nLong lines are hard to read. It is a good practice to avoid writing horizontally long \nlines of code.\nFile and folder structure\nYou should avoid writing all of your code in one of 1-2 files. That won’t break your \napp but it would be a nightmare to read, debug and maintain your application later.\nKeeping a clean folder structure will make the code a lot more readable and \nmaintainable.\nNaming conventions\nUse of proper naming conventions is a well known best practice. Is a very common \nissue where developers use variables like X1, Y1 and forget to replace them with \nmeaningful ones, causing confusion and making the code less readable. Readable code and good practice Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/03/38"},{"kind":"notes","source":"03","score":4,"label":"Chapter 2 · Fundamentals · p39","title":"Readable code and good practice","text":"For example: 1 if (a) { if (b) { if (c) { 11 12 13 Can be written as: if (a) { return ... } if (b) { return ... } if (c) { return ... 9 10 11 For example: if (a \u003c 0 &8 b > 0 && c == 0) { return true; } else { ...return false; Can be written as: return a ‹ 0 && b > 0 8& c == 0; Keep the code simple The code should always be simple. Complicated logic for achieving simple tasks is something you want to avoid as the logic one programmer implemented a requirement may not make perfect sense to another. So, always keep the code as simple as possible. Keep the code simple\nThe code should always be simple. Complicated \nlogic for achieving simple tasks is something you \nwant to avoid as the logic one programmer \nimplemented a requirement may not make \nperfect sense to another. So, always keep the \ncode as simple as possible. Readable code and good practice Syllabus support; no direct item identified in the two DFC10353 \nConstant VariableTypes Identifiers and reserved words I A9; II A9; II B1(c)(i)","route":"notes/03/43"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p44","title":"Identifiers and reserved words","text":"NAMING IDENTIFIER RULES Naming identifier rules: • Must begin with a letter of the alphabet but, after the first letter, it can contain: • Letters: A......Z, a........z • Number : 0......9 • Underscore character: _ • Identifier names are case-sensitive (example: the identifier \"mYNUMBER\" is different from the identifier IMYNUMBER\"). • Cannot be more than 31 characters. NAMING IDENTIFIER RULES\nNaming identifier rules:\n◦ Must begin with a letter of the alphabet but, after the first letter, it can \ncontain:\n◦ Letters:  A……Z, a……..z\n◦ Number : 0……9\n◦ Underscore character: _\n◦ Identifier names are case-sensitive (example: the identifier \"mYNUMBER\" is \ndifferent from the identifier \"MYNUMBER\"). \n◦ Cannot be more than 31 characters. Identifiers and reserved words I A9; II A9; II B1(c)(i)","route":"notes/03/44"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p45","title":"Identifiers and reserved words","text":"NAMING IDENTIFIER RULES • Identifier names cannot be the same as the C++ reserved words. • Identifier names cannot have spaces. • Examples : my age count num student 10 • Identifier names cannot have special characters (typographic symbols). • Examples : ? ~ + NAMING IDENTIFIER RULES\n◦ Identifier names cannot be the same as the C++ reserved words.\n◦ Identifier names cannot have spaces.\n◦ Examples :   my  age count  num   student  10\n◦ Identifier names cannot have special characters (typographic symbols).\n◦ Examples :   ?     / ~ @ + $ Identifiers and reserved words I A9; II A9; II B1(c)(i)","route":"notes/03/45"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p46","title":"Variable declarations","text":"VARIABLES > A variable is a place to store a piece of information • Variable provides one mechanism to identify each data using one special name. > Each data used for computer program is stored in a variable. >Variables represent memory locations where the value may change. >Variables are like the storing boxes to a computer program. VARIABLES\nA variable is a place to store a piece of information\nVariable provides one mechanism to identify each data using one \nspecial name.\nEach data used for computer program is stored in a variable.\nVariables represent memory locations where the value may \nchange.\nVariables are like the storing boxes to a computer program. Variable declarations I A12; II A10; supports both B1(c)","route":"notes/03/46"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p47","title":"Variable declarations","text":"VARIABLES Each variable has: • Name • Type • Holds a value that you assign to them Declaration format : • Datatype variable_name; VARIABLES\nEach variable has:\n◦Name\n◦Type\n◦Holds a value that you assign to them\nDeclaration format :\n◦Datatype variable_name; Variable declarations I A12; II A10; supports both B1(c)","route":"notes/03/47"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p48","title":"Variable declarations","text":"EXAMPLE DECLARATION VARIABLE int bilangan; float berat; char abjad; EXAMPLE DECLARATION \nVARIABLE\nint bilangan;\nfloat berat;\nchar abjad; Variable declarations I A12; II A10; supports both B1(c)","route":"notes/03/48"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p49","title":"Constants","text":"CONSTANT The value of constant remains unchanged for the whole duration of the program execution. Every constant has : • Name • Type • Values that are set to them CONSTANT\nThe value of constant remains unchanged for the whole duration of \nthe program execution.\nEvery constant has :\n◦ Name\n◦ Type\n◦ Values that are set to them Constants I A11","route":"notes/03/49"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p50","title":"Constants","text":"CONSTANT DECLARATION Syntax : const data_type constant_name = constant_value; #define constant_name constant_value Examples : • const double PI = 3.1459; • #define PI 3.1459 CONSTANT DECLARATION\nSyntax :\n     \nExamples :\n◦ const double PI = 3.1459;\n◦ #define PI 3.1459\nconst  data_type constant_name = constant_value;\n#define constant_name  constant_value Constants I A11","route":"notes/03/50"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p51","title":"Constants","text":"EXAMPLE //Identifier declaration : constant and variable #include \u003ciostream.h) void main () const float pi =3.142; int bilangan; float berat; char abjad; } EXAMPLE\n Constants I A11","route":"notes/03/51"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p52","title":"Initialize before reading","text":"INITIALIZE VARIABLE Method 1 (Declaring the variable and then initializing it) int a = 5; Method 2 (Initializing a variable using parenthesis) int a (5) ; Method 3 (Initializing a variable using braces) int a{5} ; Method 4 (Declaring a variable using auto class) auto a = 5; 'auto' is a keyword which tells the compiler the type of the variable upon its initialization INITIALIZE VARIABLE\nMethod 1 (Declaring the variable and then \ninitializing it)\nMethod 2 (Initializing a variable using parenthesis)\nMethod 3 (Initializing a variable using braces)\nMethod 4 (Declaring a variable using auto class)\n‘auto’ is a keyword which tells the compiler the \ntype of the variable upon its initialization\n Initialize before reading I B2(a)(iii) has an uninitialized total; supporting skill","route":"notes/03/52"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p53","title":"Initialize before reading","text":"INITIALIZE VARIABLE Method 5 (Declaring and Initializing a variable through 'auto' keyword with parenthesis) Method 6 (Declaring and Initializing a variable through 'auto' keyword with braces) Method 7 (Dynamic Initialization) auto a (5); auto a{5}; int a; cin›>a; INITIALIZE VARIABLE\nMethod 5 (Declaring and Initializing a \nvariable through ‘auto’ keyword with \nparenthesis)\nMethod 6 (Declaring and Initializing a \nvariable through ‘auto’ keyword with \nbraces)\nMethod 7 (Dynamic Initialization)\n Initialize before reading I B2(a)(iii) has an uninitialized total; supporting skill","route":"notes/03/53"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p54","title":"Initialize before reading","text":"UNITIALIZE VARIABLE C++ does not initialize most variables to a given value (such as zero) automatically. Thus, when a variable is assigned a memory location by the compiler, the default value of that variable is whatever (garbage) value happens to already be in that memory location A variable that has not been given a known value (usually through initialization or assignment) is called an uninitialized variable. UNITIALIZE VARIABLE\nC++ does not initialize most variables to a given value (such as \nzero) automatically. \nThus, when a variable is assigned a memory location by the \ncompiler, the default value of that variable is whatever \n(garbage) value happens to already be in that memory location\nA variable that has not been given a known value (usually \nthrough initialization or assignment) is called an uninitialized \nvariable. Initialize before reading I B2(a)(iii) has an uninitialized total; supporting skill","route":"notes/03/54"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p55","title":"Initialize before reading","text":"TRACE THE OUTPUT #include \u003ciostream› using namespace std; int main() // define an integer variable named x int x; // this variable is uninitialized because we haven't given it a value // print the value of x to the screen cout « x; // who knows what we'll get, because x is uninitialized return 0; TRACE THE OUTPUT\n Initialize before reading I B2(a)(iii) has an uninitialized total; supporting skill","route":"notes/03/55"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p56","title":"Local and global variables","text":"VARIABLE SCOPE There are two main variable scopes: • Local variable • Global variable #include\u003ciostream› using namespace stdiGlobal Variable // global variable int global = 5; // main function int main() Local variable // local variable with same // name as that of global variable int global = 2; cout « global « end1; VARIABLE SCOPE\nThere are two main variable scopes:\n◦ Local variable\n◦ Global variable\n Local and global variables I A10","route":"notes/03/56"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p57","title":"Local and global variables","text":"LOCAL VARIABLE • It is a variable that has been defined immediately after the opening braces of a function. • Each functions can have their own variables declarations. • You can access (and change) local variables only from the functions in which they are defined. Therefore that variable's scope is protected. • All local variables lose their definition when their block ends. LOCAL VARIABLE\n◦ It is a variable that has been defined immediately after the \nopening braces of a function.\n◦ Each functions can have their own variables declarations.\n◦ You can access (and change) local variables only from the \nfunctions in which they are defined.  Therefore that variable's \nscope is protected.\n◦ All local variables lose their definition when their block ends. Local and global variables I A10","route":"notes/03/57"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p58","title":"Local and global variables","text":"LOCAL VARIABLE Finclude \u003cstalo.n. FunctionName Il int A; /*Block of one or more *luw L*C statements*/ } Local Variable LOCAL VARIABLE\n Local and global variables I A10","route":"notes/03/58"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p59","title":"Local and global variables","text":"TRACE THE OUTPUT // CPP program to illustrate // usage of local variables #include\u003ciostream› using namespace std; void func () // this variable is local to the // function func() and cannot be // accessed outside this function int age=18; int main() cout\u003c\u003c\"Age is: \"\u003c\u003cage; return 0; TRACE THE OUTPUT\n Local and global variables I A10","route":"notes/03/59"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p60","title":"Local and global variables","text":"TRACE THE OUTPUT // CPP program to illustrate // usage of local variables #include\u003ciostream› using namespace std; void func() // this variable is local to the // function func () and cannot be // accessed outside this function int age=18; cout‹\u003cage; int main() cout\u003c\u003c\"Age is: \"; func () ; return 0; TRACE THE OUTPUT\n Local and global variables I A10","route":"notes/03/60"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p61","title":"Local and global variables","text":"GLOBAL VARIABLE • A global variable is a variable that has been defined before a function (usually before the main() function). • This means, all function in that program can use this variable. • Global variables can be used anywhere in the program as soon as it has been defined. GLOBAL VARIABLE\n◦ A global variable is a variable that has been defined before a \nfunction (usually before the main() function).\n◦ This means, all  function in that program can use this variable.\n◦ Global variables can be used anywhere in the program as soon \nas it has been defined. Local and global variables I A10","route":"notes/03/61"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p62","title":"Local and global variables","text":"VARIABLE SCOPE #include \u003cstdio.h> char B; n3ssssss functtenNamell int A: /*Block of one or more */ /*C statements*/ Global Variable VARIABLE SCOPE \n Local and global variables I A10","route":"notes/03/62"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p63","title":"Local and global variables","text":"TRACE THE OUTPUT // CPP program to illustrate // usage of global variables #include\u003ciostream› using namespace std; // global variable int global = 5; // global variable accessed from // within a function void display() cout\u003c\u003cglobal\u003c‹endl; // main function int main () display(); // changing value of global // variable from main function global = 10; display(); TRACE THE OUTPUT\n Local and global variables I A10","route":"notes/03/63"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p64","title":"Local and global variables","text":"TRACE THE OUTPUT // C+t program to show that we can access a global #include\u003ciostream› using namespace std; // Global Y int y = 0; int main () // Local x int x = 10; cout « \"Value of global x is \" « Y; cout‹‹ \"\\nValue of local x is \" ‹ x; return 0; TRACE THE OUTPUT\n Local and global variables I A10","route":"notes/03/64"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p65","title":"Local and global variables","text":"LOCAL VARIABLE VS GLOBAL VARIABLE Local Vs Global Parameter Scope Value Local It is declared inside a function. If it is not initialized, a garbage value is stored Global It is declared outside the function. If it is not initialized zero is stored as default. LOCAL VARIABLE VS GLOBAL \nVARIABLE\nParameter Local Global \nScope It is declared inside a \nfunction. \nIt is declared outside the \nfunction. \nValue If it is not initialized, a \ngarbage value is stored \nIf it is not initialized zero is \nstored as default.  Local and global variables I A10","route":"notes/03/65"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p66","title":"Identifiers and reserved words","text":"KEYWORDS/ RESERVED WORD •Special word / standard in the standard library •Has a specific purpose that is understood by the compiler •Not valid if it is used for another purposes •Reserved word are also called keywords. Must be typed / written in lowercase (case-sensitive) Cannot be used as the name of identifier (constant & variable) KEYWORDS/ RESERVED WORD\nSpecial word / standard in the standard library \nHas a specific purpose that is understood by the compiler \nNot valid if it is used for another purposes\nReserved word are also called keywords.\nMust be typed / written\nin lowercase\n(case-sensitive)\nCannot be used as the \nname of identifier\n(constant & variable) Identifiers and reserved words I A9; II A9; II B1(c)(i)","route":"notes/03/66"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p67","title":"Identifiers and reserved words","text":"KEYWORDS/ RESERVED WORD and bool compl do export goto namespace or eg птайт return struct try unsigned xor and eo break const double extern if new private short switch ypedei virtual xor ed asm Hsssss case const cast dynamic cast dfalse inline not protected signed templete typeid void auto catch continue else float int Ass65 not ed wwwsийит public sizeof 1S5s555555555 this -ypename volatile bitand char default enum for 1ong operator register static throw using wchar t bitor class delete explicit friend mutable or reinterpret cast static cast true union while KEYWORDS/ RESERVED WORD\n Identifiers and reserved words I A9; II A9; II B1(c)(i)","route":"notes/03/67"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p68","title":"Data types and suitable choices","text":"WHAT IS DATA Data is a collection of numbers, characters, alphabets, and special symbols etc. It can be processed to produce some meaningful information. It also can be modified by the computer into useful forms for human beings. WHAT IS DATA\nData is a collection of numbers, characters, alphabets, \nand special symbols etc.\nIt can be processed to produce some meaningful \ninformation.\nIt also can be modified by the computer into useful forms \nfor human beings. Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/68"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p69","title":"Data types and suitable choices","text":"BASIC DATA TYPES Data is divided into: Numeric Non Numeric Integer Character Float String Boolean Variable Data BASIC DATA TYPES\nData  is divided into:\nNumeric\nInteger  \nFloat\nNon Numeric\nCharacter\nString\nBoolean\n Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/69"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p70","title":"Data types and suitable choices","text":"BASIC DATA TYPES Numeric Contains all types of numbers. Data which can be used for calculation. INTEGER • All positive and negative numbers including zero and no decimal place. Example: o, +1, -10. • Integers are used to represent the counting of things. • Example: Numbers of month in a year (1,2,3..) FLOAT • Contains all real numbers. • The number will be stored in floating point. • Used for metric measurement, temperature and price. • Example: 1.0, 234.55, 20.30, 36.7. Non Numeric Contains all types of non-numbers. CHARACTER • Consists of all letters, numbers and special symbols. • Characters are surrounded by single quotation mark (''). • Example: 'A, 'm\"=, '#, '1'or\": STRING • A combination of one or more characters. • A string is surrounded by double quotation marks (\"\"). • Example: (\"WELCOME TO COSMOPOINT\") or (\"8758\"). BOOLEAN (LOGICAL VALUE) • Used in making yes-or-no decisions (T or F). • Example: To check 2 integers using If...Else control structure. BASIC DATA TYPES\n Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/70"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p71","title":"Data types and suitable choices","text":"BASIC DATA TYPES DATA TYPE int float double USES int is used to define integer numbers. float is used to define floating point numbers. A double is used to define BIG floating point numbers. It reserves twice the storage for the number. char A char defines characters. EXAMPLE CODE int Count; Count = 5; float Miles; Miles = 5.6; double Atoms; Atoms= 2 500 000.17; char Letter; Letter = 'x'; BASIC DATA TYPES\n Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/71"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p72","title":"Data types and suitable choices","text":"DATA TYPES INTEGER Used to declare numeric program variables of integer type includes positive, negative and zero numbers. • Keyword: int • Syntax: int identifier_name; • Example code : int number; number = 12; • Sample values: 4578 -4578 DATA TYPES INTEGER\nUsed to declare numeric program variables of integer type includes positive, \nnegative and zero numbers.\n◦ Keyword: int\n◦ Syntax:\n◦ Example code :\n◦ Sample values:  \n 4578   -4578      0\nint number;\nnumber = 12;\nint identifier_name; Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/72"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p73","title":"Data types and suitable choices","text":"DATA TYPES FLOAT Float is a floating point numbers with maximum 6 decimal place. • Keyword: float • Syntax: float identifier_name; • Example code: float height; height = 1.72; • Sample values: 95.274 95.24 0.265 DATA TYPES FLOAT\nFloat is a floating point numbers with maximum 6 decimal place.\n◦ Keyword: float\n◦ Syntax:\n◦ Example code:\n◦ Sample values:\n  95.274     95.24 0.265\nfloat height; \nheight = 1.72;\nfloat identifier_name; Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/73"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p74","title":"Data types and suitable choices","text":"DATA TYPES CHARACTER Example of characters: • Numeric digits: 0 - 9 • Lowercase/ uppercase letters: a - z and A - Z • Space (blank) • Special characters:, .;? \"/ () [] {} * & % ^ \u003c > etc • Syntax: char name_identifier; • Keyword: char • Example code: • Sample values: char gred; gred = 'В' 'd' \"4\" The declared character must be enclosed within a single quote! DATA TYPES CHARACTER\nExample of characters:\n◦ Numeric digits: 0 - 9\n◦ Lowercase/uppercase letters: a - z and A - Z\n◦ Space (blank)\n◦ Special characters: , . ; ? “ / ( ) [ ] { } * & % ^ \u003c > etc\n◦ Syntax: \n◦ Keyword: char\n◦ Example code:\n◦ Sample values:\n      ‘B’ ‘d’   ‘4’  ‘?’ ‘*’\nThe \ndeclared \ncharacter \nmust be \nenclosed \nwithin a \nsingle \nquote!\nchar gred;\ngred = ‘A’;\nchar name_identifier; Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/74"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p75","title":"Data types and suitable choices","text":"DATA TYPES BOOLEAN • Boolean is a new addition to C++. • Boolean values are either true or false. • Keyword: bool • Syntax: bool name_identifier; • To declare a variable of type bool: bool booleanVar = true; DATA TYPES BOOLEAN\n◦ Boolean is a new addition to C++.\n◦ Boolean values are either true or false.\n◦ Keyword: bool\n◦ Syntax: \n◦ To declare a variable of type bool:\n   bool booleanVar = true;\nbool name_identifier; Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/75"},{"kind":"notes","source":"03","score":10,"label":"Chapter 2 · Fundamentals · p76","title":"Data types and suitable choices","text":"DATA TYPES STRING String is a sequence of characters enclosed in double quotes. The empty string (null string) contains no characters and is written as \" • keyword: string To declare a variable of type string: string greeting=\"Hello\"; Sample values: \"Hello\" \"Year 2000\" \"1234\" DATA TYPES STRING\nString is a sequence of characters enclosed in double quotes.\nThe empty string (null string) contains no characters and is written as  “   \n”.\n◦ keyword: string\nTo declare a variable of type string:\nSample values:\n   “Hello”   “Year 2000”   “1234”\nstring greeting=“Hello”; Data types and suitable choices I A14; I B1(c)(ii); II A10; II B1(c)(ii)","route":"notes/03/76"},{"kind":"notes","source":"03","score":1,"label":"Chapter 2 · Fundamentals · p77","title":"Navigation / learning outcomes","text":"PART 3 PART 3 Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/03/77"},{"kind":"notes","source":"03","score":4,"label":"Chapter 2 · Fundamentals · p78","title":"Write, compile, link and run","text":"Develop C++ program using Integrated Development Enviroment (IDE). a. Get started with IDE b. Create a project file c. Create a simple C++ program d. Compile a C++ program e. Run a C+ + program Develop C++ program using Integrated Development \nEnviroment (IDE). \na. Get started with IDE \nb. Create a project file \nc. Create a simple C++ program \nd. Compile a C++ program \ne. Run a C++ program  Write, compile, link and run Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/03/78"},{"kind":"notes","source":"03","score":4,"label":"Chapter 2 · Fundamentals · p79","title":"Write, compile, link and run","text":"C++ PROGRAM Compiler First.cpp Source File First.obj Object File Windows Маc Linux C++ PROGRAM\n Write, compile, link and run Syllabus support; no direct item identified in the two DFC10353 papers.","route":"notes/03/79"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p80","title":"C++ program structure","text":"C++ PROGRAM //simple c+t program #include\u003ciostream› // header file included using namespace std; int main() cout‹‹\"simple c++ program \\n\"; // ct+ statement cout‹\u003c \"hello world\"; return 0; C++ PROGRAM\n C++ program structure I B1(c)(i); II A8; II B1(c)(iii)","route":"notes/03/80"},{"kind":"notes","source":"03","score":9,"label":"Chapter 2 · Fundamentals · p81","title":"C++ program structure","text":"Program 1: A C++ program which adds two integers #include \u003ciostream.h> preprocessor directive(s) main () { // A simple C++ program int x, y, sum; cout « \"A program which adds two integers\\n\"; cout « \"Enter 1st integer: \"; cin >> x; cout « \"Enter 2nd integer: \"; cin >> y; sum = x + y; cout « \"Sum is \" « sum « endl; return 0; program body Sample output (text in red is entered by user): A program which adds two integers Enter 1st integer: 3 Enter 2nd integer: 4 Sum is 7  C++ program structure I B1(c)(i); II A8; II B1(c)(iii)","route":"notes/03/81"},{"kind":"notes","source":"03","score":1,"label":"Chapter 2 · Fundamentals · p82","title":"Navigation / learning outcomes","text":"PART 4 PART 4 Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/03/82"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p83","title":"Syntax, runtime and logic errors","text":"ERROR IN PROGRAMMING 1. Syntax / Compile time error 2. Run-time error/ Linker error 3. Logic errors ERROR IN PROGRAMMING\n1. Syntax / Compile time error\n2. Run-time error/ Linker error\n3. Logic errors Syntax, runtime and logic errors I A7; II A11","route":"notes/03/83"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p84","title":"Syntax, runtime and logic errors","text":"SYNTAX ERROR DA compile time error (syntax error) refers to an error in the syntax of a sequence of characters or tokens that is intended to be written in a particular programming language. • For compiled languages syntax errors occur strictly at compile-time. A program will not compile until all syntax errors are corrected. •Errors that C++ can catch - easy to fix, because the compiler points you to where the problem is. main.cpp(4) : error C2143: gyntax error : misging ';' before ']' int main() Syntax error. - This error occurs due to following reason. I. Not following the grammatical rules used in declaration of identifier. II. Not declaring an identifier used in program. return 0 III. Not terminating statement by semicolon. IV. Not providing equal number of opening and closing braces etc. These errors can be rectified by the user as it is displayed while compiling the program. SYNTAX ERROR\nA compile time error (syntax error) refers to an error in the syntax of a \nsequence of characters or tokens that is intended to be written in a particular \nprogramming language.\n For compiled languages syntax errors occur strictly at compile-time. A \nprogram will not compile until all syntax errors are corrected.\nErrors that C++ can catch - easy to fix, because the compiler points you to \nwhere the problem is. \n Syntax, runtime and logic errors I A7; II A11","route":"notes/03/84"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p85","title":"Syntax, runtime and logic errors","text":"SYNTAX ERROR EXAMPLE // example of syntax error #include\u003ciostream› using namespace std; int main(){ int a=10; int b=5; int c c=a+bj cout‹\u003ccj return 0; Message In function 'int mainO': [Error] expected initializer before 'c' [Error] 'c' was not declared in this scope SYNTAX ERROR EXAMPLE\n Syntax, runtime and logic errors I A7; II A11","route":"notes/03/85"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p86","title":"Syntax, runtime and logic errors","text":"RUNTIME ERROR •A run-time error is detected only during the execution of the program. DAn error that occurs during the execution of a program. In contrast, compile-time errors occur while a program is being compiled. DRuntime errors indicate bugs in the program or problems that the designers had anticipated but could do nothing about. For example, running out of memory will often cause a runtime error. RUNTIME ERROR\nA run-time error is detected only during the execution of the program.\nAn error that occurs during the execution of a program. In contrast, \ncompile-time errors occur while a program is being compiled.\nRuntime errors indicate bugs in the program or problems that the \ndesigners had anticipated but could do nothing about. For example, \nrunning out of memory will often cause a runtime error. Syntax, runtime and logic errors I A7; II A11","route":"notes/03/86"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p87","title":"Syntax, runtime and logic errors","text":"RUNTIME ERROR EXAMPLE if (i > 10); і = 10; } a = n / 0;//division-by-zero Microsoft Visual C+ + Runtime Library Runtime Error! Program: IFred-nt4-serverlveritas|Wincon|seasw.exe abnormal program termination Runtime error: - This error occurs while running a program by displaying the message listed below. I. Division by O. II. Overflow III. Underflow RUNTIME ERROR EXAMPLE\nif (i > 10);\n{\ni = 10;\n} \na = n / 0; //division-by-zero\n Syntax, runtime and logic errors I A7; II A11","route":"notes/03/87"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p88","title":"Syntax, runtime and logic errors","text":"RUNTIME ERROR EXAMPLE // example of run time error error #include\u003ciostream› using namespace std; int main(){ int a=10; int b=0; int cj с=a/b; cout\u003c\u003cc; return 0; Compilation results... - Errors: 0 - Warnings: 0 - Output Filename: C:\\Users\\MOE\\Documents\\c++\\error.exe - Output Size: 1.83190059661865 MiB| - Compilation Time: 0.69s • CAUsers\\MOE\\Documents\\c++\\error.exe Process exited after 1.851 seconds with return value 3221225620 Press any key to continue.. . RUNTIME ERROR EXAMPLE\n Syntax, runtime and logic errors I A7; II A11","route":"notes/03/88"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p89","title":"Syntax, runtime and logic errors","text":"LOGICAL ERROR -A logical error (sometimes called a semantic error) is a bug in a program that causes it to operate incorrectly, but not to terminate abnormally (or crash). •A logic error produces unintended or undesired output or other behavior, although it may not immediately be recognized as such. •These errors are encountered when the program does not give the desired output, due to wrong logic of the program. • For example: remainder = а + b LOGICAL ERROR\nA logical error (sometimes called a semantic error) is a bug in a program that \ncauses it to operate incorrectly, but not to terminate abnormally (or crash).\nA logic error produces unintended or undesired output or other behavior, although it \nmay not immediately be recognized as such.\nThese errors are encountered when the program does not give the desired output, \ndue to wrong logic of the program.\nFor example:\n remainder = a + b Syntax, runtime and logic errors I A7; II A11","route":"notes/03/89"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p90","title":"Syntax, runtime and logic errors","text":"LOGIC ERROR EXAMPLE // example of Logic error #include\u003ciostream› using namespace std; Compilation results... - Errors: 0 - Warnings: 0 - Output Filename: C:\\Users\\MOE\\Documents\\c++\\error.exe - Output Size: 1.83193492889404 MiB| - Compilation Time: 0.67s main() { int ij for(i = 0; i\u003c5; i++); { cout\u003c\u003c(\"Hello World\"); •] C:\\Users\\MOE\\Documents\\c+ +'\\error.exe Hello World Process exited after 0.03162 seconds with return value 0 Press any key to continue .. . LOGIC ERROR EXAMPLE\n Syntax, runtime and logic errors I A7; II A11","route":"notes/03/90"},{"kind":"notes","source":"03","score":1,"label":"Chapter 2 · Fundamentals · p91","title":"Navigation / learning outcomes","text":"PART 5 PART 5 Navigation / learning outcomes Administrative page; no separate exam skill.","route":"notes/03/91"},{"kind":"notes","source" on operands. • In other words, we can say that an operator operates the operands. OPERATOR & EXPRESSION\n An operator is a symbol that tells the compiler to perform specific \nmathematical or logical manipulations\n Operators are the foundation of any programming language. \n Thus, the functionality of C++ programming language is incomplete \nwithout the use of operators. \n We can define operators as symbols that help us to perform specific \nmathematical and logical computations on operands.\n In other words, we can say that an operator operates the operands. Operators and expressions I B1(c)(iii); II A14; related R B1(b)","route":"notes/03/96"},{"kind":"notes","source":"03","score":8,"label":"Chapter 2 · Fundamentals · p97","title":"Operators and expressions","text":"OPERATOR & EXPRESSION DOperators are symbols used to represent computer operations. •These symbols have one or more special characters defined by programming language. •The operations that can be operated on variables are: • Assignment Operators • Arithmetic Operators Increment and Decrement Operators Relational Operators Logical Operators OPERATOR & EXPRESSION\nOperators are symbols used to represent computer operations.\nThese symbols have one or more special characters defined by \nprogramming language. \nThe operations that can be operated on variables are:\n Assignment Operators\n Arithmetic Operators\n Increment and Decrement Operators\n Relational Operators\n Logical Operators Operators and expressions I B1(c)(iii); II A14; related R B1(b)","route":"notes/03/97"},{"kind":"notes","source":"03","score":6,"label":"Chapter 2 · Fundamentals · p98","title":"Assignment and compound assignment","text":"ASSIGNMENT OPERATORS • Assignment operators are used to combine the '=' operator with one of the binary arithmetic operators. • Examples expression using assignment operators: • C=C+3 • d = d -4 • e =e* 5 • g=g% 9 • f=f/3 ASSIGNMENT OPERATORS\n Assignment operators are used to combine the '=' \noperator with one of the binary arithmetic operators.\n Examples expression using assignment operators:\n◦ c = c + 3\n◦ d = d - 4\n◦ e = e * 5\n◦ g = g % 9\n◦ f = f / 3 Assignment and compound assignment Supporting skill in array accumulation I A28; related R B1(b)(i),(ii)","route":"notes/03/98"},{"kind":"notes","source":"03","score":6,"label":"Chapter 2 · Fundamentals · p99","title":"Assignment and compound assignment","text":"ASSIGNMENT OPERATORS Expression a += b a *= 5 a -= 2 a %= 3 Meaning а=а+b a = a * 5 a =a - 2 а=а%З ASSIGNMENT OPERATORS\nExpression Meaning\na += b a = a + b\na *= 5 a = a * 5\na –= 2 a = a – 2\na %= 3 a = a % 3 Assignment and compound assignment Supporting skill in array accumulation I A28; related R B1(b)(i),(ii)","route":"notes/03/99"},{"kind":"notes","source":"03","score":6,"label":"Chapter 2 · Fundamentals · p100","title":"Assignment and compound assignment","text":"ASSIGNMENT OPERATORS - EXAMPLE #include \u003ciostream› using namespace std; int main() { int x = 10; x += 5; cout \u003c\u003c x; return 0; #include \u003ciostream› using namespace std; int main() { int x = 5; × *= 3; cout \u003c\u003c x; return 0; ASSIGNMENT OPERATORS - \nEXAMPLE \n Assignment and compound assignment Supporting skill in array accumulation I A28; related R B1(b)(i),(ii)","route":"notes/03/100"},{"kind":"notes","source":"03","score":7,"label":"Chapter 2 · Fundamentals · p101","title":"Arithmetic and integer division","text":"ARITHMETIC OPERATORS • Calculation operation that can be done on data in variables • Arithmetic operators include the familiar addition (+), subtraction (-), multiplication (*) and division (/) operations. • In addition there is the modulus operator (%) which gives the remainder left over from a division operation. ARITHMETIC OPERATORS\n Calculation operation that can be done on data in \nvariables\n Arithmetic operators include the familiar addition (+), \nsubtraction (-), multiplication (*) and division (/) \noperations. \n In
